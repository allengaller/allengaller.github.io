# ⚠️ 本文件不参与构建。
# 站点由 GitHub Actions（.github/workflows/deploy.yml）调用自研脚本 _scripts/build.py
# 生成 _site/ 后发布，Pages 的 Source 需设为 "GitHub Actions"。
# build.py 不读取本文件；此处 title/description/plugins/kramdown/relative_links
# 仅作为元数据声明保留，只有把 Pages 来源切回 "deploy from a branch" 时才会生效。
# 切回分支部署前必读：那条链路只认识被 git 跟踪的源文件，
# repos/<org>/<repo>/ 详情页、feed.xml、sitemap.xml 均由 build.py 生成，切回即消失。
title: Allen Galler
tagline: Cloud Native SRE · AI Toolsmith · Knowledge Architect
# description 不写具体数量：站内数字一律由 build.py 从 _data/repos.json 构建期派生，
# 而本文件不参与构建，任何字面数字都会随仓库增长变成假话。
description: 高产开源黑客的个人品牌总入口，聚合知识库、开源工具、内容矩阵与合作入口。
lang: zh-CN
url: https://allengaller.github.io

author:
  name: Allen Galler
  tagline: Cloud Native SRE · AI Toolsmith · Knowledge Architect

social:
  github: https://github.com/allengaller
  links: https://allengaller.github.io/topic/links/
  about: https://allengaller.github.io/about/

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

defaults:
  - scope:
      path: ""
    values:
      layout: "default"

plugins:
  - jekyll-relative-links
  - jekyll-sitemap

relative_links:
  enabled: true
  collections: true

exclude:
  - backup_*/
  - vendor/
  - _attic/
  - README.md
  - backup_README.md
  - skills-lock.json
  - .agents/
  - .claude/
  - .hermes/
  - .qoder/
