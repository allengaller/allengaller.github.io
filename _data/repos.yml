  description: '# ME - 个人档案生成器'
  readme_excerpt: '# ME - 个人档案生成器'
  readme_full: "# ME - 个人档案生成器\n\n> \U0001F680 通过友好的分步引导，创建属于您的 SOUL.md 个人档案\n\n[![Astro](https://img.shields.io/badge/Astro-4.x-BC52EE?logo=astro)](https://astro.build)\n\
    [![License](https://img.shields.io/badge/License-MIT-blue.svg)](LICENSE)\n\n## ✨ 特性\n\n- \U0001F3AF **分步引导** - 6 步简单操作，从基础信息到社区集成\n\
    - \U0001F504 **跨平台导入** - 支持从 GitHub 一键导入公开资料\n- \U0001F99E **龙虾社区集成** - 轻松配置跨平台 ID，实现信息快速同步\n- \U0001F4C4 **SOUL.md 生成**\
    \ - 标准化的个人档案 Markdown 文件\n- \U0001F4BE **本地存储** - 数据保存在浏览器本地，无需上传服务器\n- \U0001F3A8 **精美主页** - 自动生成美观的响应式个人主页\n\n## \U0001F680\
    \ 快速开始\n\n### 前置要求\n\n- Node.js >= 18.0.0\n- npm >= 9.0.0\n\n### 1. 安装依赖\n\n```bash\nnpm install\n```\n\n### 2. 启动开发服务器\n\
    \n```bash\nnpm run dev\n```\n\n访问 `http://localhost:4321` 开始使用 ME 工具。\n\n### 3. 构建生产版本\n\n```bash\nnpm run build\n```\n\
    \n构建产物在 `dist/` 目录。\n\n## \U0001F4D6 使用指南\n\n### 创建个人档案\n\n1. 访问首页，点击\"开始创建\"\n2. 按照 6 步向导填写信息：\n   - **步骤 1**: 基础信息（姓名、职位、简介等）\n\
    \   - **步骤 2**: 社交链接（GitHub、LinkedIn、Twitter 等）\n   - **步骤 3**: 技能专长（技术类别和熟练程度）\n   - **步骤 4**: 项目经历（项目描述、技术栈、亮点）\n  \
    \ - **步骤 5**: 工作经历（公司、职位、成就）\n   - **步骤 6**: 社区集成（龙虾社区等平台 ID）\n3. 在预览页面查看效果\n4. 导出 SOUL.md 或其他格式\n\n### 快速导入\n\n#### 从\
    \ GitHub 导入\n\n1. 在向导第一步点击\"从 GitHub 导入\"\n2. 输入 GitHub 用户名\n3. 自动获取头像、简介、仓库列表等信息\n\n#### 从文件导入\n\n1. 支持导入已有的 `profile.json`\
    \ 文件\n2. 拖放或选择文件即可自动解析\n\n### 导出格式\n\n| 格式 | 说明 | 用途 |\n|------|------|------|\n| **SOUL.md** | 标准化 Markdown | 开源社区个人档案\
    \ |\n| **JSON** | 结构化数据 | 程序处理、备份 |\n| **YAML** | 人类友好格式 | 配置文件 |\n\n## \U0001F99E 龙虾社区集成\n\nME 工具专为龙虾社区优化，支持：\n\n- 配置多个龙虾社区平台\
    \ ID\n- 预设社区标签\n- 一键生成社区可用的个人简介\n\n## \U0001F4C1 项目结构\n\n```\nme/\n├── src/\n│   ├── components/\n│   │   ├── wizard/\
    \          # 向导组件\n│   │   │   ├── ProgressBar.astro\n│   │   │   ├── FormField.astro\n│   │   │   └── WizardNav.astro\n\
    │   │   ├── import/          # 导入组件\n│   │   │   ├── GitHubImport.astro\n│   │   │   └── FileImport.astro\n│   │   └──\
    \ export/          # 导出组件\n│   │       └── SoulExport.astro\n│   ├── pages/\n│   │   ├── index.astro      # 工具首页\n│  \
    \ │   ├── wizard/          # 向导页面\n│   │   │   ├── index.astro\n│   │   │   ├── step-1.astro # 基础信息\n│   │   │   ├── step-2.astro\
    \ # 社交链接\n│   │   │   ├── step-3.astro # 技能专长\n│   │   │   ├── step-4.astro # 项目经历\n│   │   │   ├── step-5.astro # 工作经历\n\
    │   │   │   ├── step-6.astro # 社区集成\n│   │   │   └── complete.astro\n│   │   ├── preview.astro    # 预览页面\n│   │   └──\
    \ github.astro     # GitHub 重定向\n│   ├── utils/\n│   │   ├── soul-generator.js    # SOUL.md 生成\n│   │   ├── storage.js\
    \           # 本地存储\n│   │   ├── importers/           # 导入器\n│   │   │   ├── github.js\n│   │   │   └── json.js\n│   │\
    \   └── exporters/           # 导出器\n│   │       ├── soul.js\n│   │       ├── json.js\n│   │       └── yaml.js\n│   ├──\
    \ config/\n│   │   └── profile.json     # 示例配置文件\n│   └── layouts/\n│       └── Layout.astro\n├── public/\n│   └── images/\n\
    ├── scripts/                 # 维护脚本\n├── astro.config.mjs\n├── package.json\n└── README.md\n```\n\n## \U0001F6E0️ 技术栈\n\
    \n- **[Astro](https://astro.build/)** - 静态站点生成器\n- **原生 CSS** - 无 CSS 框架依赖\n- **LocalStorage** - 客户端数据持久化\n- **GitHub\
    \ API** - 公开资料导入\n\n## \U0001F310 部署\n\n### Vercel（推荐）\n\n```bash\nnpm install -g vercel\nvercel --prod\n```\n\n### GitHub\
    \ Pages\n\n1. 修改 `astro.config.mjs`：\n\n```javascript\nexport default defineConfig({\n  site: 'https://yourusername.github.io',\n\
    \  base: '/me',\n  // ...\n});\n```\n\n2. 推送代码并启用 GitHub Actions 自动部署\n\n## \U0001F4DD SOUL.md 格式\n\n生成的 SOUL.md 包含以下章节：\n\
    \n```markdown\n# SOUL.md - 您的姓名\n\n## Identity (身份识别)\n- Name: \n- Title:\n- Location:\n- Avatar:\n\n## Bio (个人简介)\n...\n\
    \n## Connect (社交链接)\n...\n\n## Skills (技能专长)\n...\n\n## Projects (项目作品)\n...\n\n## Experience (工作经历)\n...\n\n## Lobster\
    \ Communities (龙虾社区)\n- Platform: ID\n\n## Meta\n- Generated by: ME Tool\n- Version: 1.0\n```\n\n## \U0001F91D 贡献\n\n\
    欢迎提交 Issue 和 Pull Request！\n\n## \U0001F4C4 许可证\n\nMIT License - 详见 [LICENSE](LICENSE) 文件\n\n## \U0001F496 致谢\n\nMade\
    \ with ❤️ for the community\n"
