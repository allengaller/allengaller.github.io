  description: '# FDE Scope'
  readme_excerpt: '# FDE Scope'
  readme_full: "# FDE Scope\n\n> **The complete on-site operating system for a Forward Deployed Engineer.**\n> From first\
    \ gemba walk to signed-off handoff — across software/SaaS *and*\n> embodied-robotics / manufacturing. Built on [AgentScope\
    \ 2.0](https://github.com/agentscope-ai/agentscope).\n\nFDE is 2026's hottest AI role (OpenAI, Anthropic, Google, Palantir\
    \ all build FDE\nteams; listings up ~7× YoY). But every FDE shows up to a customer site and\nrebuilds the same workflow\
    \ from scratch — and most teams only model the \"build\"\nhalf, skipping the pre-engagement, operationalization, and handoff\
    \ zones that\nactually decide whether the engagement produces value.\n\n**FDE Scope codifies the *full* FDE standard operating\
    \ procedure** — 4 zones,\n18 phases — into an executable, gate-enforced state machine, with a parallel\n**industrial overlay**\
    \ (FAT/SAT, functional safety, CE/EU-AI-Act, works council,\nair-gap, shift handover) for manufacturing/robotics deployments.\n\
    \n```\nZone A · Pre-engagement  →  Zone B · Build  →  Zone C · Operationalization  →  Zone D · Handoff\n qualification\
    \               connect             slo / on-call                   ops handoff\n site survey (\U0001F3ED)           \
    \ corpus              runbook                         knowledge transfer\n stakeholder map             prototype-real\
    \       monitoring / drift              disengage (signed off)\n success criteria            deploy (\U0001F3ED FAT/SAT)\
    \  change-mgmt (\U0001F3ED works council)\n                             eval                flywheel → productize\n```\n\
    \nIt is **not** an agent application — it's an FDE's workbench: a CLI, a Web UI,\nand a Python library that turns the\
    \ SOP from a checklist into enforced engineering.\n\n---\n\n## ✨ What makes it different\n\n1. **Full SOP, not just \"\
    5 steps\".** The naive connect→corpus→deploy→eval→flywheel\n   model covers only the Build zone. FDE Scope adds the 4\
    \ pre-engagement phases,\n   5 operationalization phases, and 3 handoff phases that most teams skip — and\n   enforces\
    \ them with phase gates. See [`docs/fde_sop_full.md`](docs/fde_sop_full.md).\n2. **A real industrial overlay.** Manufacturing/robotics\
    \ engagements hit gates\n   that SaaS never does: FAT/SAT acceptance, functional safety\n   (ISO 13849 / IEC 61508 / ISO\
    \ 10218), CE/EU-AI-Act conformity, German works-council\n   co-determination (BetrVG §87), air-gapped deployment, shift\
    \ handover. Each is\n   an executable `Gate.check()` — it blocks advancement when blockers are present.\n3. **Scenario\
    \ profiles.** `ticket` (customer service) and `manufacturing`\n   (embodied-robotics factory) share one engine but differ\
    \ in connectors, KPIs,\n   and which gates apply. Manufacturing reports real production KPIs: OEE, MTBF/\n   MTTR, FPY/DPMO,\
    \ grasp success rate, collision/intervention rate.\n4. **Built on real AgentScope 2.0.** The runtime layer maps to the\
    \ *actual* 2.0.5\n   API — not the fictional `HarnessAgent`/`SequentialPipeline`/`EventSystem.on`\n   that appear in many\
    \ design docs. See\n   [`docs/agentscope_api_mapping.md`](docs/agentscope_api_mapping.md).\n5. **Zero-config runnable.**\
    \ The core data + engagement layers have **no**\n   AgentScope dependency — no LLM key, no Docker. `pip install -e \"\
    .[dev]\"` and\n   `pytest` is green. The Web UI is one extra.\n\n---\n\n## \U0001F680 Quick start\n\n```bash\n# install\
    \ (core + dev + web; no agentscope/docker/api-key needed)\npip install -e \".[dev]\"\n\n# ── Scenario 1: customer-service\
    \ tickets (the original) ──\nfde-scope connect --type csv --source examples/quickstart_csv/sample_tickets.csv\nfde-scope\
    \ corpus --input examples/quickstart_csv/sample_tickets.csv --out reports/corpus_report.html\n\n# ── Scenario 2: embodied-robotics\
    \ factory (the new one) ──\nfde-scope profiles                                    # see ticket + manufacturing\nfde-scope\
    \ engage init --customer \"BMW Spartanburg\" --profile manufacturing\nfde-scope kpi <engagement-id> --samples examples/quickstart_manufacturing/station_samples.jsonl\n\
    fde-scope gate list --profile manufacturing           # 10 gates, 6 industrial-only\n\n# ── Walk the full 18-phase SOP\
    \ with gate enforcement ──\nfde-scope engage advance <id>          # gate fails → refuses, shows blockers\nfde-scope engage\
    \ status <id>           # phase / zone / gate state / progress\nfde-scope handoff <id> --accept        # Zone D: assemble\
    \ the handoff package\n\n# ── Or do it all in the browser ──\nfde-scope web                          # → http://127.0.0.1:8080\n\
    ```\n\n### Web UI\n\n```bash\npip install -e \".[web]\"\nfde-scope web\n```\n\nA single-page engagement console: create\
    \ engagements, advance through the 18-phase\nSOP (gates block in red when unmet), inspect every gate's blockers/warnings,\n\
    upload a CSV to forge a corpus and view the HTML report, and compute profile-specific\nKPIs. All interactive, backed by\
    \ JSON APIs.\n\n---\n\n## \U0001F3D7 Architecture\n\n| Layer | Module | Role | agentscope? |\n|---|---|---|---|\n| **SOP**\
    \ | `engagement/` | 18-phase state machine + 10 enforceable gates + handoff | ❌ |\n| **Profiles** | `profiles/` | Scenario\
    \ selector (ticket / manufacturing) | ❌ |\n| 1 | `connectors/` | CSV★, Zammad, Salesforce, MySQL + OPC UA, MQTT-Sparkplug,\
    \ ROS2, MES, Historian | ❌ |\n| 2 | `corpus/` | PII scrub, dedup, quality gate, coverage, synthesis, report | ❌ |\n| 3\
    \ | `deploy/` | DockerWorkspace + PermissionEngine + KnowledgeBase assembly | ✅ lazy |\n| 4 | `eval/` | Ticket metrics\
    \ + manufacturing KPIs (OEE/MTBF/FPY/…) + bad-case miner | ❌ |\n| 5 | `flywheel/` | Concept→real event mapping + collectors\
    \ + retrain scheduler | ✅ lazy |\n| **Web** | `web/` | FastAPI engagement console | ❌ |\n\nSee [`docs/architecture.md`](docs/architecture.md)\
    \ and\n[`docs/fde_sop_full.md`](docs/fde_sop_full.md).\n\n---\n\n## \U0001F9EA Tests\n\n```bash\npip install -e \".[dev]\"\
    \npytest            # 91+ passed — core + engagement + gates + web, no agentscope needed\n```\n\n---\n\n## \U0001F4E6\
    \ Installation\n\n```bash\npip install -e \".\"                 # core only\npip install -e \".[dev]\"            # +\
    \ pytest + web test client\npip install -e \".[web]\"            # + FastAPI/uvicorn console\npip install -e \".[agentscope]\"\
    \    # + real AgentScope 2.0 runtime layer\npip install -e \".[full]\"           # everything\n```\n\n---\n\n## \U0001F4C4\
    \ Documentation\n\n- [`docs/fde_sop_full.md`](docs/fde_sop_full.md) — the 18-phase SOP, 12 anti-patterns, sources\n- [`docs/manufacturing_scenario.md`](docs/manufacturing_scenario.md)\
    \ — embodied-robotics factory end-to-end walkthrough\n- [`docs/architecture.md`](docs/architecture.md) — layered design\
    \ + data flow\n- [`docs/agentscope_api_mapping.md`](docs/agentscope_api_mapping.md) — design-doc fiction vs. real 2.0.5\
    \ API\n- [`docs/fde_playbook.md`](docs/fde_playbook.md) — on-site 72h playbook\n\n---\n\n## \U0001F5FA Roadmap\n\n- [\
    \ ] Real industrial protocol I/O (OPC UA via asyncua, MQTT via paho-mqtt, rosbag2 via rosbags)\n- [ ] Real LLM corpus\
    \ synthesis & quality scoring (drop-in behind existing signatures)\n- [ ] Real AgentScope agent startup (Docker workspace\
    \ + model wiring)\n- [ ] Full Zammad / Salesforce / MES / Historian HTTP/SQL implementations\n- [ ] AgentScope Studio\
    \ (npm `@agentscope/studio`) integration\n- [ ] Category-stratified train/eval/test split\n\n---\n\n## \U0001F4C4 License\n\
    \nMIT.\n"
