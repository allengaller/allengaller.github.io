  readme_full: "<p align=\"center\">\n  <img src=\"docs/assets/logo.svg\" alt=\"ResolveAgent Logo\" width=\"200\">\n</p>\n\
    \n<h1 align=\"center\">ResolveAgent</h1>\n\n<p align=\"center\">\n  <strong>2026 Agent Engineering | 面向问题解决的 AIOps 智能体</strong>\n\
    </p>\n\n<p align=\"center\">\n  <code>\U0001F9E0 Intelligent Selector</code> · <code>\U0001F333 Hybrid Planner</code>\
    \ · <code>\U0001F4BE Hierarchical Memory</code> · <code>\U0001F527 ToolHub</code> · <code>\U0001F504 Loop Engineering</code>\n\
    </p>\n\n<p align=\"center\">\n  <a href=\"https://github.com/ai-guru-global/resolve-agent/releases\"><img src=\"https://img.shields.io/github/v/release/ai-guru-global/resolve-agent?style=flat-square\"\
    \ alt=\"Release\"></a>\n  <a href=\"LICENSE\"><img src=\"https://img.shields.io/badge/License-Apache%202.0-blue.svg?style=flat-square\"\
    \ alt=\"License\"></a>\n  <a href=\"https://github.com/ai-guru-global/resolve-agent/actions\"><img src=\"https://img.shields.io/github/actions/workflow/status/ai-guru-global/resolve-agent/ci.yaml?branch=main&style=flat-square\"\
    \ alt=\"CI Status\"></a>\n  <a href=\"https://goreportcard.com/report/github.com/ai-guru-global/resolve-agent\"><img src=\"\
    https://img.shields.io/badge/Go-1.22-00ADD8.svg?style=flat-square&logo=go\" alt=\"Go\"></a>\n</p>\n\n---\n\n## \U0001F31F\
    \ Overview | 概述\n\n**ResolveAgent** 是基于 **2026 Agent Engineering** 最佳实践构建的生产级 AIOps 智能体平台。\n\n### 核心架构 | Core Architecture\n\
    \n```\n┌─────────────────────────────────────────────────────────────────────┐\n│                         RESOLVEAGENT\
    \                                 │\n│                                                                      │\n│  ┌──────────┐\
    \    ┌──────────────┐    ┌────────────────────────────┐ │\n│  │  Client  │───▶│   Higress    │───▶│     Platform (Go)\
    \          │ │\n│  │  CLI/UI  │    │   Gateway    │    │  Registry │ Auth │ Route   │ │\n│  └──────────┘    └──────────────┘\
    \    └────────────────────────────┘ │\n│                                            │                         │\n│   \
    \                                         ▼                         │\n│                          ┌─────────────────────────────────────┐\
    \   │\n│                          │       Agent Runtime (Python)         │   │\n│                          │         \
    \                             │   │\n│                          │  ┌─────────┐  ┌─────────┐  ┌───────┐ │   │\n│      \
    \                    │  │Selector │  │Planner │  │Memory │ │   │\n│                          │  │ +Audit  │  │+ReAct \
    \ │  │+Hub   │ │   │\n│                          │  └─────────┘  └─────────┘  └───────┘ │   │\n│                     \
    \     │                                      │   │\n│                          │  ┌─────────┐  ┌─────────┐  ┌───────┐\
    \ │   │\n│                          │  │   FTA   │  │ Skills  │  │  RAG  │ │   │\n│                          │  │ Engine\
    \  │  │ +ToolHub│  │Pipeline│ │   │\n│                          │  └─────────┘  └─────────┘  └───────┘ │   │\n│      \
    \                    │                                      │   │\n│                          │  ┌─────────────────────────────────┐\
    \ │   │\n│                          │  │   AgentMessageBus (Pub/Sub)     │ │   │\n│                          │  └─────────────────────────────────┘\
    \ │   │\n│                          └─────────────────────────────────────┘   │\n└─────────────────────────────────────────────────────────────────────┘\n\
    ```\n\n### 十二大架构特性 | 12 Architecture Highlights\n\n| # | 特性 | 模块 | 说明 |\n|---|------|------|------|\n| 1 | **Intelligent\
    \ Selector** | `selector/` | 意图分析 + 上下文丰富 + 路由决策 |\n| 2 | **Decision Audit Logger** | `selector/audit.py` | 完整路由决策审计追踪\
    \ |\n| 3 | **Hierarchical Memory** | `memory.py` | Working/Episodic/Long-term 三层记忆 |\n| 4 | **Hybrid Planner** | `planning.py`\
    \ | REACTIVE + DELIBERATIVE 双模式 |\n| 5 | **ToolHub** | `toolhub.py` | 工具发现 + Schema注册 + Capability映射 |\n| 6 | **Resilience**\
    \ | `resilience.py` | CircuitBreaker + FallbackCascade |\n| 7 | **AgentMessageBus** | `message_bus.py` | 订阅-发布消息总线 |\n\
    | 8 | **gRPC Server** | `runtime/server.py` | 带 HTTP fallback 的 gRPC 服务 |\n| 9 | **Resilient Selector** | `selector/resilient_selector.py`\
    \ | 反馈驱动自适应路由：失败重试 + 上下文重丰富 + 渐进降级 |\n| 10 | **Feedback Loop** | `pkg/feedback/` | Observe-Orient-Decide-Act 持续反馈闭环：信号收集\
    \ → 聚合 → 分发 |\n| 11 | **Circuit Breaker** | `pkg/circuitbreaker/` | 三态熔断器自愈运维：Closed → Open → HalfOpen → Closed |\n| 12\
    \ | **Adaptive Selector** | `selector/resilient_selector.py` | 基于反馈的权重动态调整 + 时间衰减 + 自动降级 |\n\n---\n\n## \U0001F3D7️ Architecture\
    \ Deep Dive | 架构深度解析\n\n### 1. Intelligent Selector | 智能选择器\n\n```python\n# selector/selector.py\nclass IntelligentSelector:\n\
    \    \"\"\"三层路由架构\"\"\"\n    async def route(input_text, agent_id, context):\n        # 1. Intent Analysis - 意图分类\n  \
    \      intent = await intent_analyzer.classify(input_text)\n\n        # 2. Context Enrichment - 上下文丰富\n        enriched\
    \ = await context_enricher.enrich(\n            input_text, agent_id, context\n        )\n        #   - 记忆查询 (MemoryClient)\n\
    \        #   - 偏好推断 (_infer_user_preferences)\n        #   - 代码检测 (_analyze_code_context)\n\n        # 3. Route Decision\
    \ - 路由决策\n        decision = await route_decider.decide(\n            intent_type=intent.type,\n            confidence=intent.confidence,\n\
    \            context=enriched\n        )\n\n        # 4. Audit Logging - 审计记录\n        await audit_logger.log(decision,\
    \ enriched, latency_ms)\n\n        return decision\n```\n\n**路由策略:**\n- `rule` - 快速精确模式\n- `llm` - LLM 智能分类\n- `hybrid`\
    \ - 规则优先 + LLM 回退 (推荐)\n\n### 2. Decision Audit Logger | 决策审计\n\n```python\n# selector/audit.py\n@dataclass\nclass AuditRecord:\n\
    \    timestamp: str\n    decision_type: str      # fta/skill/rag/direct\n    confidence: float\n    reasoning: str\n \
    \   context_snapshot: dict  # skills_count, code_issues, etc.\n    latency_ms: float\n```\n\n**特性:**\n- 异步写入，不阻塞主流程\n\
    - 支持持久化到 Go Platform Store\n- 完整的上下文快照\n\n### 3. Hierarchical Memory | 分层记忆\n\n```python\n# memory.py\nclass HierarchicalMemory:\n\
    \    \"\"\"三层记忆架构\"\"\"\n\n    # Layer 1: Working Memory (in-process)\n    working = WorkingMemory(max_size=20)  # Rolling\
    \ window\n\n    # Layer 2: Episodic Memory (Redis)\n    episodic = EpisodicMemoryClient(redis_url=\"redis://...\")\n\n\
    \    # Layer 3: Long-term Memory (RAG Vector DB)\n    long_term = LongTermMemoryClient(collection=\"long_term_memory\"\
    )\n```\n\n**记忆流动:**\n```\nUser Message → Working Memory (实时)\n             → Episodic Memory (session 压缩)\n          \
    \   → Long-term Memory (importance > 0.7)\n```\n\n### 4. Hybrid Planner | 混合规划器\n\n```python\n# planning.py\nclass PlanningMode(Enum):\n\
    \    REACTIVE = \"reactive\"      # 快速响应\n    DELIBERATIVE = \"deliberative\"  # 深思熟虑\n\nclass HybridPlanner:\n    async\
    \ def create_plan(goal, mode):\n        if mode == REACTIVE:\n            # 单步执行\n            return Plan(steps=[...])\n\
    \        else:\n            # LLM 分解为多步骤\n            return await self._llm_decompose_plan(goal)\n```\n\n**执行流程:**\n\
    ```\nDELIBERATIVE 模式:\n  1. LLM 分解目标 → 子步骤\n  2. 执行每步骤 → 监控状态\n  3. 失败时触发 Replan\n  4. 最多重试 3 次\n\nREACTIVE 模式:\n  1.\
    \ 直接 ReAct 循环\n  2. Thought → Action → Observation\n```\n\n### 5. ToolHub | 工具中心\n\n```python\n# toolhub.py\nclass ToolHub:\n\
    \    \"\"\"工具统一管理\"\"\"\n\n    registry = SchemaRegistry()      # Schema 版本管理\n    capability_map = CapabilityMap()  #\
    \ 能力索引\n    security = SecurityPolicy()       # 权限控制\n\n    async def execute(tool_name, parameters):\n        if not\
    \ security.can_use(tool_name, user_roles):\n            return {\"success\": False, \"error\": \"Access denied\"}\n\n\
    \        handler = discovery.get_handler(tool_name)\n        result = await handler(**parameters)\n\n        security.audit(tool_name,\
    \ user_id, \"execute\", success)\n        return result\n```\n\n**工具能力:**\n| 能力 | 说明 |\n|------|------|\n| `WEB_SEARCH`\
    \ | 网页搜索 |\n| `CODE_EXECUTION` | 代码执行 |\n| `FILE_OPERATIONS` | 文件操作 |\n| `CODE_ANALYSIS` | 代码分析 |\n| `SECURITY_SCAN` |\
    \ 安全扫描 |\n\n### 6. Resilience | 弹性模式\n\n```python\n# resilience.py\nclass CircuitBreaker:\n    \"\"\"熔断器保护下游服务\"\"\"\n\
    \n    failure_threshold = 5\n    reset_timeout = 30.0\n\n    # States: CLOSED → OPEN → HALF_OPEN → CLOSED\n\nclass FallbackCascade:\n\
    \    \"\"\"多级降级策略\"\"\"\n\n    async def execute(*strategies):\n        for strategy in strategies:\n            try:\n\
    \                return await strategy()\n            except Exception as e:\n                continue  # 尝试下一个\n    \
    \    return FallbackResult(success=False)\n```\n\n**降级路径:**\n```\nMCP Tool → Native Skill → LLM Direct → Cached Response\n\
    ```\n\n### 7. AgentMessageBus | 消息总线\n\n```python\n# message_bus.py\nclass AgentMessageBus:\n    \"\"\"订阅-发布消息总线\"\"\"\
    \n\n    async def subscribe(agent_id, channel, callback):\n        \"\"\"订阅频道\"\"\"\n\n    async def publish(message:\
    \ AgentMessage):\n        \"\"\"发布消息\"\"\"\n\n    async def request(sender, channel, content, timeout):\n        \"\"\"\
    请求-响应模式\"\"\"\n```\n\n**消息模式:**\n- **Pub/Sub** - 发布订阅\n- **Request/Response** - 请求响应 (带 correlation_id)\n- **Broadcast**\
    \ - 广播\n\n### 8. gRPC Server | gRPC 服务\n\n```python\n# runtime/server.py\nclass AgentExecutionServer:\n    async def start(self):\n\
    \        try:\n            # 优先使用 gRPC + Protobuf\n            server = grpc.aio.server()\n            agent_pb2_grpc.add_AgentExecutionServiceServicer_to_server(\n\
    \                AgentExecutionServicer(self._engine), server\n            )\n        except ImportError:\n          \
    \  # Fallback 到 aiohttp HTTP 服务器\n            await self._start_http_fallback()\n```\n\n### 9. Resilient Selector | 弹性自适应路由\n\
    \n```python\n# selector/resilient_selector.py\nclass ResilientSelector:\n    \"\"\"Feedback-driven adaptive routing with\
    \ graceful degradation\"\"\"\n    \n    MAX_RETRIES = 3\n    ROUTE_PRIORITY = [\"skill\", \"rag\", \"fta\", \"code_analysis\"\
    ]\n    \n    async def route_and_execute(self, input_text, agent_id, executor):\n        tried_routes = set()\n      \
    \  for attempt in range(self.MAX_RETRIES + 1):\n            # 1. Enrich context (first time: full, subsequent: incremental)\n\
    \            ctx = await self._enrich(input_text, agent_id, attempt, tried_routes)\n            \n            # 2. Route\
    \ decision (exclude tried routes)\n            decision = await self._selector.route(input_text, agent_id, context=ctx)\n\
    \            \n            # 3. Execute\n            result = await executor(decision)\n            if result.success:\n\
    \                return result\n            \n            # 4. Record failure for next iteration\n            tried_routes.add(decision.route_type)\n\
    \            ctx[\"last_failure\"] = {\"route\": decision.route_type, \"error\": result.error}\n        \n        # Final\
    \ fallback: Code Analysis\n        return await self._code_analysis_fallback(input_text, agent_id)\n```\n\n**降级路径:**\n\
    ```\nSkill (快速精确) → RAG (知识检索) → Workflow (LLM 推理) → Code Analysis (深度兜底)\n```\n\n**核心思想:** 每一次失败都不是浪费，而是为下一次路由决策提供更丰富的上下文。\n\
    \n### 10. Loop Engineering | 循环工程\n\n```\n┌─────────────────────────────────────────────────────────────────────┐\n│ \
    \                    Loop Engineering 闭环                            │\n├─────────────────────────────────────────────────────────────────────┤\n\
    │                                                                     │\n│  Observe          Orient           Decide \
    \          Act             │\n│  ┌─────────┐     ┌──────────┐     ┌──────────┐     ┌──────────┐   │\n│  │ Health  │  \
    \   │Aggregator│     │  Alert   │     │ Circuit  │   │\n│  │ Retry   │────▶│ (滑动    │────▶│  Engine  │────▶│ Breaker \
    \ │   │\n│  │ Workflow│     │  窗口)   │     │ (规则)   │     │ Adaptive │   │\n│  │ Telemetry    │          │     │     \
    \     │     │ Weight   │   │\n│  └─────────┘     └──────────┘     └──────────┘     └──────────┘   │\n│               \
    \                                      │             │\n│  ┌─────────────────────────────────────────────────▼──────────┐\
    \   │\n│  │              Feedback Dispatch                             │   │\n│  │         Log │ Webhook │ NATS      \
    \                         │   │\n│  └────────────────────────────────────────────────────────────┘   │\n└─────────────────────────────────────────────────────────────────────┘\n\
    ```\n\n**三大支柱:**\n\n| 支柱 | 说明 | 实现 |\n|------|------|------|\n| **持续反馈循环** | 信号收集 → 聚合 → 分发的闭环 | `pkg/feedback/` (Go)\
    \ + `fta/feedback_loop.py` (Python) |\n| **自愈运维** | 三态熔断器保护下游，自动恢复 | `pkg/circuitbreaker/` |\n| **自适应行为** | 基于反馈的路由权重动态调整\
    \ | `AdaptiveWeightAdjuster` |\n\n```python\n# Go: 发射反馈信号\ncollector.Emit(ctx, feedback.FeedbackSignal{\n    Source: \
    \  feedback.SourceHealth,\n    Event:    feedback.EventHealthDegraded,\n    Severity: feedback.SeverityWarn,\n    Message:\
    \  \"Service health degraded\",\n})\n\n# Python: FTA 工作流反馈循环\nloop = FeedbackLoop(history_window=100)\nsuggestions = loop.record(metrics)\n\
    # → [ImprovementSuggestion(target=\"selector\", priority=\"high\", ...)]\n```\n\n> \U0001F4D6 详见 [Loop Engineering 文档](docs/zh/loop-engineering.md)\n\
    \n### 11. Circuit Breaker | 三态熔断器\n\n```go\n// pkg/circuitbreaker/breaker.go\nbreaker := circuitbreaker.New(circuitbreaker.Config{\n\
    \    Name:             \"downstream-api\",\n    FailureThreshold: 5,\n    RecoveryTimeout:  30 * time.Second,\n    HalfOpenMaxCalls:\
    \ 3,\n    Observer:         feedbackObserver,  // 状态变化 → 反馈信号\n})\n\nerr := breaker.Execute(ctx, func(ctx context.Context)\
    \ error {\n    return callDownstreamAPI(ctx, request)\n})\n```\n\n**状态机:**\n```\nCLOSED  ──[failures >= 5]──▶  OPEN\n\
    \  ▲                            │\n  │                    [30s timeout]\n  │                            ▼\nCLOSED  ◀──[probe\
    \ ok]──  HALF_OPEN\n```\n\n### 12. Adaptive Selector | 自适应选择器\n\n```python\n# selector/resilient_selector.py\nadjuster\
    \ = AdaptiveWeightAdjuster(default_weight=1.0)\n\n# 每次执行后记录结果\nadjuster.record_outcome(\"skill\", success=True, latency_ms=120)\n\
    adjuster.record_outcome(\"rag\", success=False, latency_ms=3500)\n\n# 时间衰减：权重向中性值 1.0 回归\nadjuster.apply_decay(decay_factor=0.95)\n\
    \n# 获取当前权重\nweights = adjuster.get_weights()\n# → {\"skill\": 1.15, \"rag\": 0.85, \"fta\": 1.02, \"code_analysis\": 0.98}\n\
    ```\n\n---\n\n## \U0001F680 Quick Start | 快速开始\n\n### 环境要求\n\n| Dependency | Version |\n|------------|---------|\n| Go\
    \ | >= 1.22 |\n| Python | >= 3.11 |\n| Docker | >= 20.10 |\n\n### 启动服务\n\n```bash\n# 克隆仓库\ngit clone https://github.com/ai-guru-global/resolve-agent.git\n\
    cd resolve-agent\n\n# 启动依赖\nmake compose-deps\n\n# 构建\nmake build\n\n# 启动\nmake compose-up\n\n# 访问\n# - API: http://localhost:8080\n\
    # - WebUI: http://localhost:3000\n```\n\n### Python Agent 示例\n\n```python\nfrom resolveagent.selector.selector import\
    \ IntelligentSelector\nfrom resolveagent.memory import HierarchicalMemory\nfrom resolveagent.planning import HybridPlanner,\
    \ PlanningMode\n\n# 初始化\nselector = IntelligentSelector(strategy=\"hybrid\")\nmemory = HierarchicalMemory(session_id=\"\
    session-1\")\nplanner = HybridPlanner()\n\n# 路由请求\ndecision = await selector.route(\n    input_text=\"分析代码中的安全漏洞\",\n\
    \    agent_id=\"my-agent\"\n)\n# → RouteDecision(route_type=\"code_analysis\", confidence=0.85)\n\n# 规划执行 (Deliberative\
    \ 模式)\nplan = await planner.create_plan(\n    goal=\"诊断 API 500 错误\",\n    mode=PlanningMode.DELIBERATIVE\n)\n# → Plan(steps=[Step(gather_info),\
    \ Step(diagnose), Step(fix)])\n\n# 记忆管理\nmemory.add(\"user\", \"我想部署到 k8s\", importance=0.8)\nrecent = memory.get_recent(limit=10)\n\
    ```\n\n---\n\n## \U0001F4CA Feature Status | 功能状态\n\n> **v0.4.0** | 2026-07 Loop Engineering Complete\n\n### 架构组件\n\n\
    | 组件 | 状态 | 文件 |\n|------|------|------|\n| Intelligent Selector | \U0001F7E2 Ready | `selector/selector.py` |\n| Decision\
    \ Audit Logger | \U0001F7E2 Ready | `selector/audit.py` |\n| Context Enricher | \U0001F7E2 Ready | `selector/context_enricher.py`\
    \ |\n| Route Decider | \U0001F7E2 Ready | `selector/router.py` |\n| Hierarchical Memory | \U0001F7E2 Ready | `memory.py`\
    \ |\n| Hybrid Planner | \U0001F7E2 Ready | `planning.py` |\n| ReAct Executor | \U0001F7E2 Ready | `planning.py` |\n| ToolHub\
    \ | \U0001F7E2 Ready | `toolhub.py` |\n| Schema Registry | \U0001F7E2 Ready | `toolhub.py` |\n| Capability Map | \U0001F7E2\
    \ Ready | `toolhub.py` |\n| Security Policy | \U0001F7E2 Ready | `toolhub.py` |\n| Circuit Breaker (Python) | \U0001F7E2\
    \ Ready | `resilience.py` |\n| Fallback Cascade | \U0001F7E2 Ready | `resilience.py` |\n| Agent Message Bus | \U0001F7E2\
    \ Ready | `message_bus.py` |\n| Message Bus Registry | \U0001F7E2 Ready | `message_bus.py` |\n| gRPC Server | \U0001F7E2\
    \ Ready | `runtime/server.py` |\n| Resilient Selector | \U0001F7E2 Ready | `selector/resilient_selector.py` |\n| **Feedback\
    \ Collector** | \U0001F7E2 **New** | `pkg/feedback/collector.go` |\n| **Feedback Ring Buffer** | \U0001F7E2 **New** |\
    \ `pkg/feedback/ring_buffer.go` |\n| **Feedback Aggregator** | \U0001F7E2 **New** | `pkg/feedback/aggregator.go` |\n|\
    \ **Feedback Dispatchers** | \U0001F7E2 **New** | `pkg/feedback/dispatcher.go` |\n| **Alert Engine** | \U0001F7E2 **New**\
    \ | `pkg/feedback/alerts.go` |\n| **Circuit Breaker (Go)** | \U0001F7E2 **New** | `pkg/circuitbreaker/breaker.go` |\n\
    | **Adaptive Weight Adjuster** | \U0001F7E2 **New** | `selector/resilient_selector.py` |\n| **FTA Feedback Loop** | \U0001F7E2\
    \ **New** | `fta/feedback_loop.py` |\n| **Regression Validator** | \U0001F7E2 **New** | `fta/regression_validator.py`\
    \ |\n| **Hook Chain Pattern** | \U0001F7E2 **New** | `hooks/patterns.py` |\n\n### 核心引擎\n\n| 引擎 | 状态 | 说明 |\n|------|------|------|\n\
    | FTA Engine | \U0001F7E2 Ready | 故障树分析 |\n| RAG Pipeline | \U0001F7E2 Ready | 检索增强生成 |\n| Skill Executor | \U0001F7E2\
    \ Ready | 技能执行 + 沙箱 |\n| LLM Providers | \U0001F7E2 Ready | 6 个 Provider |\n| MCP Adapter | \U0001F7E2 Ready | Model Context\
    \ Protocol |\n\n---\n\n## \U0001F5C2️ Project Structure | 项目结构\n\n```\nresolve-agent/\n├── api/\n│   └── proto/resolveagent/v1/\
    \   # Protocol Buffers\n├── cmd/\n│   ├── resolveagent-cli/        # CLI 应用\n│   └── resolveagent-server/     # Platform\
    \ Server\n├── pkg/                         # Go 平台服务\n│   ├── circuitbreaker/          # \U0001F504 Loop Engineering:\
    \ 熔断器\n│   ├── config/\n│   ├── event/\n│   ├── feedback/                # \U0001F504 Loop Engineering: 反馈循环\n│   ├──\
    \ gateway/\n│   ├── health/                  # 健康检查 + 反馈集成\n│   ├── registry/\n│   ├── retry/                   # 重试机制\
    \ + 观察器\n│   ├── server/\n│   └── store/                   # Store 模式抽象\n├── python/src/resolveagent/\n│   ├── selector/\
    \               # \U0001F9E0 智能选择器\n│   │   ├── audit.py           # Decision Audit Logger\n│   │   ├── cache.py     \
    \      # 路由决策缓存\n│   │   ├── context_enricher.py # 上下文丰富\n│   │   ├── intent.py          # 意图分析\n│   │   ├── resilient_selector.py\
    \ # \U0001F504 弹性自适应 + AdaptiveWeightAdjuster\n│   │   ├── router.py         # 路由决策\n│   │   └── strategies/        #\
    \ 路由策略\n│   ├── memory.py              # \U0001F4BE 分层记忆\n│   ├── planning.py            # \U0001F333 混合规划器\n│   ├── toolhub.py\
    \             # \U0001F527 工具中心\n│   ├── resilience.py          # \U0001F6E1️ 弹性模式\n│   ├── message_bus.py         # \U0001F4E1\
    \ 消息总线\n│   ├── fta/                   # FTA 引擎 + \U0001F504 反馈循环\n│   │   ├── engine.py          # 故障树分析引擎\n│   │   ├──\
    \ feedback_loop.py   # \U0001F504 工作流反馈循环\n│   │   └── regression_validator.py # \U0001F504 回归验证器\n│   ├── hooks/    \
    \             # 生命周期钩子\n│   │   └── patterns.py        # \U0001F504 Hook 链模式模板\n│   ├── agent/                 # Agent\
    \ 定义\n│   ├── rag/                   # RAG 管道\n│   ├── skills/                # 技能系统\n│   ├── llm/                   #\
    \ LLM 提供者\n│   ├── mcp/                   # MCP 适配器\n│   └── runtime/               # 运行时\n├── .github/workflows/    \
    \      # \U0001F504 CI/CD 流水线\n│   ├── ci.yaml                # 主 CI (lint→test→build→quality-gate)\n│   ├── e2e.yaml\
    \               # E2E 测试 (PostgreSQL + Redis)\n│   └── release.yaml           # 发布流水线 (Docker + Helm)\n├── hack/     \
    \                  # 开发工具脚本\n│   ├── quality-gate.sh        # \U0001F504 质量门禁\n│   └── coverage-report.sh     # \U0001F504\
    \ 覆盖率报告\n├── test/                       # 测试套件\n│   ├── e2e/                   # E2E 测试 + 反馈循环验证\n│   ├── integration/\
    \           # 集成测试 + API 契约测试\n│   └── fixtures/              # 测试基线数据\n├── web/                        # \U0001F310 React\
    \ WebUI\n├── deploy/                     # 部署配置\n└── docs/                       # 文档\n```\n\n---\n\n## \U0001F527 Configuration\
    \ | 配置\n\n### 环境变量\n\n```bash\n# LLM 配置\nLLM_DEFAULT_MODEL=qwen-plus\nLLM_API_KEY=your-api-key\nHIGRESS_URL=http://localhost:8080\n\
    \n# 记忆配置\nREDIS_URL=redis://localhost:6379\nMILVUS_URL=http://localhost:19530\n\n# MCP 配置\nMCP_ENABLED=true\nMCP_STDIO_SERVERS=[]\n\
    \n# 安全配置\nAUTH_ENABLED=true\nRATE_LIMIT_PER_MINUTE=100\n\n# Loop Engineering 配置\nFEEDBACK_ENABLED=true\nFEEDBACK_RING_BUFFER_SIZE=1000\n\
    CIRCUIT_BREAKER_ENABLED=true\nCIRCUIT_BREAKER_FAILURE_THRESHOLD=5\n```\n\n---\n\n## \U0001F4DA Documentation | 文档\n\n\
    | 文档 | 说明 |\n|------|------|\n| [Architecture](docs/zh/architecture.md) | 系统架构详解 |\n| [Loop Engineering](docs/zh/loop-engineering.md)\
