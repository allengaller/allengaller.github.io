  readme_full: "# FinTech 学术文档数据库\n\n> 基于全球顶级经济学院 (MIT / Harvard / Chicago / Stanford / LSE / Oxford / Wharton / NYU) 本硕博课程体系构建的金融科技知识图谱。\n\
    \n---\n\n## 数据库概述\n\n本数据库将金融科技、商学及相关学科的核心知识体系结构化为 **20 大模块、177 个 Markdown 文档**，配套 **15 个 Python 代码脚本**、**24 个习题集**、**3\
    \ 个多维索引**和 **12 个工具文件**。每个主题文档涵盖课程定位、前置要求、核心知识点、关键公式/模型、Mermaid 概念图、中国市场案例、跨模块衔接及推荐阅读。\n\n难度分层对应高等教育三级体系：\n\n| 层级 | 标签\
    \ | 对标阶段 |\n|------|------|----------|\n| **基础** | 基础 | 本科低年级/高年级 |\n| **进阶** | 进阶 | 本科高年级/硕士 |\n| **高级** | 高级 | 硕士/博士\
    \ |\n\n---\n\n## 仓库结构\n\n```\n├── 01-金融基础/                  # 12 个主题文档\n├── 02-金融科技/                  # 7 个主题文档\n├── 03-量化方法与金融工程/\
    \         # 5 个主题文档\n├── 04-经济学基础/                # 5 个主题文档\n├── 05-风险管理/                  # 4 个主题文档\n├── 06-金融法规与伦理/\
    \            # 7 个主题文档\n├── 07-前沿专题/                  # 4 个主题文档\n├── 08-理财实践/                  # 14 个主题文档\n├── 09-代码与数据/\
    \                # 6 个 Python 脚本 + 6 个测试文件 + 数据源索引\n├── 10-习题与解答/                # 24 个分模块习题集（覆盖全部核心模块）\n├── 11-索引与导航/\
    \                # 按方法/案例/公式三维索引\n├── 12-会计与财务控制/            # 财务会计、管理会计、财务控制\n├── 13-市场营销/                  # 营销管理、消费者行为、品牌、数字营销\n\
    ├── 14-运营与供应链管理/          # 运营管理、供应链、服务运营、质量改进\n├── 15-组织行为与领导力/          # 组织行为、领导力、团队、文化\n├── 16-战略管理/             \
    \     # 竞争战略、企业战略、国际化、平台战略\n├── 17-创业与创新管理/            # 创业思维、商业模式、创新、融资\n├── 18-商业分析与数字化转型/      # 商业分析、数据驱动决策、数字化、AI\
    \ 管理\n├── 19-国际商务与全球管理/        # 国际商务、跨国公司、跨文化管理\n├── 20-商法、公司治理与商业伦理/  # 商法、公司治理、商业伦理、合规\n├── 学习路线图.md              \
    \   # 6 条典型学习路径 + 模块依赖图\n├── 金融入门第一课.md             # 零基础入门\n├── 术语索引.md                   # 200+ 金融与商学术语日常语言定义\n├── 概念自检.md\
    \ / 概念自检-答案.md  # 7 模块 40+ 理解检验题\n├── 研讨话题库.md                 # 30+ 课堂辩论/讨论命题\n├── 前沿论文追踪.md               # 2020–2025\
