  readme_full: "# the-anti-anxiety-ai-book\n\n## \U0001F4DA 将四个外部仓库合并到本书的完整方案（中文）\n\n以下是 **一步一步** 的操作指南，帮助你把四个知识库整合进本项目，并保持后续自动同步，全部使用\
    \ **GitHub for Mac 客户端**（GitHub Desktop）即可完成，无需手动敲复杂的 Git 命令。\n\n### 1️⃣ 添加子模块（Submodule）\n在本仓库根目录打开 **GitHub Desktop**，点击\
    \ **Repository → Open in Terminal**（只需要打开一次），在弹出的终端中执行以下四条命令（复制粘贴即可），随后关闭终端。\n\n```bash\ngit submodule add https://github.com/ai-guru-global/ai-guru-database\
    \ external/ai-guru\ngit submodule add https://github.com/kudig-io/kudig-database external/kudig\ngit submodule add https://github.com/opendemo-work/opendemo\
    \ external/opendemo\ngit submodule add https://github.com/standup-coder/standup-coder-database external/standup-coder\n\
    # 初始化所有子模块\ngit submodule update --init --recursive\n```\n> **说明**：子模块会在 `external/` 目录下创建四个子文件夹，保持与原仓库的关联。以后只要在 **GitHub\
    \ Desktop** 中 **Fetch origin**，子模块的最新提交会自动显示为 “submodule update”。\n\n### 2️⃣ 生成资源索引（Resources Index）\n项目已经提供了 `scripts/generate_resource_index.sh`\
    \ 脚本。打开 **GitHub Desktop**，在 **Repository → Open in Terminal** 中运行：\n\n```bash\nchmod +x scripts/generate_resource_index.sh\
    \   # 第一次执行需要加可执行权限\n./scripts/generate_resource_index.sh\n```\n脚本会遍历 `external/*`，读取每个子模块的 `README.md` 前几行，生成统一的 `resources/README.md`，供读者在章节中引用。\n\
    \n### 3️⃣ 自动同步子模块 & 更新索引\n我们已经在仓库根目录放置了 GitHub Actions 工作流 `.github/workflows/resource-sync.yml`，它会每天 02:00 UTC 自动执行以下操作：\n\
    1. 拉取每个子模块的最新 `main` 分支；\n2. 重新生成 `resources/README.md`；\n3. 若有变更自动提交并推送。\n> **对你有什么影响？** 只要工作流成功，你的仓库会保持最新，无需手动操作。若出现冲突，GitHub\
    \ Desktop 会在 **Changes** 面板提示，需要你手动解决（这也是唯一需要人工介入的情况）。\n\n### 4️⃣ 在章节中引用资源索引\n在任意章节的 Markdown 中加入类似链接即可：\n\n```markdown\n\
    > 想了解更深入的 Kubernetes 运维，请查看 [Resources Index 中的 KUDIG 部分](resources/README.md#kudig)。\n```\n这样读者可以直接跳转到对应的外部知识库概览。\n\n\
    ### 5️⃣ 维护指南（CONTRIBUTING）\n`CONTRIBUTING.md` 已经加入 **“添加新外部资源”** 小节，描述了同样的子模块添加、索引生成、提交流程，供以后扩展使用。\n\n---\n\n## ✅ 你需要做的下一步\n\
    1. 在 **GitHub Desktop** 中打开终端，执行上面 **步骤 1** 的四条 `git submodule add` 命令。\n2. 运行 `chmod +x scripts/generate_resource_index.sh\
    \ && ./scripts/generate_resource_index.sh` 生成第一次的资源索引。\n3. 使用 **GitHub Desktop** 提交 `external/`、`resources/`、`.github/workflows/`、`scripts/`\
    \ 四个目录的更改并推送到远程。\n4. 以后只要在 **GitHub Desktop** 点击 **Fetch origin**，工作流会在 GitHub 上自动运行，你无需再手动更新。\n\n---\n\n## \U0001F4E2\
    \ 对关联仓库的影响及更新方式\n- **不会影响原仓库**：子模块只是指向外部仓库的特定提交，不会修改它们的内容。\n- **外部仓库更新时的操作**：\n  1. 在 **GitHub Desktop** 中 **Fetch origin**（或点击右上角的\
    \ **Pull**），子模块会显示为 “submodule update”。\n  2. 选中子模块对应的文件夹（如 `external/ai-guru`），右键选择 **Update Submodule**（Desktop 近期已加入此功能），或者再次打开终端执行\
    \ `git submodule update --remote`（只需一次）。\n  3. 运行 `./scripts/generate_resource_index.sh` 重新生成索引。\n  4. 提交并推送更改。\n- **完全不需要手动写\
    \ Git 命令**：只要使用 **GitHub Desktop** 的 UI 完成 **Fetch → Update Submodule → Commit → Push**，即可保持所有外部库的最新状态。\n\n---\n\n###\
    \ \U0001F3A8 小提示（可选）\n如果你想让 `resources/README.md` 在网页上更美观，可以在生成的 HTML 中加入 Google Font **Inter** 或者添加图标。此部分完全可选，不影响功能实现。\n\
    \n---\n\n如有其他需求或想进一步简化流程，请随时告诉我！\n"
