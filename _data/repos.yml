  description: '# Vibe Coding Idea Database'
  readme_excerpt: '# Vibe Coding Idea Database'
  readme_full: "# Vibe Coding Idea Database\n\n<div align=\"center\">\n\n**以 VC 专业评估体系为核心的 AI 创业点子全景库**\n\n[![Ideas](https://img.shields.io/badge/Ideas-1091-blue?style=flat-square)](README.md)\n\
    [![Tracks](https://img.shields.io/badge/Tracks-12-green?style=flat-square)](README.md)\n[![Evaluated](https://img.shields.io/badge/Evaluated-1091-orange?style=flat-square)](README.md)\n\
    [![Status](https://img.shields.io/badge/Status-Active-brightgreen?style=flat-square)](README.md)\n\n[Web Dashboard](http://localhost:8080)\
    \ · [REST API](#-rest-api) · [CLI Tools](#-cli-tools) · [Chrome Extension](#-chrome-extension)\n\n</div>\n\n---\n\n##\
    \ 目录\n\n- [项目概览](#-项目概览)\n- [核心功能](#-核心功能)\n  - [Web Dashboard](#-web-dashboard)\n  - [灵感模式](#-灵感模式)\n  - [REST API](#-rest-api)\n\
    \  - [CLI 工具](#-cli-tools)\n  - [Chrome 扩展](#-chrome-extension)\n  - [GitHub Actions](#-github-actions)\n- [评估体系](#-评估体系)\n\
    - [优秀案例](#-优秀案例)\n- [快速开始](#-快速开始)\n- [项目结构](#-项目结构)\n- [贡献指南](#-贡献指南)\n\n---\n\n## 项目概览\n\n**Vibe Coding Idea Database**\
    \ 是一个**系统化、可量化、可迭代**的 AI 创业点子数据库。\n\n| 指标 | 数值 |\n|------|------|\n| 点子总数 | 1082 |\n| 赛道数量 | 12 |\n| 已评估 | 1082 (100%)\
    \ |\n| 模板数量 | 8 |\n\n### 适用人群\n\n- **创业者**：寻找下一个值得投入的 AI 方向\n- **投资人**：快速筛选赛道与项目的评估框架\n- **开发者**：寻找有价值的 side project 灵感\n\
    - **研究者**：追踪 AI 应用场景与商业化的前沿趋势\n\n---\n\n## 核心功能\n\n### Web Dashboard\n\n交互式数据仪表盘，支持：\n\n- **数据可视化** - ECharts 雷达图、散点图、热力图\n\
    - **高级筛选** - 按赛道、评分、等级、标签组合筛选\n- **相似度搜索** - 基于分词 Jaccard 相似度的点子推荐\n- **对比工具** - Dashboard 同时对比 2 个点子；API 支持 2–4 个\n-\
    \ **市场热力图** - 各赛道评分分布\n- **数据导出** - JSON / CSV / Markdown 格式\n- **随机灵感** - 随机获取一个优质点子\n- **跨域融合** - 发现跨赛道组合机会\n\n**本地访问**:\
    \ http://localhost:8080\n\n### 灵感模式\n\n6 步 VC 评估向导，帮助你：\n\n1. 选择目标赛道\n2. 描述目标用户\n3. 定义核心痛点\n4. 选择现有方案\n5. 确定 AI 角色\n6.\
    \ 规划 MVP 周期\n\n生成结果包含：\n- 综合评分与等级\n- 6 维度雷达图分析\n- 可视化评分卡片\n- 保存到本地历史\n- 一键复制分享\n\n### REST API\n\nExpress.js 构建的 RESTful\
    \ API：\n\n| 端点 | 方法 | 描述 |\n|------|------|------|\n| `/api/stats` | GET | 全局统计数据 |\n| `/api/tracks` | GET | 所有赛道列表 |\n\
    | `/api/ideas` | GET | 点子列表（支持筛选） |\n| `/api/ideas/:id` | GET | 单个点子详情 |\n| `/api/ideas/eval` | POST | 评估新点子 |\n| `/api/compare?ids=1,2`\
    \ | GET | 对比 2–4 个点子 |\n| `/api/health` | GET | 服务与数据加载状态 |\n\n**启动服务**:\n```bash\nnpm install\nnpm run api\n```\n\n###\
    \ CLI 工具\n\n| 工具 | 命令 | 功能 |\n|------|------|------|\n| 评估工具 | `npm run eval` | 交互式评估点子 |\n| 验证工具 | `npm run validate`\
    \ | 验证点子格式 |\n| 统计更新 | `npm run update-stats` | 更新统计数据 |\n\n**使用示例**:\n```bash\nnpm run eval                    # 交互式评估\n\
    node scripts/validate-ideas.js  # 验证所有点子\nnode scripts/update-stats.js    # 更新统计\n```\n\n### Chrome 扩展\n\n浏览器插件，快速访问点子数据库：\n\
    \n- 弹窗式交互界面\n- 实时搜索点子\n- 一键评估\n- 与主数据库同步\n\n**安装方法**:\n1. 打开 `chrome://extensions/`\n2. 开启「开发者模式」\n3. 加载 `extension/`\
    \ 目录\n\n### GitHub Actions\n\n自动化工作流：\n\n| 工作流 | 触发条件 | 功能 |\n|--------|----------|------|\n| `validate-ideas` | Pull\
    \ Request | 校验数据、生成一致性报告并运行测试 |\n| `update-stats` | main 分支数据变更 | 重新生成并提交统计数据 |\n\n---\n\n## 评估体系\n\n### 六维评估框架\n\n| 维度\
    \ | 权重 | 描述 |\n|------|------|------|\n| **Pain** | 20% | 痛点强度 |\n| **Market** | 20% | 市场规模 (TAM/SAM/SOM) |\n| **Solution**\
    \ | 20% | AI 解决方案质量 |\n| **Biz** | 15% | 商业模型可行性 |\n| **Compete** | 15% | 竞争格局 |\n| **Feasibility** | 10% | MVP/技术可行性\
    \ |\n\n### 等级标准\n\n| 等级 | 分数范围 | 建议动作 |\n|------|----------|----------|\n| \U0001F7E2 **S** | 9.0-10.0 | 立即启动 |\n| \U0001F535\
    \ **A** | 7.5-8.9 | 启动 MVP + 用户访谈 |\n| \U0001F7E1 **B** | 6.0-7.4 | 通过迭代验证 |\n| \U0001F7E0 **C** | 4.0-5.9 | 观察池 |\n|\
    \ \U0001F534 **D** | 0.0-3.9 | 归档 |\n\n### 赛道分布\n\n| 赛道 | 点子数 | 平均分 | 最高分 |\n|------|--------|--------|--------|\n| \U0001F3E2\
    \ AI+企业服务 | 80 | 7.85 | 9.2 |\n| \U0001F4AC AI+内容社交 | 80 | 6.35 | 7.6 |\n| \U0001F3E5 AI+医疗健康 | 81 | 6.91 | 8.4 |\n| \U0001F393\
    \ AI+教育 | 80 | 6.78 | 8.1 |\n| \U0001F3A8 AI+文艺 | 95 | 6.24 | 6.8 |\n| \U0001F52C AI+新兴技术 | 75 | 5.83 | 6.4 |\n| \U0001F9E0\
    \ AI+泛心理学 | 99 | 6.24 | 7.1 |\n| \U0001F6D2 AI+消费零售 | 80 | 6.73 | 7.9 |\n| \U0001F4BB AI+码农工具 | 97 | 6.95 | 8.2 |\n| \U0001F30D\
    \ AI+社会创新 | 75 | 6.00 | 6.3 |\n| \U0001F500 AI+跨界融合 | 75 | 6.17 | 6.5 |\n| \U0001F4B0 AI+金融 | 80 | 6.97 | 8.4 |\n\n---\n\
    \n## 优秀案例\n\n精选若干评分领先、商业模式已对齐商业计划书标准的代表案例，作为参考样板。\n\n### 全局 S 级（9.0+）\n\n| 案例 | 赛道 | 评分 | 亮点 |\n|------|------|------|------|\n\
    | AI 智能企业股权激励管理与估值分析系统 | \U0001F3E2 AI+企业服务 | 9.2 S | 全库唯一 S 级，组织行为学 × 股权激励的交叉创新 |\n\n### 全局 A 级（7.5-8.9）— 跨赛道代表\n\n|\
    \ 案例 | 赛道 | 评分 | 亮点 |\n|------|------|------|------|\n| AI 辅助医学影像诊断平台 | \U0001F3E5 AI+医疗健康 | 8.4 A | NMPA 三类证壁垒 + 数据飞轮\
    \ |\n| AI 驱动的保险欺诈检测平台 | \U0001F4B0 AI+金融 | 8.4 A | 行为金融学 × 反欺诈 |\n| AI API 集成测试助手 | \U0001F4BB AI+码农工具 | 8.2 A | 认知科学\
    \ × DevOps 工具链 |\n| AI 自适应学习伙伴（知识图谱） | \U0001F393 AI+教育 | 8.1 A | 个性化学习引擎 |\n| AI 智能选品引擎 | \U0001F6D2 AI+消费零售 | 7.9 A\
    \ | 行为经济学 × 零售 |\n| AI 内容安全员 | \U0001F4AC AI+内容社交 | 7.6 A | 智能风控 |\n\n### AI+泛心理学赛道 — 已补全 BP 商业模式\n\n> 本批次 10 条 idea 已按\
    \ `_templates/template-business-plan.md` 标准补全 TAM/SAM/SOM、ARPU/LTV/CAC、护城河、收入来源等字段，作为后续赛道的样板。\n\n| 案例 | 评分 | 模式 | 定价 |\
    \ TAM | LTV/CAC | 护城河 |\n|------|------|------|------|-----|---------|--------|\n| AI CBT 自助教练 | 7.1 B | Freemium | ¥29/月\
    \ | ¥3000亿 | 17.4:1 | CBT 对话数据飞轮 |\n| AI 冥想私人教练 | 7.1 B | Freemium | ¥29/月 | ¥1000亿 | 20.9:1 | 个性化冥想生成引擎 |\n| AI 社交技能训练\
    \ | 7.0 B | Freemium | ¥39/月 | ¥800亿 | 18.7:1 | ASD/ADHD 专用语料库 |\n| AI 考前焦虑管理系统 | 7.0 B | B2B2C | ¥39/学生/季 | ¥300亿 | 3.3:1\
    \ | 考试季场景独占 |\n| AI 职业转型决策教练 | 7.0 B | B2B2C | ¥99/次 | ¥600亿 | 6.6:1 | 行业薪酬/技能数据库 |\n| AI 正念饮食教练 | 6.9 B | Freemium |\
    \ ¥25/月 | ¥2万亿 | 22.5:1 | 饮食图像数据集 |\n| AI 关系修复教练 | 6.9 B | Freemium | ¥35/月 | ¥800亿 | 19.4:1 | Gottman 标注数据 |\n| AI 哀伤辅导陪伴机器人\
    \ | 6.9 B | Hybrid | ¥19/月 | ¥300亿 | 13.7:1 | 安宁疗护机构网络 |\n| AI 完美主义纠偏教练 | 6.8 B | B2B2C | ¥149/人/年 | ¥1000亿 | 8.9:1 |\
    \ 企业 EAP 渠道 |\n| AI 情绪雷达 | 6.7 B | B2B2C | ¥0.5/DAU/年 | ¥500亿 | 15:1 | 键盘行为-情绪映射模型 |\n\n**查看完整数据**：访问 [Web Dashboard](http://localhost:8080)\
    \ 或运行 `node scripts/psychology-biz-patch.js` 复现补丁。\n\n---\n\n## 快速开始\n\n### 1. 启动 Web Dashboard\n\n```bash\ncd docs &&\
    \ python3 -m http.server 8080\n# 打开 http://localhost:8080\n```\n\n### 2. 启动 REST API\n\n```bash\nnpm install\nnpm run\
    \ api\n# API 运行在 http://localhost:3000\n```\n\n### 3. 使用 CLI 工具\n\n```bash\nnpm install\nnpm run eval     # 评估新点子\nnpm\
    \ run validate # 验证格式\n```\n\n### 4. 安装 Chrome 扩展\n\n```bash\n# 1. 打开 chrome://extensions/\n# 2. 开启开发者模式\n# 3. 加载 extension/\
    \ 目录\n```\n\n---\n\n## 项目结构\n\n```\nidea-database/\n├── lib/                     # 共享 schema、赛道与正文解析工具\n├── docs/\n│ \
    \  ├── index.html          # Web Dashboard (ECharts + 灵感模式)\n│   ├── data/\n│   │   └── ideas.json      # 由 Markdown 自动生成的结构化数据\n\
    │   └── data-schema.js      # 数据 schema 定义\n├── api/\n│   ├── app.js              # 可测试的 Express 应用\n│   ├── api-server.js\
    \       # REST API 启动器\n│   └── __tests__/          # API 集成测试\n├── scripts/\n│   ├── idea-eval.js        # CLI 评估工具\n\
    │   ├── validate-ideas.js    # 格式验证\n│   └── update-stats.js     # 统计更新\n├── extension/\n│   ├── manifest.json       \
    \ # Chrome 扩展配置\n│   ├── popup.html          # 弹窗 UI\n│   ├── icons/              # 图标 (16-256px)\n│   └── README.md\n\
    ├── .github/workflows/\n│   ├── validate-ideas.yml   # 点子验证\n│   └── update-stats.yml    # 统计更新\n├── AI+*/           \
    \        # 12 个赛道目录\n│   └── *.md                # 点子评估文档\n├── _templates/             # 评估模板\n├── _knowledge-base/  \
    \      # 方法论文档\n└── README.md\n```\n\n---\n\n## 贡献指南\n\n### 添加新点子\n\n1. 在对应赛道目录创建 `.md` 文件\n2. 使用 `_templates/idea-template.md`\
    \ 格式\n3. 运行 `npm run validate` 验证格式\n4. 提交 PR\n\n### 评估现有点子\n\n```bash\nnpm run eval\n# 按提示输入点子信息并完成六维评估\n```\n\n### 更新统计数据\n\
    \n```bash\nnpm run update-stats\n```\n\n---\n\n## License\n\nMIT\n"
