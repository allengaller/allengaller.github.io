  readme_full: "# OpenDemo 技术演示平台 \U0001F680\n\n## \U0001F3AF 项目简介\n\nOpenDemo 是一个综合性技术学习和演示平台，涵盖多种主流编程语言和技术栈的实战案例。本项目致力于提供高质量的技术示例和最佳实践指南，帮助开发者快速掌握各种技术栈的核心概念和实际应用。\n\
    \n> **项目规模**: 532+ 个技术演示案例 | **覆盖技术栈**: 12大类别 | **持续更新中**\n\n---\n\n## \U0001F680 快速入门 - CLI命令行速查表\n\n为了帮助开发者快速上手各技术栈，我们为每个技术目录都提供了专业的CLI命令行速查表：\n\
    \n| 技术栈 | CLI文档 | 核心工具 | 适用场景 |\n|--------|---------|----------|----------|\n| **[Kubernetes](./kubernetes/)** | [k8s-cli.md](./kubernetes/cli/k8s-cli.md)\
    \ • [k8s-cli-detail.md](./kubernetes/cli/k8s-cli-detail.md) | kubectl、helm、kustomize | 容器编排、云原生运维 |\n| **[Linux](./linux/)**\
    \ | [linux-cli.md](./linux/cli/linux-cli.md) • [linux-cli-detail.md](./linux/cli/linux-cli-detail.md) | ps、top、netstat、ss\
    \ | 系统管理、运维监控 |\n| **[Database](./database/)** | [database-cli.md](./database/cli/database-cli.md) • [database-cli-detail.md](./database/cli/database-cli-detail.md)\
    \ | mysql、psql、mongo、redis-cli | 数据库管理、性能优化 |\n| **[AI/ML](./ai-ml/)** | [ai-ml-cli.md](./ai-ml/cli/ai-ml-cli.md) | python、pip、torch、transformers\
    \ | 机器学习、深度学习 |\n| **[Container](./container/)** | [container-cli.md](./container/cli/container-cli.md) | docker、containerd、runc\
    \ | 容器化部署、镜像管理 |\n| **[Go](./go/)** | [go-cli.md](./go/cli/go-cli.md) | go、gomod、delve | Go语言开发、调试 |\n| **[Java](./java/)**\
    \ | [java-cli.md](./java/cli/java-cli.md) | java、javac、mvn、jstack | Java开发、JVM调优 |\n| **[Node.js](./nodejs/)** | [nodejs-cli.md](./nodejs/cli/nodejs-cli.md)\
    \ | npm、yarn、node、pm2 | Node.js开发、包管理 |\n| **[Python](./python/)** | [python-cli.md](./python/cli/python-cli.md) | python、pip、venv、pytest\
    \ | Python开发、虚拟环境 |\n| **[Messaging](./messaging/)** | [messaging-cli.md](./messaging/cli/messaging-cli.md) | rocketmq、kafka、rabbitmq\
    \ | 消息队列、事件驱动 |\n| **[Monitoring](./monitoring/)** | [monitoring-cli.md](./monitoring/cli/monitoring-cli.md) | prometheus、grafana、elk\
    \ | 系统监控、日志分析 |\n| **[Traffic](./traffic/)** | [nginx-cli.md](./traffic/cli/nginx-cli.md) | nginx、haproxy | 负载均衡、流量管理\
    \ |\n\n## \U0001F4DA 命名规范大全\n\n为确保代码质量和团队协作效率，我们为每个技术栈制定了详细的命名规范：\n\n| 技术栈 | 命名规范文档 | 覆盖范围 | 更新时间 |\n|--------|-------------|----------|----------|\n\
    | **[AI/ML](./ai-ml/)** | [NAMING_CONVENTIONS.md](./ai-ml/NAMING_CONVENTIONS.md) | 模型、数据集、训练过程、部署运维 | 2026-02-07 |\n|\
    \ **[Container](./container/)** | [NAMING_CONVENTIONS.md](./container/NAMING_CONVENTIONS.md) | 镜像、容器、编排配置、监控告警 | 2026-02-07\
    \ |\n| **[Database](./database/)** | [NAMING_CONVENTIONS.md](./database/NAMING_CONVENTIONS.md) | 表结构、索引、存储过程、备份恢复 | 2026-02-07\
    \ |\n| **[Go](./go/)** | [NAMING_CONVENTIONS.md](./go/NAMING_CONVENTIONS.md) | 包、变量、函数、接口、并发处理 | 2026-02-07 |\n| **[Java](./java/)**\
    \ | [NAMING_CONVENTIONS.md](./java/NAMING_CONVENTIONS.md) | 类、方法、变量、注解、异常处理 | 2026-02-07 |\n| **[Kubernetes](./kubernetes/)**\
    \ | [NAMING_CONVENTIONS.md](./kubernetes/NAMING_CONVENTIONS.md) | 资源对象、标签、配置、网络策略 | 2026-02-07 |\n| **[Linux](./linux/)**\
    \ | [NAMING_CONVENTIONS.md](./linux/NAMING_CONVENTIONS.md) | 系统服务、脚本、配置文件、日志管理 | 2026-02-07 |\n| **[Messaging](./messaging/)**\
    \ | [NAMING_CONVENTIONS.md](./messaging/NAMING_CONVENTIONS.md) | 队列、主题、路由键、消费者生产者 | 2026-02-07 |\n| **[Monitoring](./monitoring/)**\
    \ | [NAMING_CONVENTIONS.md](./monitoring/NAMING_CONVENTIONS.md) | 监控指标、告警规则、仪表板、日志监控 | 2026-02-07 |\n| **[Node.js](./nodejs/)**\
    \ | [NAMING_CONVENTIONS.md](./nodejs/NAMING_CONVENTIONS.md) | 模块、路由、中间件、错误处理、测试 | 2026-02-07 |\n| **[Python](./python/)**\
