  readme_excerpt: '# SOKR'
  readme_full: "<div align=\"center\">\n\n# SOKR\n\n**从复盘到能力：让每次故障都成为团队的智能体资产**\n\n[![CI](https://github.com/allengaller/standup-coder/actions/workflows/ci.yml/badge.svg)](https://github.com/allengaller/standup-coder/actions/workflows/ci.yml)\n\
    [![TypeScript](https://img.shields.io/badge/TypeScript-5.8-3178C6?logo=typescript&logoColor=white)](https://www.typescriptlang.org/)\n\
    [![React](https://img.shields.io/badge/React-18-61DAFB?logo=react&logoColor=white)](https://react.dev/)\n[![Vite](https://img.shields.io/badge/Vite-6-646CFF?logo=vite&logoColor=white)](https://vite.dev/)\n\
    [![Tests](https://img.shields.io/badge/tests-224%20passed-success)](#质量保障)\n\n</div>\n\n---\n\n> **SOKR**（Skills OKR）是面向运维/工单团队的\
    \ **OKR 层级管理与知识沉淀工具**。\n> 围绕「OKR 目标 → 关键结果 → 技术专项 → 课题 → 工单 → 技能」六层实体链，将每一次故障复盘转化为可复用的团队知识资产，并通过「专项毕业」机制判断何时从孵化进入规模化运营。\n\
    \n```\n\U0001F3AF 设定目标 (Objective)\n  \U0001F4CA 拆解关键结果 (Key Result)        ← 量化衡量，自动计算进度\n    \U0001F4C1 发起技术攻坚 (Tech\
    \ Initiative)  ← 聚焦专项突破，支持毕业/孵化生命周期\n      \U0001F4D6 研究课题 (Topic)              ← 细化问题域\n        \U0001F4CB 工单复盘 (Ticket)\
    \           ← 记录根因与改进\n          ✨ 沉淀技能 (Skill)          ← 输出可复用知识资产\n```\n\n## 为什么选择 SOKR\n\n| 痛点 | SOKR 的解法 |\n|------|------------|\n\
    | OKR 目标和日常工作脱节 | 六层实体链把目标→任务→复盘→知识串成一条线 |\n| 工单处理完就丢了，经验无法复用 | 每个工单可沉淀 Skill，关联完整上下文 |\n| KR 进度靠人工汇报 | 量化基线/目标/当前值，自动计算完成百分比\
    \ |\n| 技术专项何时算成功没有标准 | 「毕业」机制：降量 30% + 覆盖率 80% + 子指标看板 |\n| 工具太重，要配服务器 | 纯浏览器运行，零部署，打开即用 |\n| 数据安全担忧 | 数据完全在本地，WAL + CRC32\
    \ + 快照三重保障 |\n| 不同角色关注点不同 | 5 个专属空间，每种实体有最优视图 |\n\n## 核心能力\n\n### 五大专属空间\n\n每种实体都有为其量身的最佳视图，告别\"一棵大树看到底\"的局限：\n\n| 空间\
    \ | 路由 | 视图模式 | 核心特性 |\n|------|------|----------|----------|\n| **OKR 空间** | `/space` | 层级树 | 六层实体展开/折叠、搜索过滤、详情面板、FAB\
    \ 快速创建 |\n| **专项空间** | `/space/initiatives` | 分组列表 | 按目标分组折叠、状态标签（进行中/已暂停/已完成）、课题计数 |\n| **课题空间** | `/space/topics` |\
    \ 看板 | 四列状态板（开放→进行中→已解决→已关闭）、父专项面包屑、工单计数 |\n| **工单空间** | `/space/tickets` | 看板 + 复盘 | 四列状态板（待处理→调查中→已解决→已关闭）、复盘标记、根因预览\
    \ |\n| **Skills 空间** | `/space/skills` | 卡片网格 | 三列响应式网格、状态/来源双重筛选、Markdown 内容摘要 |\n\n所有空间共享：搜索过滤 · 详情侧边栏 · 实时数据同步 · 空状态引导\
    \ · 移动端适配\n\n### 六层实体全链路管理\n\n创建、编辑、搜索、删除——全闭环操作，覆盖所有 6 种实体类型。树形展示一目了然，详情面板即时编辑。\n\n- **级联删除**：软删除父实体自动级联所有子实体\n- **操作审计**：每次\
    \ CRUD 操作自动记录到操作日志\n- **自动保存**：表单编辑自动保存草稿到 localStorage，刷新不丢失\n\n### 专项毕业 / 孵化机制\n\n为每个技术专项定义清晰的生命周期闸门：\n\n| 维度 | 说明 |\n\
    |------|------|\n| **主指标（手动填报）** | 工单降量比例、智能体覆盖率，默认阈值 30% / 80% |\n| **子指标（自动计算）** | 工单闭环率、技能水位、语料成熟度（手动填报） |\n| **手动毕业**\
    \ | 指标达标后由负责人点击「标记毕业」，系统不自动跳转 |\n| **退回孵化** | 已毕业专项可随时退回重新打磨 |\n\n实现位置：`src/lib/initiativeGraduation.ts` + `EntityDetailPanel`\
    \ 专项详情页。\n\n### KR 量化进度追踪\n\n每个关键结果支持 **基线值 / 目标值 / 当前值**，使用 `(current - baseline) / (target - baseline)` 公式自动计算完成百分比。所有视图统一使用\
    \ `computeKrProgress()` 确保数值一致。\n\n### 知识沉淀闭环\n\n从工单复盘到技能输出，支持 `draft → confirmed → published` 状态流转。质量检查清单确保输出物达标。Skills\
    \ 支持三种来源（专项 / 课题 / 工单），灵活关联上下文。\n\n### 数据安全可靠\n\n| 保障层 | 机制 |\n|--------|------|\n| 写入安全 | WAL（Write-Ahead Log）先写日志再写数据，关键写入使用\
    \ `trySetLocalStorageValue` 检测失败 |\n| 数据校验 | CRC32 校验 + JSON round-trip 验证（统一使用 `stringifyDb` 格式） |\n| 自动快照 | 每 10 次写入或\
    \ 10 分钟自动创建（保留 5 个） |\n| 三级恢复 | WAL → 副本 → 快照递进式恢复 |\n| 内存缓存 | `readDb` 优先返回缓存，避免重复 Markdown 解析 |\n| 变更检测 | `mutateDb`\
    \ 通过快照对比跳过无变更写入 |\n| Schema 版本 | `CURRENT_SCHEMA_VERSION` 常量，为未来数据迁移做准备 |\n\n### 可拔插数据源架构\n\n数据访问抽象为 `DataSourcePlugin`\
    \ 接口，支持热挂载：\n\n| 数据源 | ID | 能力 |\n|--------|------|------|\n| 浏览器本地存储 | `local-storage` | 读写、自动持久化 |\n| Per-Entity Markdown\
    \ 文件 | `markdown-file` | 导出 zip / 导入 md / 多文件上传 / 查重融合 |\n\n**完整导入导出流程**：在「系统管理 → 数据源管理」页可一键导出 144 个 mock 实体为 zip（每个实体一个\
    \ md 文件，含 frontmatter + 长文本 body），再清空后导入恢复，全程 byte-for-byte 保真。详细测试见 [测试报告](./docs/audits/2026-06-15-test-report.md)。\n\
    \n### 明暗双主题\n\n浅色模式（白天办公）+ 深色模式（夜间值班），一键切换。CSS 变量系统确保一致性，近期已完成主题令牌补全与对比度修复。\n\n### 开箱即用\n\n首次启动自动种子 3 个 OKR 目标 + 18 个关键结果\
    \ + 全量 Mock 数据（15 专项 · 26 课题 · 42 工单 · 50 Skills），无需配置即可体验完整流程。\n\n## 快速开始\n\n```bash\ngit clone <repository-url> && cd\
    \ sb-okr\npnpm install\npnpm dev          # → http://localhost:5173\n```\n\n首次启动自动加载种子数据，无需任何配置。\n\n## 技术架构\n\n```\n┌──────────────────────────────────────────────────────────┐\n\
    │                        UI 层                              │\n│   React 18 · TypeScript 5.8 (strict) · Vite 6        \
    \   │\n│   Tailwind CSS 3 · Zustand 5 · React Router 7            │\n│   8 路由 · 7 页面 · 懒加载 · React.memo · 自动保存表单   │\n\
    │   5 专属空间 · 看板/网格/分组列表 · 共享详情面板          │\n├──────────────────────────────────────────────────────────┤\n│         \
    \             数据引擎                             │\n│   localStorage · Markdown 序列化                          │\n│   WAL\
    \ + CRC32 + 快照 + 三级恢复                           │\n│   原子读-改-写 · 操作审计日志 · Schema 版本管理           │\n│   QuotaExceededError\
    \ 事件通知 · 导入双重校验               │\n└──────────────────────────────────────────────────────────┘\n```\n\n### 页面与路由\n\n| 路由\
    \ | 页面 | 说明 |\n|------|------|------|\n| `/` | WorkbenchPage | 工作台：统计概览、快速创建、空间入口 |\n| `/space` | SpacePage | OKR 空间：六层实体树\
    \ + FAB + 搜索 |\n| `/space/initiatives` | InitiativeSpacePage | 专项空间：按目标分组列表 |\n| `/space/topics` | TopicSpacePage | 课题空间：四列看板\
    \ |\n| `/space/tickets` | TicketSpacePage | 工单空间：看板 + 复盘追踪 |\n| `/space/skills` | SkillSpacePage | Skills 空间：知识卡片网格 |\n\
    | `/admin` | AdminPage | 系统管理：存储状态、备份导入、种子数据 |\n| `/admin/datasource` | DataSourcePage | 数据源管理：导出 / 导入 / 维护（4 个 Tab） |\n\
    \n### 文件结构\n\n```\nsrc/\n  App.tsx                            # 8 路由，懒加载\n  main.tsx                           # 入口，错误边界\n\
    \  index.css                          # 主题令牌，Tailwind 层\n  pages/\n    WorkbenchPage.tsx                # 工作台\n    SpacePage.tsx\
    \                    # OKR 空间（树形视图）\n    InitiativeSpacePage.tsx          # 专项空间（分组列表）\n    TopicSpacePage.tsx       \
    \        # 课题空间（看板）\n    TicketSpacePage.tsx              # 工单空间（看板+复盘）\n    SkillSpacePage.tsx               # Skills\
    \ 空间（卡片网格）\n    AdminPage.tsx                    # 系统管理\n    DataSourcePage.tsx               # 数据源管理（导出/导入/维护）\n    datasource/\n\
    \      OverviewTab.tsx               # 概览 Tab\n      ExportTab.tsx                 # 导出 Tab（生成 zip）\n      ImportTab.tsx\
    \                 # 导入 Tab（解析 + 查重）\n      ConflictResolver.tsx          # 冲突解决 UI\n      MaintenanceTab.tsx         \
    \   # 维护 Tab（孤立引用检测）\n  components/\n    layout/AppShell.tsx              # 全局壳（6 导航标签 + 主题切换）\n    space/\n      SpaceHeader.tsx\
    \                # 空间页头（搜索 + 主/二级筛选）\n      StatusBoard.tsx                # 通用看板列组件\n      CreateEntityModal.tsx    \
    \      # 实体创建弹窗\n      EntityDetailPanel.tsx          # 实体详情面板（6 种实体 + 毕业指标）\n    MockBadge.tsx                    # Mock\
    \ 数据角标 + 工具函数\n    ui/                              # Button, Card, Input, Modal, TextArea, Badge\n  hooks/\n    useSpaceTree.ts\
    \                  # OKR 树数据加载 + 订阅\n    useEntityList.ts                 # 通用实体列表加载 + 订阅\n    useTheme.ts           \
    \           # 主题切换\n    useAutosaveEntityForm.ts         # 表单自动保存\n  lib/\n    types.ts                         # 全部领域类型（含\
    \ is_mock、lifecycle）\n    okr.ts                           # computeKrProgress()\n    initiativeGraduation.ts        \
    \  # 专项毕业判定与指标计算\n    utils.ts                         # cn() helper\n    localData.ts                     # Barrel 导出\n\
    \    localModeMarkdown.ts             # Markdown 序列化/反序列化\n    localData/\n      types.ts                       # LocalDb,\
    \ WAL, Snapshot 类型\n      infra.ts                       # 核心引擎（readDb/writeDb/mutateDb + 缓存）\n      crud.ts         \
    \               # 全部 CRUD 操作\n      seed.ts                        # OKR 种子数据 + 迁移\n      mock-seed.ts               \
    \    # 全量 Mock 数据（标记 is_mock=true）\n      checksum.ts                    # CRC32 完整性\n      storage.ts               \
    \      # localStorage 安全封装\n      markdownEntity.ts              # Per-entity md 序列化\n      zipBundle.ts             \
    \      # Zip 打包 + manifest\n      dedup.ts                       # 查重融合（id_match/fingerprint_match/new）\n      datasource/\
    \                    # 可拔插数据源插件\n        types.ts                     # DataSourcePlugin 接口\n        localStorage.ts \
    \             # 浏览器本地存储实现\n        markdownFile.ts              # Markdown 文件实现\n        index.ts                    \
    \ # 插件注册中心\n        entityMeta.ts                # 实体元数据 + 指纹\n  store/useAppStore.ts               # Zustand（工作区身份）\n\
    ```\n\n## 质量保障\n\n| 维度 | 状态 | 详情 |\n|------|------|------|\n| TypeScript 严格模式 | ✅ 零错误 | `exactOptionalPropertyTypes` +\
    \ `noImplicitReturns` + 全部 `no-unsafe-*` |\n| ESLint | ✅ 零警告 | `recommendedTypeChecked` + 严格规则集 |\n| 单元 + 集成测试 | ✅ 224/224\
    \ 通过 | 15 个测试文件 · 详见 [测试报告](./docs/audits/2026-06-15-test-report.md) |\n| E2E 测试 | ✅ 5 个套件 | Playwright 覆盖核心流程 |\n| 生产构建\
    \ | ✅ 懒加载 + chunk 分割 | vendor / ui / 各专题页独立 chunk |\n| CI 流水线 | ✅ GitHub Actions | check → lint → test → build 自动门禁 |\n\
    | 零 `any` | ✅ 0 处 | 全代码库无 `any` 类型 |\n| 零安全风险 | ✅ | 无 `dangerouslySetInnerHTML` / `eval` / `innerHTML` |\n| 导入导出 | ✅ 52\
    \ 用例 | byte-for-byte 真实 mock 数据 + 完整 UI 流程模拟 |\n| 写入检测 | ✅ | 关键路径使用 `trySetLocalStorageValue` 返回 boolean，失败时触发回滚 |\n|\
    \ 可访问性 | \U0001F7E1 持续改进 | 已完成树节点键盘化、焦点指示器统一、表单标签补全，详见 [审计报告](./docs/audits/2026-06-15-audit-report.md) |\n\n> 注：当前工作区\
    \ `src/lib/supabase.ts` 与 `src/lib/supabase.test.ts` 缺失，测试计数为 224。如需恢复 Supabase 远程模式支持，需重新安装 `@supabase/supabase-js` 并还原这两个文件。\n\
    \n### 测试覆盖\n\n| 测试文件 | 用例 | 覆盖内容 |\n|----------|------|----------|\n| `infra.test.ts` | 23 | readDb/writeDb 往返、WAL、CRC32\
    \ 校验、快照、三级恢复、缓存失效 |\n| `crud.test.ts` | 18 | Objectives/KRs/Initiatives CRUD + 级联删除 |\n| `crud-entities.test.ts` | 23\
    \ | Topics/Tickets/Skills CRUD + 全链级联 |\n| `seed.test.ts` | 16 | 种子导入、幂等性、强制重导、排序归一化、is_mock 补设 |\n| `mock-seed.ts` (data)\
    \ | — | 全量 Mock 数据，144 个实体均带 `is_mock: true` |\n| `markdownEntity.test.ts` | 15 | Per-entity md 序列化：frontmatter、长文本、特殊字符、未知\
    \ section |\n| `zipBundle.test.ts` | 9 | zip 打包 + manifest + includeOperationLogs/Deleted |\n| `dedup.test.ts` | 14 |\
    \ 查重：id_match / fingerprint_match / new · 4 种 resolution 策略 |\n| `exportImportMock.test.ts` | **34** | 真实 mock 数据 byte-for-byte\
    \ round-trip（含 null/特殊字符/嵌套） |\n| `endToEndExportImport.test.ts` | **18** | 端到端 UI 流程：导出→zip→上传→解析→查重→应用→验证 |\n| `datasource/index.test.ts`\
    \ | 7 | 数据源插件注册、ping、行为 |\n| `localModeMarkdown.test.ts` | 14 | Front matter、DB bundle 序列化往返、schema 兼容 |\n| `okr.test.ts`\
    \ | 13 | computeKrProgress 边界场景 |\n| `Button.test.tsx` / `Badge.test.tsx` | 11 / 6 | 组件变体、加载、禁用 |\n| `useAutosaveEntityForm.test.tsx`\
    \ | 2 | 草稿读写清理 |\n\n## 项目规模\n\n```\n79 个源文件 · 14,624 行代码\n15 个测试文件 · 224 个用例 · 100% 通过\n 5 个 E2E 套件\n 8 个页面 · 9 条路由 ·\
    \ 9 种实体 · 5 个专属空间\n 1 个完整数据引擎 · 1 个可拔插数据源系统 · 1 套专项毕业机制\n```\n\n## 常用命令\n\n| 命令 | 说明 |\n|------|------|\n| `pnpm dev`\
    \ | 开发服务器（HMR） |\n| `pnpm check` | TypeScript 类型检查 |\n| `pnpm lint` | ESLint 检查 |\n| `pnpm test` | 单元 + 集成测试（224 用例） |\n\
    | `pnpm test:run` | 同上 |\n| `pnpm test:coverage` | 带 V8 覆盖率报告 |\n| `pnpm build` | 生产构建 |\n| `pnpm test:e2e` | Playwright\
    \ E2E 测试 |\n| `ANALYZE=true pnpm build` | Bundle 分析 |\n\n## 部署\n\n| 方式 | 说明 | 配置文件 |\n|------|------|----------|\n| **Vercel**（推荐）\
    \ | SPA rewrite 已配置，一键部署 | `vercel.json` |\n| **Docker** | 多阶段构建，nginx 托管 | `deploy/Dockerfile` |\n| **静态托管** | `dist/`\
    \ 目录可直接部署 | — |\n\n## 文档体系\n\n**完整文档入口: [docs/README.md](docs/README.md)**\n\n### 质量文档\n\n| 文档 | 说明 |\n|------|------|\n\
    | [项目审计报告](docs/audits/2026-06-15-audit-report.md) | 5 维度质量审计（可访问性 / 性能 / 响应式 / 主题 / 反模式）+ 历次修复批次 |\n| [测试报告](docs/audits/2026-06-15-test-report.md)\
    \ | 235 用例覆盖率 + 端到端导入导出验证 + 真实 mock 数据 round-trip |\n| [测试摘要 JSON](docs/audits/test-reports/2026-06-15-test-summary.json)\
    \ | 测试结果结构化数据 |\n\n### 产品文档\n\n| 文档 | 说明 |\n|------|------|\n| [产品需求文档 (PRD)](docs/product/PRD.md) | 用户故事、功能规格、竞品分析、指标体系\
    \ |\n| [用户手册](docs/product/user-guide.md) | 面向最终用户的产品使用指南 |\n| [产品路线图](docs/product/ROADMAP.md) | 4 阶段里程碑、技术决策记录 |\n|\
    \ [版本变更](docs/product/CHANGELOG.md) | 完整特性清单与开发历史 |\n| [产品指标](docs/product/metrics.md) | 北极星指标、KPI、漏斗分析 |\n| [方法论](docs/product/METHODOLOGY.md)\
    \ | 核心理念、落地方法、推广指南、实践案例 |\n\n### 技术文档\n\n| 文档 | 说明 |\n|------|------|\n| [架构总览](docs/architecture/overview.md) | 系统架构、技术栈、文件结构\
    \ |\n| [数据引擎](docs/architecture/data-layer.md) | WAL / CRC32 / 快照机制深度解析 |\n| [实体层级](docs/architecture/entity-hierarchy.md)\
    \ | 六层实体、状态机、级联规则 |\n| [编码规范](docs/development/coding-conventions.md) | TypeScript / React / 样式规范 |\n| [数据层 API](docs/api/local-data-api.md)\
    \ | CRUD 函数完整参考 |\n| [Hooks API](docs/api/hooks-api.md) | React Hooks 使用指南 |\n| [主题系统](docs/api/theme-api.md) | CSS 令牌与双主题切换\
    \ |\n| [部署指南](docs/deployment/) | Vercel / Docker / CI-CD |\n\n## License\n\nPrivate — Internal Use Only\n"
