  description: '# Monkey Flow - 程序员命令行音乐播放器 🎵'
  readme_excerpt: '# Monkey Flow - 程序员命令行音乐播放器 🎵'
  readme_full: "# Monkey Flow - 程序员命令行音乐播放器 \U0001F3B5\n\n一款专为程序员打造的优雅、简洁的命令行音乐播放工具，提供专注编程时的背景音乐体验。\n\n## ✨ 核心特性\n\n- **场景智能推荐**\
    \ - 根据编程活动类型（算法、前端、后端、调试等）推荐合适的背景音乐\n- **版权合规** - 100%使用CC协议音乐，避免侵权风险\n- **离线优先** - 本地存储音乐文件和索引，无网络依赖\n- **低资源占用** - 内存占用<20MB，启动时间<0.1秒\n\
    - **纯Rust实现** - 无外部语言依赖，单一可执行文件\n\n## \U0001F680 快速开始\n\n### 环境准备\n\n本项目使用 Rust 语言开发，需要先安装 Rust 开发环境。\n\n#### Windows\
    \ 系统\n\n1. **下载 Rust 安装程序**\n   - 访问 [https://rustup.rs/](https://rustup.rs/)\n   - 点击下载 `rustup-init.exe`\n\n2. **运行安装程序**\n\
    \   - 双击运行 `rustup-init.exe`\n   - 在命令行界面中，输入 `1` 选择默认安装，然后按回车\n   - 等待安装完成（需要下载约 200MB 的工具链）\n\n3. **重启终端**\n   - 安装完成后，**关闭并重新打开**\
    \ PowerShell 或命令提示符\n   - 这是为了让新的 PATH 环境变量生效\n\n4. **验证安装**\n   ```powershell\n   rustc --version\n   cargo --version\n\
    \   ```\n   如果显示版本号（如 `rustc 1.75.0`），说明安装成功。\n\n#### macOS 系统\n\n```bash\n# 使用官方安装脚本\ncurl --proto '=https' --tlsv1.2\
    \ -sSf https://sh.rustup.rs | sh\n\n# 按提示选择默认安装（输入 1）\n# 安装完成后，重新加载环境变量\nsource $HOME/.cargo/env\n\n# 验证安装\nrustc --version\n\
    cargo --version\n```\n\n#### Linux 系统\n\n```bash\n# 使用官方安装脚本\ncurl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs\
    \ | sh\n\n# 按提示选择默认安装（输入 1）\n# 安装完成后，重新加载环境变量\nsource $HOME/.cargo/env\n\n# 验证安装\nrustc --version\ncargo --version\n```\n\
    \n> **提示**：如果遇到网络问题，可以配置 Rust 镜像源加速下载。在 `~/.cargo/config.toml` 中添加：\n> ```toml\n> [source.crates-io]\n> replace-with =\
    \ 'ustc'\n> \n> [source.ustc]\n> registry = \"sparse+https://mirrors.ustc.edu.cn/crates.io-index/\"\n> ```\n\n### 安装项目\n\
    \n确保 Rust 环境安装成功后，执行以下命令：\n\n```bash\n# 克隆项目\ngit clone https://github.com/standup-coder/monkey-flow.git\ncd monkey-flow\n\
    \n# 编译项目（Release 模式，性能更好）\ncargo build --release\n\n# 可选：安装到系统路径（之后可以直接使用 monkey-flow 命令）\ncargo install --path .\n```\n\
    \n编译成功后，可执行文件位于 `target/release/monkey-flow`（Windows 下为 `monkey-flow.exe`）。\n\n### 初始化\n\n```bash\n# 首次使用需要初始化\nmonkey-flow\
    \ init\n```\n\n## \U0001F4D6 使用指南\n\n### 场景播放\n\n根据编程场景自动推荐并播放音乐：\n\n```bash\n# 算法编写场景\nmonkey-flow play --scene algorithm\n\
    \n# 前端开发场景\nmonkey-flow play --scene frontend\n\n# 后端开发场景\nmonkey-flow play --scene backend\n\n# 调试代码场景\nmonkey-flow play\
    \ --scene debugging\n```\n\n查看所有支持的场景：\n\n```bash\nmonkey-flow scene list\n```\n\n### 播放控制\n\n```bash\nmonkey-flow pause\
    \       # 暂停\nmonkey-flow resume      # 继续\nmonkey-flow stop        # 停止\nmonkey-flow next        # 下一曲\nmonkey-flow prev\
    \        # 上一曲\nmonkey-flow volume 80   # 设置音量\nmonkey-flow status      # 查看状态\n```\n\n### 搜索音乐\n\n```bash\n# 按歌曲名称搜索\n\
    monkey-flow search \"lofi beats\"\n\n# 按艺术家搜索\nmonkey-flow search --artist \"Artist Name\"\n\n# 按风格搜索\nmonkey-flow search\
    \ --genre lofi\n\n# 搜索后直接播放\nmonkey-flow search \"song name\" --play\n```\n\n### 播放列表管理\n\n```bash\n# 创建播放列表\nmonkey-flow\
    \ playlist create \"我的编程音乐\" --desc \"专注编程时听的音乐\"\n\n# 列出所有播放列表\nmonkey-flow playlist list\n\n# 添加歌曲到播放列表\nmonkey-flow\
    \ playlist add <playlist_id> <track_id>\n\n# 播放播放列表\nmonkey-flow play --playlist <playlist_id>\n```\n\n### 收藏功能\n\n```bash\n\
    # 添加收藏\nmonkey-flow favorite add <track_id>\n\n# 查看收藏列表\nmonkey-flow favorite list\n\n# 播放收藏列表\nmonkey-flow play --favorites\n\
    ```\n\n### 播放历史\n\n```bash\n# 查看播放历史\nmonkey-flow history list\n\n# 查看统计信息\nmonkey-flow history stats\n```\n\n## \U0001F3AF\
    \ 编程场景说明\n\n| 场景 | 适用情况 | 推荐风格 |\n|------|---------|----------|\n| algorithm | 算法编写 | Lofi / 纯音乐 |\n| frontend | 前端开发\
    \ | 电子音乐 / Chill |\n| backend | 后端开发 | 环境音 / 爵士 |\n| debugging | 调试代码 | 白噪音 / 极简 |\n| meeting | 会议/沟通 | 轻音乐 / 古典 |\n|\
    \ general | 通用场景 | Lofi 混合 |\n\n## ⚙️ 配置\n\n配置文件位置：`~/.monkey-flow/config.toml`\n\n主要配置项：\n\n```toml\n[general]\nlocal_music_dir\
    \ = \"~/.monkey-flow/music\"\nindex_db_path = \"~/.monkey-flow/index\"\nmax_cache_size_mb = 500\n\n[playback]\ndefault_volume\
    \ = 70\ndefault_mode = \"sequential\"  # sequential, loop, loopall, shuffle\n\n[recommendation]\ngenre_match_weight =\
    \ 1.0\nhistory_weight = 0.1\nrating_weight = 0.5\nfavorite_boost = 2.0\n```\n\n## \U0001F4E6 技术栈\n\n- **语言**: Rust 2021\n\
    - **CLI**: clap 4.5\n- **音频播放**: rodio 0.18\n- **数据库**: RocksDB 0.22\n- **配置管理**: config + toml\n- **异步运行时**: tokio 1.35\n\
    \n## \U0001F4DD 版权说明\n\n本工具所使用的音乐均来自以下合规渠道：\n\n1. **网易云音乐CC协议专区** - 所有音乐均标注CC协议\n2. **Free Music Archive** - 平台提供的免费音乐\n\
    \n**重要提示**：\n- 所有音乐仅供个人学习和非商业使用\n- 禁止将下载的音乐用于商业目的\n- 使用音乐时需遵守对应的CC协议要求\n\n## \U0001F91D 贡献\n\n欢迎提交Issue和Pull Request！\n\
    \n## \U0001F4C4 许可证\n\nMIT License\n\n## \U0001F64F 致谢\n\n感谢所有开源音乐创作者的贡献！\nmonkey flow\n"
