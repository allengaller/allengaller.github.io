  description: '# Claw Workspace'
  readme_excerpt: '# Claw Workspace'
  readme_full: "# Claw Workspace\n\nAllen 的个人 AI 协作工作区。承载任务追踪、项目元数据、知识库、AI 上下文（AGENTS/SOUL/USER/MEMORY）和少量本地运维记录。\n\n> **体积策略**：本仓库只入库「知识资产」（md\
    \ / yaml / 小文件）。所有大型二进制（PDF、DMG、APK、视频、高清图）保留在本地磁盘，通过 `.gitignore` 排除。\n\n---\n\n## 目录地图\n\n```\nclaw/\n├── AGENTS.md\
    \ / SOUL.md / USER.md / IDENTITY.md / HEARTBEAT.md\n│   ├── TOOLS.md / MEMORY.md / PROJECTS.md / CLAW-HANDBOOK.md\n│ \
    \  ├── README.md                ← 你正在看的文件\n│   └── prompt                   ← 常用 prompt 模板\n│\n├── 项目/               \
    \         ← \U0001F3AF 项目 · 课题 · 知识库（核心工作区）\n│   ├── 00-README.md             项目追踪系统入口\n│   ├── 01-项目全景.md           \
    \ 全部项目状态总览\n│   ├── 02-优先级矩阵.md          月/季/年优先级\n│   ├── 03-决策日志模板.md\n│   │\n│   ├── mocici/                  MOCICI\
    \ 冥想 App（任务/状态/决策）\n│   ├── ai-private-assistant/    政企 AI 私有化助手\n│   ├── ai-native-team-2026-06/  AI Native Team 提案\n\
    │   ├── fde-research/            FDE 研究\n│   ├── layoff-playbook/         裁员应对 Playbook\n│   ├── aliyun/             \
    \     阿里云项目产出（agent / llm-wiki）\n│   ├── deepseek-docs/           DeepSeek 官方文档语料镜像\n│   ├── city-walk/              \
    \ 城市漫步路线\n│   ├── global-backpacking/      环球背包旅行：写书 + 内容工厂\n│   ├── 程序员冥想App/            独立项目：程序员冥想 App\n│   ├── 小程序/\
    \                  小程序方向\n│   │\n│   ├── 健康/                    \U0001F4AA 健康目标与周复盘\n│   ├── 课题/                    \U0001F4DA\
    \ 专题研究（中年危机 / AI / 商业等）\n│   ├── 技能管理/                OpenClaw Skills 清单与安装日志\n│   ├── 阅读管理/                微信读书书架 / 划线笔记\n\
    │   ├── 本机管理/                本地电脑运维\n│   ├── 知识库/                  \U0001F9E0 Obsidian Wiki（知识蒸馏）\n│   │\n│   ├── _buffer/\
    \                 ⚠ gitignore：下载残留 / 安装包\n│   └── _assets/                 ⚠ gitignore：品牌 LOGO / 设计稿\n│\n├── 维护/     \
    \                   ← \U0001F527 运维 · 引导 · 日志 · 清单\n│   ├── README.md                运维中心入口\n│   ├── scripts/        \
    \         扫描脚本（scan-repos.sh / gen-report.sh）\n│   ├── reports/                 运维盘点报告\n│   ├── _报告/                 \
    \  历史报告归档\n│   ├── 清单/                    \U0001F4CA 本机软件 + 项目矩阵（INVENTORY.md）\n│   ├── 任务/                    \U0001F4CB\
    \ 全局任务清单（claw-tasks.md）\n│   ├── 日志/                    \U0001F4C5 每日日志（按月归档：2026-06/ 2026-07/）\n│   ├── 速查/         \
    \           ⌨️ zsh / tmux 速查\n│   ├── 技能/                    \U0001F6E0 OpenClaw 技能源码\n│   └── 引导/                   \
    \ \U0001F680 新手引导（ATOM / 分层 / 8 大类）\n│\n└── 归档/                        ← \U0001F5C3 归档模板与历史\n    ├── AGENTS历史版本-2026-07/\n\
    \    ├── github-2026-07-21/\n    ├── sherlock-2026-07-11/\n    └── your-template-2026-06-12/\n```\n\n---\n\n## 顶层文件（AI\
    \ 协作核心）\n\n| 文件 | 作用 |\n|------|------|\n| `AGENTS.md` | Agent 行为规范（心跳、记忆、群聊、红线） |\n| `SOUL.md` | 人格与沟通风格 |\n| `IDENTITY.md`\
    \ | 身份设定 |\n| `USER.md` | Allen 的个人偏好 |\n| `MEMORY.md` | 长期记忆（仅主会话加载） |\n| `HEARTBEAT.md` | 心跳检查项清单 |\n| `TOOLS.md` |\
    \ 工具与技能本地备注 |\n| `PROJECTS.md` | 项目注册表（slug ↔ 名称 ↔ 状态） |\n| `CLAW-HANDBOOK.md` | \U0001F99E 龙虾使用手册（路径约定 / 技巧 / 坑） |\n\n\
    ---\n\n## 二进制与 .gitignore\n\n被排除的目录（保留在本地磁盘，但不入 git）：\n\n```\n项目/_buffer/                       # 下载残留 / 安装包 / 临时二进制\n\
    项目/_assets/                       # 品牌 LOGO / 高清设计稿\n项目/mocici/assets/                 # MOCICI 媒体（PPT、拆解图、音频）\n项目/aliyun/official-doc/\
    \           # ACK/ACR 官方 PDF\n项目/aliyun/output/                 # 产出中间文件\n项目/aliyun/infographic/            # 信息图 PNG\n\
    项目/aliyun/llm-wiki/infographics/  # LLM Wiki 配图\n```\n\n如果要把某个大文件入库，先从 `.gitignore` 移除对应规则，再 `git add`。\n\n---\n\n## 目录约定\n\
    \n- **新增项目** → 放 `项目/<slug>/`，并在 `PROJECTS.md` 注册一行\n- **新增课题** → 放 `项目/课题/<名称>/`，附 README.md\n- **每日日志** → `维护/日志/YYYY-MM/YYYY-MM-DD.md`（按月归档）\n\
    - **运维报告** → `维护/reports/github-ops-report-YYYY-MM-DD.md`\n- **归档** → 移入 `归档/`，附归档日期\n\n---\n\n## 历史\n\n- **2026-07-31**\
    \ — 二层目录重组：原「清单/引导/技能/任务/日志/速查/_报告/代码运维」归入 `维护/`；原「课题库/提案/语料/独立项目/健康/知识库/topics」归入 `项目/`；顶层只保留三个中文目录（项目 / 维护 / 归档）\n-\
    \ **2026-08-01** — 顶层目录改名：英文 → 中文简称（projects→项目、topics→课题库、memory→日志 等）；清理 github/ 临时产物；冗余文件归档\n- **2026-07-08** — 大规模重构：`project/`\
    \ 拆解合并入 `projects/`（现已改名 `项目/`）；中文顶层目录归并 `topics/`（现已改名 `课题库/`）；二进制走 gitignore\n- 详见 `git log`\n"
