  readme_excerpt: FightBrain
  readme_full: "<p align=\"center\">\n  <img src=\"web/public/favicon.svg\" width=\"80\" height=\"80\" alt=\"FightBrain Logo\"\
    >\n  <br>\n  <strong>FightBrain</strong>\n</p>\n\n<p align=\"center\">\n  面向职场人士的脑科学科普与应用平台<br>\n  Brain science corpus\
    \ and AI mind map platform for working professionals.\n</p>\n\n<p align=\"center\">\n  <img src=\"https://img.shields.io/badge/React-19-blue\"\
    \ alt=\"React\">\n  <img src=\"https://img.shields.io/badge/TypeScript-5.9-blue\" alt=\"TypeScript\">\n  <img src=\"https://img.shields.io/badge/Vite-8-purple\"\
    \ alt=\"Vite\">\n  <img src=\"https://img.shields.io/badge/License-MIT-green\" alt=\"License\">\n</p>\n\n---\n\n## 它是什么\n\
    \n**FightBrain** 把\"脑科学硬核内容\"和\"AI 思维工具\"绑在了一起：\n\n- **51 张知识卡片** — 覆盖 10 个脑科学领域，每张都带学术引用（中英双语）\n- **6 条学习路径** — 按目标串好的卡片序列（如\"\
    压力管理大师\"\"高效能\"）\n- **6 套模板** — 决策、复盘、SOP 写作等高频场景\n- **4 套 AI 操作** — 通用动作（展开/精炼/整理/总结/发散）+ 脑科学专属（解读/实践/自测题）\n- **4 种平台模式**\
    \ — 脑科学百科、思维导图、专注训练、脑力测评\n\n不是一个普通的\"AI 脑图工具\"——它是**有内容底蕴的脑图工具**。\n\n---\n\n## 项目结构\n\n```\nfight-brain/\n├── fundamentals/\
    \         # \U0001F9E0 大脑基础        8 cards\n├── attention/            # \U0001F3AF 注意力管理       5 cards\n├── memory/  \
    \             # \U0001F4BE 记忆技巧         5 cards\n├── decision/             # ⚖️ 决策优化         6 cards\n├── creativity/\
    \           # \U0001F4A1 创造力激发       4 cards\n├── emotion/              # \U0001F49A 情绪管理         4 cards\n├── stress/\
    \               # \U0001F30A 压力管理         4 cards\n├── sleep/                # \U0001F319 睡眠与大脑       4 cards\n├── learning/\
    \             # \U0001F4D6 学习科学         6 cards\n├── collaboration/        # \U0001F91D 团队脑科学       5 cards\n│\n├── learning-paths/\
    \       # \U0001F680 学习路径         6 paths\n├── templates/            # \U0001F4CB 脑科学模板       6 templates\n├── prompts/\
    \              # \U0001F916 AI Prompt 系统    6 prompts\n│\n├── schema.md             # 数据模型说明\n├── corpus/            \
    \   # 生成的 JSON 索引（.md → JSON）\n├── scripts/              # 构建脚本（build-corpus / generate-md）\n│\n├── web/             \
    \     # Web UI（React 19 + Vite 8 + Markmap）\n│   ├── src/\n│   │   ├── components/\n│   │   │   ├── BrainPedia/     #\
    \ 脑科学百科\n│   │   │   ├── MindMap/        # 思维导图画布 + 搜索 + 会话历史 + 模板\n│   │   │   ├── FocusTraining/  # 专注训练\n│   │   │\
    \   ├── BrainAssess/    # 脑力测评\n│   │   │   ├── NodeActions/    # 右键 AI 菜单\n│   │   │   ├── Settings/       # 设置 + 导出\n\
    │   │   │   └── Toolbar/        # 顶部工具栏 + 键盘快捷键\n│   │   ├── store/        # Zustand 状态（撤销/重做 50 步）\n│   │   ├── services/\
    \     # LLM 客户端（OpenAI 兼容 + Ollama 本地）\n│   │   ├── hooks/        # Markmap 生命周期\n│   │   ├── utils/        # 树结构工具 +\
    \ prompt 模板\n│   │   └── types/        # TypeScript 类型\n│   ├── e2e/              # Playwright 烟雾测试\n│   └── public/ \
    \          # 静态资源 + PWA manifest\n│\n├── package.json          # Monorepo 编排（workspaces: [web]）\n└── README.md\n```\n\n\
    每个领域目录包含：\n- `_index.md` — 领域概述\n- `{card-id}.md` — 知识卡片（含 YAML frontmatter 元数据 + 中英正文）\n\n---\n\n## Quick Start\n\n```bash\n\
    # 1. 装依赖（根目录 npm install 即可，workspaces 会自动装 web/）\nnpm install\n\n# 2. 启动开发服务器\nnpm run dev          # → http://localhost:5173\n\
    \n# 3. 从 .md 重新生成 corpus JSON（修改了卡片后跑）\nnpm run build:corpus\n\n# 4. 生产构建\nnpm run build        # → web/dist/\n\n# 5.\
    \ 跑测试\ncd web && npm test\n```\n\n**第一次跑**记得在网页右上角点 ⚙️ Settings 配 LLM：\n\n| 预设 | Base URL | 备注 |\n|------|----------|------|\n\
    | **Kimi K2.5** | `https://api.moonshot.cn/v1` | 国内可用 |\n| **OpenAI GPT-4o** | `https://api.openai.com/v1` | 海外 |\n| **Ollama（本地）**\
    \ | `http://localhost:11434/v1` | 无需 API Key |\n| 自定义 | 任意 OpenAI 兼容端点 | 填 Base URL + Key |\n\nAPI Key 只存在浏览器 localStorage，不上云。\n\
    \n---\n\n## 平台模式\n\n| 模式 | 说明 |\n|------|------|\n| \U0001F9E0 **脑科学百科**（BrainPedia） | 左侧卡片浏览 + 右侧导图联动；点卡片看详情，导图自动定位关联节点\
    \ |\n| \U0001F5FA️ **思维导图**（MindMap） | 沉浸式全屏导图，AI 扩展开启头脑风暴 |\n| ⏱️ **专注训练**（Focus） | 基于神经科学的番茄钟，附专注度自评 |\n| \U0001F9EA\
    \ **脑力测评**（Assessment） | 工作记忆 / 注意力 / 决策倾向自测 |\n\n---\n\n## AI 操作\n\n通用（思维导图右键菜单）：\n\n| Action | 说明 |\n|--------|------|\n\
    | **Expand** | 给当前节点生成子主题 |\n| **Refine** | 优化文字表述 |\n| **Reorganize** | 合并 / 排序 / 重分类子节点 |\n| **Summarize** | 把子树压成精炼摘要\
    \ |\n| **Brainstorm** | 自由联想发散 |\n\n脑科学专属（知识卡片侧栏）：\n\n| Action | 说明 |\n|--------|------|\n| **Explain** | 从脑科学角度解读当前主题\
    \ |\n| **Apply** | 生成脑科学实践建议 |\n| **Quiz** | 出几道自测题巩固知识 |\n\n支持流式响应 + 取消（点 streaming 卡片上的 ⏹ 按钮）。配置 Ollama 后无需 API Key\
    \ 即可用。\n\n---\n\n## 内容格式示例\n\n```yaml\n---\nid: fund-prefrontal\ndomain: fundamentals\ntitle: \"前额叶皮层：你的CEO\"\ntitleEn:\
    \ \"Prefrontal Cortex: Your Inner CEO\"\ndifficulty: beginner\nicon: \"\U0001F393\"\nrelatedCards: [fund-amygdala, stress-response,\
    \ emo-cognitive-reappraisal]\n---\n\n# \U0001F393 前额叶皮层：你的CEO\n\n## 核心概念\n...\n\n> PFC handles executive functions: decision-making,\
    \ planning, and self-control\n## Core Concepts\n...\n```\n\n修改 `.md` → 跑 `npm run build:corpus` → `corpus/` 里的 JSON 索引自动更新\
    \ → 前端重新拉取即可看到新内容。\n\n---\n\n## Tech Stack\n\n- **React 19** + **TypeScript 5.9**（strict + noUnused\\*）\n- **Vite 8**\
    \ — 构建\n- **Markmap** — 思维导图渲染（SVG + D3）\n- **Zustand 5** — 状态管理（撤销/重做 + localStorage 持久化）\n- **Tailwind CSS 4** — 样式\n\
    - **Lucide React** — 图标\n- **Vitest 4** + **Playwright** — 单元 / E2E 测试\n- **idb** — IndexedDB（本地优先存储）\n\n---\n\n## Roadmap\n\
    \n- ✅ Phase 1-7：基础功能 + Bug 修复 + UX 打磨 + 测试覆盖（51 项全部完成）\n- ✅ Phase 8 部分：Ollama 本地 AI、性能优化、附件、Immer、撤销/重做重构\n- ⏳ Phase 8\
    \ 待办：CRDTs + IndexedDB 协同、云同步、VS Code 插件、插件市场、Open API\n\n详细见 `web/DEVELOPMENT.md`。\n\n---\n\n## 2026 Updates\n\n### 新增卡片\
    \ / New Cards (2025-2026 前沿神经科学)\n\n本次更新基于 2024-2026 年最新神经科学研究，新增 5 张高质量知识卡片，覆盖职场脑科学的前沿议题：\n\n| 卡片 ID | 域 | 主题 | 难度 |\n\
    |---------|------|------|------|\n| `fund-predictive-processing` | 大脑基础 | 预测处理 / 主动推断理论（Karl Friston框架） | 进阶 |\n| `fund-gut-brain-axis`\
    \ | 大脑基础 | 肠脑轴与认知表现——\"第二个大脑\"的神经科学 | 中级 |\n| `learn-ai-augmented-learning` | 学习科学 | AI辅助学习对记忆巩固的重塑与风险 | 中级 |\n| `collab-social-baseline`\
    \ | 团队脑科学 | 社会基线理论——远程工作的隐性认知代价 | 中级 |\n| `dec-interoception` | 决策优化 | 内感受与决策——身体信号如何塑造每个决定 | 进阶 |\n\n**关键研究亮点**：\n- Friston\
    \ 自由能原理（2022, Neuron）在职场认知中的应用\n- 迄今最大规模肠脑轴认知研究（N=8,117, Cell Host & Microbe 2024）\n- AI学习工具的\"认知卸载\"效应（Nature Human Behaviour\
    \ 2025, Doshi & Hauser）\n- 微软远程工作大规模研究（Nature Human Behaviour 2022）+ Zoom疲劳神经基础（PNAS 2024）\n- 内感受准确性与决策质量元分析（N=7,400,\
    \ PNAS 2024）\n\n---\n\n## License\n\nMIT\n"
