  description: '# Netlify CMS small-business template'
  readme_excerpt: '# Netlify CMS small-business template'
  readme_full: "# Netlify CMS small-business template\n\nThis is a small business template built with [Victor Hugo](https://github.com/netlify/victor-hugo)\
    \ and [Netlify CMS](https://github.com/netlify/netlify-cms).\n\n## Getting started\n\nUse our deploy button to get your\
    \ own copy of the repository:\n\n[![Deploy to Netlify](https://www.netlify.com/img/deploy/button.svg)](https://app.netlify.com/start/deploy?repository=https://github.com/netlify-templates/kaldi-hugo-cms-template)\n\
    \nOnce that is done, you need to setup the GitHub integration for Netlify CMS.\n\nGo to https://github.com/settings/developers\
    \ and register a new application.\n\nThen go to the \"Access\" tab in your new Netlify site and add a GitHub authentication\
    \ provider.\n\nOnce that's done, you'll be able to enter the CMS by going to the URL of your new site and appending `/admin`\n\
    \n## Local Development\n\nClone this repository, and run `yarn` or `npm install` from the new folder to install all required\
    \ dependencies.\n\nThen start the development server with `yarn start` or `npm start`.\n\n## Layouts\n\nThe template is\
    \ based on small, content-agnostic partials that can be mixed and matched. The pre-built pages showcase just a few of\
    \ the possible combinations. Refer to the `site/layouts/partials` folder for all available partials.\n\nUse Hugo’s `dict`\
    \ functionality to feed content into partials and avoid repeating yourself and creating discrepancies.\n\n## CSS\n\nThe\
    \ template uses a custom fork of Tachyons and PostCSS with cssnext and cssnano. To customize the template for your brand,\
    \ refer to `src/css/imports/_variables.css` where most of the important global variables like colors and spacing are stored.\n\
    \n## SVG\n\nAll SVG icons stored in `site/static/img/icons` are automatically optimized with SVGO (gulp-svgmin) and concatenated\
    \ into a single SVG sprite stored as a a partial called `svg.html`. Make sure you use consistent icons in terms of viewport\
    \ and art direction for optimal results. Refer to an SVG via the `<use>` tag like so:\n\n```\n<svg width=\"16px\" height=\"\
    16px\" class=\"db\">\n  <use xlink:href=\"#SVG-ID\"></use>\n</svg>\n```\n"
