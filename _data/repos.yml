    \ | 爵士历史与伟大录音 |\n\n### [`15-Rock-School`](./15-Rock-School/) — 摇滚音乐学院\n\n摇滚乐从理论、技巧、创作到历史的系统课程（当前为骨架，持续建设中）。\n\n| 单元 |\
