    └── README.md

    ```


    ## 🔌 API 端点


    ### 认证

    - `GET /api/v1/auth/ticktick/login` - 获取滴答清单登录 URL

    - `GET /api/v1/auth/callback` - OAuth 回调

    - `POST /api/v1/auth/refresh` - 刷新令牌


    ### 任务

    - `GET /api/v1/tasks` - 获取任务列表

    - `POST /api/v1/tasks` - 创建任务

    - `PUT /api/v1/tasks/{id}` - 更新任务

    - `DELETE /api/v1/tasks/{project_id}/{task_id}` - 删除任务

    - `POST /api/v1/tasks/{project_id}/{task_id}/complete` - 完成任务


    ### 项目

    - `GET /api/v1/projects` - 获取项目列表

    - `POST /api/v1/projects` - 创建项目

    - `PUT /api/v1/projects/{id}` - 更新项目

    - `DELETE /api/v1/projects/{id}` - 删除项目


    ### 分析

    - `GET /api/v1/analytics/dashboard` - 仪表盘数据

    - `GET /api/v1/analytics/full` - 完整分析


    ### AI

    - `POST /api/v1/ai/analyze` - 生产力分析

    - `POST /api/v1/ai/suggest-breakdown` - 任务拆分建议

    - `POST /api/v1/ai/suggest-priority` - 优先级建议

    - `POST /api/v1/ai/daily-plan` - 生成每日计划

    - `POST /api/v1/ai/chat` - AI 助手聊天


    ### 提醒

    - `GET /api/v1/reminders` - 获取提醒

    - `POST /api/v1/reminders` - 创建提醒


    ### 导出

    - `GET /api/v1/export/tasks/json` - 导出 JSON

    - `GET /api/v1/export/tasks/csv` - 导出 CSV

    - `GET /api/v1/export/tasks/excel` - 导出 Excel

    - `POST /api/v1/export/tasks/json` - 导入 JSON


    ## 🛠️ 技术栈


    ### 后端

    - **FastAPI** - Web 框架

    - **SQLAlchemy** - ORM

    - **Pydantic** - 数据验证

    - **HTTPX** - HTTP 客户端

    - **OpenAI** - AI 功能

    - **APScheduler** - 定时任务


    ### 前端

    - **React 18** - UI 框架

    - **TypeScript** - 类型安全

    - **Vite** - 构建工具

    - **TanStack Query** - 数据获取

    - **Zustand** - 状态管理

    - **Tailwind CSS** - 样式

    - **Recharts** - 图表

    - **Dnd Kit** - 拖拽


    ## 📝 开发计划


    - [x] 项目架构设计

