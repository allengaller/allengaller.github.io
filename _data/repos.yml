    \ 补齐缺口 | 增加基础预训练、数据工程、模型合并（model merging）、长上下文推理等 |\n| **中期** | 2026 Q3-Q4 | 深化应用与 Agentic | RAG 高级主题（routing、agentic-rag）、Multi-Agent\
    \ 编排框架（AutoGen、CrewAI）、可视化/可解释评估 |\n| **长期** | 2027 Q1 | 前沿与平台化 | 多模态大模型、MoE 训练、推理系统调度、企业级 LLMOps、在线实验环境配套 |\n\n### 本次补齐（2026-06-16）\n\
    \n- `training/data-curation-pipeline`：大模型数据清洗 Pipeline\n- `inference/inference-engine-comparison`：vLLM / TGI / SGLang\
