  description: '# GitHub Treasure Repo'
  readme_excerpt: '# GitHub Treasure Repo'
  readme_full: "# GitHub Treasure Repo\n\n[![CI](https://github.com/allengaller/repo-hoarder/actions/workflows/ci.yml/badge.svg)](https://github.com/allengaller/repo-hoarder/actions/workflows/ci.yml)\n\
    [![Monthly Scrape](https://github.com/allengaller/repo-hoarder/actions/workflows/monthly-scrape.yml/badge.svg)](https://github.com/allengaller/repo-hoarder/actions/workflows/monthly-scrape.yml)\n\
    [![Monthly Update](https://github.com/allengaller/repo-hoarder/actions/workflows/monthly-update.yml/badge.svg)](https://github.com/allengaller/repo-hoarder/actions/workflows/monthly-update.yml)\n\
    [![Pages](https://github.com/allengaller/repo-hoarder/actions/workflows/deploy-pages.yml/badge.svg)](https://github.com/allengaller/repo-hoarder/actions/workflows/deploy-pages.yml)\n\
    [![Live](https://img.shields.io/badge/Live-GitHub_Pages-blue)](https://allengaller.github.io/repo-hoarder/)\n\n[中文文档](README.zh-CN.md)\
    \ · [Live Demo](https://allengaller.github.io/repo-hoarder/) · [Report an Issue](https://github.com/allengaller/repo-hoarder/issues)\n\
    \nAn open-source, fully automated aggregator for high-quality GitHub projects. Combines multiple data sources — **Awesome\
    \ Lists**, **GitHub Search API**, **Hacker News**, and **DEV.to** — into a single curated catalog with smart filtering,\
    \ inspiration mode, and bookmark management.\n\nBeyond the automated dataset, the repo maintains a **curated knowledge\
    \ base** ([`catalog/`](catalog/README.md)) — one Markdown profile per notable repo (frontmatter metadata + in-depth analysis),\
    \ organized by tech domain and kept fresh by `scripts/catalog.py` and monthly CI.\n\n---\n\n## Features\n\n### Discovery\n\
    - **Inspiration Mode** — full-screen swipe/keyboard-driven card browser\n- **Smart Recommendations** — suggestions based\
    \ on your bookmarked languages and keywords\n- **Random Treasure** — shuffle through quality projects you'd otherwise\
    \ miss\n- **Surge Index** — sort by `today_stars / stars` to spot the fastest risers\n\n### Filtering & Search\n- Multi-dimensional\
    \ filters: language, stars, forks, score\n- Live search-as-you-type\n- Shareable filter URLs (state synced via query params)\n\
    - Saved filter presets\n\n### Collection Management\n- `localStorage`-backed bookmarks\n- Batch bookmark / batch export\n\
    - Side-by-side project comparison\n- JSON export\n\n### UX Polish\n- Dark / light theme (persisted)\n- Chinese / English\
    \ i18n toggle\n- PWA with offline support\n- Full keyboard navigation\n\n---\n\n## Quick Start\n\n### Online (recommended)\n\
    \n\U0001F449 **https://allengaller.github.io/repo-hoarder/** — data refreshed daily by GitHub Actions.\n\n### Local\n\n\
    ```bash\ngit clone https://github.com/allengaller/repo-hoarder.git\ncd repo-hoarder\n\n# Option A — use the bundled seed\
    \ (28 curated repos, no network needed)\npip install -r requirements.txt\ncd web && python3 -m http.server 8000\n# open\
    \ http://localhost:8000\n\n# Option B — fetch the live dataset (~5 min, requires GITHUB_TOKEN for full coverage)\npip\
    \ install -r requirements.txt\npython3 scripts/scrape.py\ncd web && python3 -m http.server 8000\n# open http://localhost:8000\n\
    ```\n\n### Updating the dataset\n\n```bash\n# Full scrape (all sources)\npython3 scripts/scrape.py\n\n# Incremental update\
    \ for a specific month\npython3 scripts/update_monthly.py --year 2026 --month 6 --report\n```\n\n### Curating the catalog\n\
    \n```bash\n# Discover candidate repos (gh CLI required) -> data/discoveries.jsonl\npython3 scripts/discover_repos.py\n\
    \n# Draft a profile for a repo worth keeping\npython3 scripts/catalog.py new https://github.com/owner/repo --domain ai-agents\n\
    \n# Rebuild the index and validate all profiles\npython3 scripts/catalog.py index\npython3 scripts/catalog.py validate\n\
    \n# Refresh stars/forks/license from the GitHub API (also run monthly by CI)\npython3 scripts/catalog.py refresh\n```\n\
    \nSee [`catalog/README.md`](catalog/README.md) for the taxonomy, naming rules, and profile template.\n\n### Running tests\n\
    \n```bash\npip install pytest\npytest tests/ -v\n```\n\n---\n\n## Keyboard Shortcuts\n\n| Key | Action |\n|---|---|\n\
    | `/` | Focus search |\n| `T` | Toggle theme |\n| `B` | Toggle bookmarks view |\n| `L` | Toggle language |\n| `?` | Show\
    \ help |\n| `↑` / `↓` | Navigate list |\n| `Enter` | Open details |\n| `Space` | Bookmark |\n| `C` | Compare mode |\n\
    | `←` / `→` | Prev/next in inspiration mode |\n| `P` | Auto-play inspiration |\n| `F` | Flip inspiration card |\n\n---\n\
    \n## Data Sources\n\n| Source | Description |\n|---|---|\n| **Awesome Lists** | vinta/awesome-python, avelino/awesome-go,\
    \ and 6 more |\n| **GitHub Search API** | Recent-activity queries across 5 dimensions |\n| **Hacker News** | Top HN stories\
    \ linking to GitHub repos |\n| **DEV.to** | GitHub repos extracted from trending articles |\n\n---\n\n## Scoring Algorithm\n\
    \n```\nscore = stars\n      + forks\n      + (forks / stars) × 1000   # community engagement\n      + today_stars × 10\
    \          # momentum\n      + commit_activity × 2       # 4-week commit count (freshness)\n```\n\n`today_stars` is estimated\
    \ from push/creation recency (the GitHub Search API does not expose per-day star counts). For the top-N trending repos\
    \ we additionally query the free `stats/commit_activity` endpoint to ground the signal in real data.\n\n---\n\n## Project\
    \ Structure\n\n```\nrepo-hoarder/\n├── scripts/\n│   ├── scrape.py              # Multi-source aggregator\n│   ├── update_monthly.py\
    \      # Per-month incremental fetch\n│   ├── catalog.py             # Curated catalog manager (new/index/validate/refresh)\n\
    │   └── discover_repos.py      # Keyword-based repo discovery (gh CLI)\n├── tests/\n│   ├── test_scripts.py        # pytest\
    \ suite for scrapers\n│   └── test_catalog.py        # pytest suite for the catalog manager\n├── data/\n│   ├── repos.json\
    \             # Aggregated dataset\n│   ├── discoveries.jsonl      # Discovery inbox (candidate repos, JSONL)\n│   └──\
    \ monthly_report_*.md    # Monthly reports\n├── catalog/                   # Curated per-repo Markdown profiles\n│   ├──\
    \ README.md              # Taxonomy, naming rules, workflows\n│   ├── INDEX.md               # Auto-generated index (by\
    \ domain/type/month)\n│   ├── _template.md           # Profile template\n│   └── <domain>/<repo>.md     # e.g. ai-agents/,\
    \ ai-mental-health/, ...\n├── research/                  # Cross-repo research reports (topic-level)\n├── web/\n│   ├──\
    \ index.html             # UI entry\n│   ├── styles.css\n│   ├── app.js                 # Vanilla JS frontend\n│   ├──\
    \ sw.js                  # Service Worker (PWA)\n│   └── manifest.json\n├── docs/                      # Archived history\
    \ docs\n├── .github/workflows/\n│   ├── ci.yml                 # PR/push tests + catalog validation\n│   ├── deploy-pages.yml\n\
    │   ├── monthly-scrape.yml\n│   └── monthly-update.yml     # Monthly fetch + catalog refresh/index\n└── requirements.txt\n\
    ```\n\n---\n\n## Tech Stack\n\n| Layer | Tech |\n|---|---|\n| Scraper | Python 3 + requests + BeautifulSoup |\n| Frontend\
    \ | Vanilla HTML / CSS / JS (zero build step) |\n| Offline | Service Worker + PWA |\n| CI/CD | GitHub Actions |\n| Hosting\
    \ | GitHub Pages |\n\n---\n\n## FAQ\n\n**Q: \"Failed to load data\" on the page?**\nOpen via an HTTP server (`python3\
    \ -m http.server 8000`). Browsers block `fetch` under `file://`.\n\n**Q: Hitting GitHub API rate limits?**\nSet the `GITHUB_TOKEN`\
    \ environment variable — raises the limit from 60 to 5,000 requests/hour.\n\n**Q: Deploy to your own fork?**\n1. Fork\
    \ the repo\n2. Settings → Pages → Source: **GitHub Actions**\n3. Push; the deploy workflow runs automatically.\n\n---\n\
    \n## License\n\nMIT\n"
