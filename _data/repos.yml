  readme_full: '


    <div align="center">


    # hack-core-database


    ### 面向智能体问答、检索增强与知识训练的安全语料库


    **结构化 · AI 原生 · 高信息密度 · 边界清晰**


    [快速开始](#快速开始) · [内容结构](#内容结构) · [文档标准](#文档标准) · [AI/RAG 设计](#airag-设计) · [路线图](ROADMAP.md)


    </div>


    ---


    ## 这是什么？


    `hack-core-database` 是一个以 Markdown 为载体、以 YAML Front Matter 为元数据骨架、面向 **AI Agent / RAG / 知识训练 / 复杂问答** 优化的安全知识语料库。


    它的目标不是只做文档归档，而是沉淀一套对智能体真正有用的安全知识单元：


    - **知识点边界清晰**：不仅解释“是什么”，还解释“适用于什么、不适用于什么、与谁容易混淆”

    - **产品边界清晰**：不仅介绍产品名词，还写明“解决什么、不解决什么、部署在哪里、与相邻产品如何区分”

    - **信息密度可用于问答**：每篇重点文档尽量覆盖威胁模型、检测信号、防护措施、误区、FAQ、关联文档


    ## 内容结构


    仓库按知识层、产品层、运营层、案例层与命令层组织：


    - `01-foundations/`：基础理论与高频安全概念

    - `02-offensive-security/`：攻防技术、渗透测试、红蓝对抗

    - `03-security-operations/`：检测、运营、应急、取证与实践指南

    - `04-compliance-governance/`：合规治理、等保、审计、风险管理

    - `05-security-architecture/`：架构、控制矩阵、应用/API/LLM 安全设计

    - `06-security-products/`：安全产品定位、能力边界、对比矩阵与选型说明

    - `07-open-source/`：开源安全工具评测与部署指南

    - `08-case-studies/`：案例与分析材料

    - `09-career/`：职业发展路径、认证、面试与技能矩阵

    - `10-security-commands/`：命令、排障与操作型知识

    - `glossary/`：核心术语、产品术语与云安全术语消歧

    - `index/`：主题导航、标签索引、分类映射与学习路径


    ## 这个仓库特别强调什么？


    ### 面向智能体的高质量语料标准


    重点文档优先补齐以下维度：


    - **定义边界**：是什么，不是什么

    - **上下位关系**：与相邻概念、相邻产品的关系

    - **适用场景**：什么时候该用，什么时候不该用

    - **威胁模型**：攻击面、常见失效方式、典型路径

    - **检测与防护**：应关注哪些日志、信号、控制点

    - **常见误区与 FAQ**：减少问答时的概念混淆

    - **关联导航**：与操作文档、产品词条、案例和命令参考回链


    ### 产品知识不仅是“产品简介”


    产品类文档重点讲清：


    - 产品定位与核心价值

    - 输入、处理、输出与部署位置

    - 与相邻产品的**能力边界**

    - 常见盲区、失败模式和适用组织阶段

    - 选型时应比较的维度


    ## AI/RAG 设计


    本仓库从设计上服务于 AI 检索与问答：


    - 统一 Front Matter 元数据

    - 语义化文件命名

    - `ai_summary` 摘要

    - 标签、术语、关联文档

    - 原子化主题拆分与专题对比文档


    ### 适合的用法


    - 作为安全领域 Agent 的外部知识源

    - 作为 RAG 的高质量检索语料

    - 作为安全训练集或问答样本母本

    - 作为知识图谱或控制映射的基础材料


    ## 安全基线脚本库


    `scripts/security-baseline/` 包含 **35+ 自动化脚本**（10,000+ 行代码），覆盖安全基线检查、自动修复、合规报告与事件响应全链路：


    - **平台检查**：Linux / macOS / Windows 主机安全基线

    - **专项扫描**：容器、K8s、云元数据、网络、Web、API、数据库、日志、威胁情报

    - **自动修复**：Linux/macOS/Windows 安全加固（支持 dry-run 与交互模式）

    - **分析与报告**：CIS 合规报告、趋势 Dashboard、差距分析、加固 Playbook 生成

    - **运维集成**：远程批量扫描、定时任务、Git pre-commit 钩子、通知推送

    - **事件响应**：系统快照取证、进程隔离、文件完整性监控


    ```bash

    cd scripts/security-baseline

    make help      # 查看 36 个可用命令

    make test      # 测试所有脚本

    make check     # 运行当前平台安全检查

    make scan-all  # 运行所有适用检查

    make dashboard # 生成趋势分析 Dashboard

    ```


    ## AI/RAG 数据资产


    `public/data/` 包含预计算的 AI 检索数据：


    - `embeddings.json` — 文档向量（支持 TF-IDF / OpenAI / sentence-transformers）

    - `knowledge-graph.json` — 知识图谱（1001+ 节点，117743 条边）

    - `similarity-index.json` — 预计算 top-k 相似文档

    - `vector-db.json` — 零依赖 JSON 向量存储

    - `doc-metadata.json` — 完整文档元数据


