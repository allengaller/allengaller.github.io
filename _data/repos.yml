  readme_full: "# 平静实验室 Peace Lab\n\n心理自助频道主页\n\n## 快速开始\n\n### 安装依赖\n```bash\nnpm install\n```\n\n### 开发模式\n```bash\nnpm\
    \ run dev\n```\n\n### 构建生产版本\n```bash\nnpm run build\n```\n\n### 预览构建结果\n```bash\nnpm run preview\n```\n\n## 项目结构\n\n\
    ```\npeace-lab-global/\n├── index.html          # 主页面\n├── style.css           # 样式文件\n├── vite.config.js      # Vite\
    \ 配置\n├── package.json        # 依赖配置\n├── .gitignore         # Git 忽略文件\n└── README.md          # 项目说明\n```\n\n## 部署\n\
    \n### GitHub Pages（推荐）\n\n详细部署步骤请查看 [DEPLOY.md](./DEPLOY.md)\n\n**快速部署：**\n\n1. 在 GitHub 仓库设置中启用 GitHub Pages（Source 选择：GitHub\
    \ Actions）\n2. 推送代码，自动触发部署\n3. 访问 `https://allen-galler.github.io/peace-lab-global/`\n\n### 其他平台\n\n构建后，将 `dist` 目录部署到\
    \ Netlify、Vercel、CloudBase 等平台。\n\n## 配置说明\n\n### 修改部署路径\n编辑 `vite.config.js` 中的 `base` 配置：\n\n```js\nexport default defineConfig({\n\
    \  base: '/your-repo-name/',  // 修改为你的仓库名\n  // ...\n})\n```\n\n### 修改配色\n编辑 `style.css` 中的 CSS 变量：\n\n```css\n:root {\n\
    \  --primary-color: #6a89cc;      /* 主色 */\n  --secondary-color: #4a69bd;    /* 辅助色 */\n  --accent-color: #82ccdd;   \
    \    /* 强调色 */\n  /* ... */\n}\n```\n\n### 修改内容\n直接编辑 `index.html` 中的文本内容即可。\n\n## 平台账号\n\n各平台主账号同名：**平静实验室 PeaceLab**\n\
    \n- 图文：微信公众号、小红书、知乎、微博\n- 视频：微信视频号、哔哩哔哩、抖音\n- 博客：小宇宙、喜马拉雅、Apple Podcast\n- 音乐：网易云音乐\n\n## 联系方式\n\n- 邮箱：allengaller@qq.com\n\
    - 微信：allengaller\n"
