  readme_full: "# \U0001F99E Klaw - Kubernetes 智能运维助手\n\n[![Go Version](https://img.shields.io/badge/Go-1.24+-blue.svg)](https://golang.org)\n\
    [![React Version](https://img.shields.io/badge/React-18-blue.svg)](https://reactjs.org)\n[![License](https://img.shields.io/badge/License-MIT-green.svg)](LICENSE)\n\
    \nKlaw 是一个开箱即用的 Kubernetes 运维工具，提供现代化的 Web UI 界面和 ChatOps 能力，支持通过钉钉/飞书直接管理集群，实现实时事件监控和告警推送。\n\n## \U0001F31F 核心特性\n\n\
    ### \U0001F4CA Web 管理界面\n- **Dashboard**：集群概览、节点/Pod 统计、资源使用趋势\n- **Deployment 管理**：列表、详情、扩缩容、重启、查看关联 Pod\n- **Service\
    \ 管理**：列表、详情、Endpoints 展示\n- **Pod 管理**：查看、搜索、删除、实时日志\n- **Node 管理**：节点状态、资源容量、实时监控\n- **Monitoring**：实时告警、历史趋势、图表展示\n\
    - **深色模式**：自动/手动主题切换\n\n### \U0001F4AC ChatOps（钉钉/飞书）\n- **双向通信**：在钉钉群中直接执行命令，实时获取结果\n- **命令支持**：\n  ```\n  klaw cluster\
    \ status <cluster>       # 查看集群状态\n  klaw pod list <cluster> <ns>        # 列出 Pod\n  klaw pod logs <cluster> <ns> <pod>\
    \  # 查看日志\n  klaw pod delete <cluster> <ns> <pod># 删除 Pod\n  klaw node list <cluster>            # 列出节点\n  klaw monitor\
    \ status <cluster>       # 查看监控状态\n  ```\n- **命令缩写**：`p` = `pod`, `ls` = `list`, `desc` = `describe`\n- **富文本输出**：Markdown\
    \ 格式、表格展示、代码块\n\n### ⚡ 实时事件监控（Watch 模式）\n- **秒级推送**：从轮询升级为 K8s Watch API，延迟 < 1 秒\n- **智能过滤**：按命名空间、资源类型、事件类型、原因过滤\n-\
    \ **防消息风暴**：速率限制、事件去重、事件聚合\n- **Markdown 告警**：美观的事件推送格式\n\n### \U0001F527 运维能力\n- **多集群管理**：支持同时管理多个 Kubernetes 集群\n-\
    \ **监控告警**：CPU、内存、节点状态、Pod 状态监控\n- **自动图表生成**：集群资源使用趋势图\n- **权限控制**：API Bearer Token 认证（`server.auth`）+ CORS 白名单，ChatOps\
    \ 侧基于消息平台的用户身份\n\n## \U0001F3D7️ 架构设计\n\n```\n┌─────────────────────────────────────────────────────────────────────────────┐\n\
    │                              Klaw                                           │\n│  ┌──────────────┐  ┌──────────────┐\
    \  ┌─────────────────────────────────────┐│\n│  │   Web UI     │  │   ChatOps    │  │         Event System           \
    \     ││\n│  │   (React)    │  │  (DingTalk)  │  │  ┌─────────┐  ┌─────────────────┐  ││\n│  │              │  │     \
    \         │  │  │  Watch  │  │  Event Notifier │  ││\n│  │  Dashboard   │  │  双向通信    │  │  │ Source  │  │  • Rate Limit\
    \   │  ││\n│  │  Deployments │  │  命令路由    │  │  └────┬────┘  │  • Deduplicate  │  ││\n│  │  Services    │  │  Markdown\
    \    │  │       │       │  • Aggregate    │  ││\n│  └──────────────┘  └──────────────┘  │       ▼       └─────────────────┘\
    \  ││\n│           │                │         │  K8s Events  ──▶  DingTalk Push    ││\n│           └────────────────┴─────────┴─────────────────────────────────────┘│\n\
    │                              │                                               │\n│                   ┌─────────┴─────────┐\
    \                                     │\n│                   ▼                   ▼                                   \
    \  │\n│        ┌─────────────────────┐  ┌─────────────────────┐                    │\n│        │   K8s Manager       │\
    \  │   API Server        │                    │\n│        │   (client-go)       │  │   (Gorilla)         │           \
    \         │\n│        └─────────────────────┘  └─────────────────────┘                    │\n└─────────────────────────────────────────────────────────────────────────────┘\n\
    ```\n\n## \U0001F680 快速开始\n\n### 环境要求\n\n- Go 1.24+（modules/etcd-guardian 需 Go 1.26+）\n- Node.js 18+\n- 访问 Kubernetes\
    \ 集群的权限（~/.kube/config）\n\n### 安装\n\n```bash\n# 克隆仓库\ngit clone https://github.com/kudig-io/klaw.git\ncd klaw\n\n# 构建前端\n\
    cd web\nnpm install\nnpm run build\ncd ..\n\n# 构建后端\ngo build -o klaw ./cmd/klaw\n```\n\n### 配置\n\n1. 复制配置文件：\n\n```bash\n\
    cp configs/config.yaml.example configs/config.yaml\n```\n\n2. 编辑 `configs/config.yaml`：\n\n```yaml\n# Kubernetes 集群配置\n\
    kubernetes:\n  clusters:\n    - name: kind-my-k8s\n      kubeconfig: ~/.kube/config\n      context: kind-my-k8s\n\n# 钉钉集成（可选）\n\
    messaging:\n  dingtalk:\n    enabled: true\n    webhook: \"https://oapi.dingtalk.com/robot/send?access_token=xxx\"\n \
    \   secret: \"SECxxx\"\n    webhook_port: 8081  # 接收钉钉消息的端口\n\n# 实时事件监听（可选）\nevents:\n  enabled: true\n  watch_types:\n\
    \    - Pod\n    - Deployment\n    - Service\n  event_types:\n    - Warning\n    - Error\n  min_severity: warning\n  rate_limit:\
    \ 10\n  dedup_window: 300\n\nserver:\n  port: 8080\n```\n\n### 运行\n\n```bash\n./klaw\n```\n\n输出：\n```\n✓ Event source\
    \ registered for cluster: kind-my-k8s\n✓ Event monitoring started (Watch mode)\n✓ Web UI server started on port 8080\n\
    \n\U0001F99E Klaw started successfully. Press Ctrl+C to exit.\n```\n\n访问 Web UI：http://localhost:8080\n\n## \U0001F4AC\
    \ 钉钉集成完整指南\n\n### 1. 创建钉钉机器人\n\n1. 打开钉钉群设置 → 智能群助手 → 添加机器人\n2. 选择「自定义」机器人\n3. 设置机器人名称：Klaw\n4. 安全设置选择「加签」，复制签名密钥\n5. 复制\
    \ Webhook 地址\n\n### 2. 配置回调地址\n\n在钉钉开放平台：\n1. 找到 Klaw 机器人，点击「编辑」\n2. 在「消息接收地址」中填写：\n   ```\n   http://<服务器IP>:8081/webhook/dingtalk\n\
    \   ```\n3. 保存设置\n\n### 3. 配置 Klaw\n\n编辑 `configs/config.yaml`：\n\n```yaml\nmessaging:\n  dingtalk:\n    enabled: true\n\
    \    webhook: \"https://oapi.dingtalk.com/robot/send?access_token=xxx\"\n    secret: \"SECxxx\"\n    webhook_port: 8081\n\
    ```\n\n### 4. 使用示例\n\n在钉钉群中：\n\n```\n@Klaw klaw cluster status kind-my-k8s\n```\n\n回复：\n```\n\U0001F4CA **集群状态：kind-my-k8s**\n\
    \n**节点：** 3 (3 Ready)\n**Pod：** 12 Running / 2 Pending\n**CPU：** 45% / 85%\n**内存：** 60% / 75%\n```\n\n更多命令：\n```\nklaw\
    \ pod list kind-my-k8s default\nklaw pod logs kind-my-k8s default nginx-xxx\nklaw node list kind-my-k8s\nklaw help\n```\n\
    \n## ⚡ 实时事件监控\n\n### 工作原理\n\nKlaw 使用 Kubernetes Watch API 实时监听集群事件：\n\n```\nKlaw ──Watch──▶ Kubernetes API Server\n  \
    \              ◀──实时推送事件──\n                  ↓\n            事件过滤\n                  ↓\n            速率限制\n           \
    \       ↓\n            去重/聚合\n                  ↓\n            推送到钉钉\n```\n\n### 配置示例\n\n```yaml\nevents:\n  enabled:\
    \ true\n  watch_types:          # 监听的资源类型\n    - Pod\n    - Deployment\n    - Service\n    - Node\n  namespaces: []  \
    \      # 空表示所有命名空间\n  event_types:          # 监听的事件类型\n    - Warning\n    - Error\n  reasons:              # 关注的原因\n \
    \   - BackOff\n    - Unhealthy\n    - Failed\n    - OOMKilled\n  exclude_reasons:      # 排除的原因\n    - Scheduled\n    -\
    \ Pulling\n    - Pulled\n  min_severity: warning # 最小严重级别\n  rate_limit: 10        # 每秒最大事件数\n  dedup_window: 300    \
    \ # 去重窗口（秒）\n```\n\n### 实时告警示例\n\n当 Pod 崩溃时，钉钉立即收到：\n\n```markdown\n\U0001F534 **Error** - Pod\n\n**资源：** Pod/nginx-xxx\n\
    **命名空间：** default\n**集群：** kind-my-k8s\n**原因：** OOMKilled\n**时间：** 2026-04-02 13:30:00\n**消息：**\n> Container nginx was\
    \ OOM killed\n```\n\n## \U0001F4C1 项目结构\n\n```\nklaw/\n├── cmd/klaw/               # 主程序入口\n├── internal/\n│   ├── api/\
    \                # REST API 服务器\n│   ├── kubernetes/         # K8s 客户端管理\n│   ├── events/             # 事件系统（Watch 模式）\n\
    │   │   ├── source.go       # 事件抽象层\n│   │   ├── kubernetes.go   # K8s 事件监听\n│   │   └── notifier.go     # 事件通知器\n│  \
    \ ├── messaging/          # 消息平台集成\n│   │   ├── interface.go    # 通信抽象接口\n│   │   └── dingtalk/       # 钉钉插件\n│   │  \
    \     ├── client.go   # 旧版客户端\n│   │       └── plugin.go   # 新版插件（双向通信）\n│   ├── ops/                # 运维命令\n│   │   ├──\
    \ handler.go      # 命令处理器\n│   │   └── router.go       # 命令路由器\n│   ├── monitoring/         # 监控服务（轮询模式）\n│   ├── config/\
    \             # 配置管理\n│   └── openclaw/           # OpenClaw 集成\n├── web/                    # React 前端\n│   ├── src/\n\
    │   │   ├── pages/          # 页面组件\n│   │   │   ├── ServicesPage.tsx\n│   │   │   ├── DeploymentsPage.tsx\n│   │   │ \
    \  └── ...\n│   │   └── lib/api.ts      # API 客户端\n├── configs/\n│   └── config.yaml         # 配置文件\n├── docs/       \
    \            # 文档\n│   ├── phase1-implementation-summary.md\n│   ├── phase2-implementation-summary.md\n│   ├── dingtalk-integration.md\n\
    │   └── service-management-impl.md\n└── README.md               # 本文件\n```\n\n## \U0001F6E0️ API 文档\n\n### 集群管理\n- `GET\
    \ /api/clusters` - 集群列表\n- `GET /api/clusters/{name}` - 集群详情\n- `GET /api/clusters/{name}/status` - 集群状态\n- `GET /api/clusters/{name}/metrics`\
    \ - 集群指标\n- `GET /api/clusters/{name}/namespaces` - 命名空间列表\n\n### Pod 管理\n- `GET /api/clusters/{cluster}/pods` - 所有命名空间\
    \ Pod\n- `GET /api/clusters/{cluster}/namespaces/{ns}/pods` - 命名空间 Pod\n- `GET /api/clusters/{cluster}/namespaces/{ns}/pods/{name}`\
    \ - Pod 详情\n- `GET /api/clusters/{cluster}/namespaces/{ns}/pods/{name}/logs` - Pod 日志\n- `DELETE /api/clusters/{cluster}/namespaces/{ns}/pods/{name}`\
    \ - 删除 Pod\n\n### Deployment 管理\n- `GET /api/clusters/{cluster}/deployments` - 所有命名空间 Deployment\n- `GET /api/clusters/{cluster}/namespaces/{ns}/deployments`\
    \ - 命名空间 Deployment\n- `GET /api/clusters/{cluster}/namespaces/{ns}/deployments/{name}` - Deployment 详情\n- `POST /api/clusters/{cluster}/namespaces/{ns}/deployments/{name}/scale`\
    \ - 扩缩容\n- `POST /api/clusters/{cluster}/namespaces/{ns}/deployments/{name}/restart` - 重启\n\n### Service 管理\n- `GET /api/clusters/{cluster}/services`\
    \ - 所有命名空间 Service\n- `GET /api/clusters/{cluster}/namespaces/{ns}/services` - 命名空间 Service\n- `GET /api/clusters/{cluster}/namespaces/{ns}/services/{name}`\
    \ - Service 详情\n- `GET /api/clusters/{cluster}/namespaces/{ns}/services/{name}/endpoints` - Endpoints\n\n### 节点管理\n- `GET\
    \ /api/clusters/{cluster}/nodes` - 节点列表\n- `GET /api/clusters/{cluster}/nodes/{name}` - 节点详情\n- `GET /api/clusters/{cluster}/nodes/metrics`\
    \ - 节点指标\n\n### 事件与监控\n- `GET /api/clusters/{cluster}/events` - 集群事件\n- `GET /api/monitoring/{cluster}/status` - 监控状态\n\
    - `GET /api/monitoring/{cluster}/alerts` - 告警列表\n\n## \U0001F527 高级配置\n\n### 多集群配置\n\n```yaml\nkubernetes:\n  clusters:\n\
    \    - name: production\n      kubeconfig: ~/.kube/config\n      context: production\n    - name: staging\n      kubeconfig:\
    \ ~/.kube/config\n      context: staging\n    - name: eks-cluster\n      kubeconfig: ~/.kube/eks-config\n      context:\
    \ eks-cluster\n```\n\n### 事件过滤配置\n\n生产环境推荐配置：\n\n```yaml\nevents:\n  enabled: true\n  watch_types:\n    - Pod\n    - Deployment\n\
    \    - Node\n  namespaces:\n    - production\n    - default\n  event_types:\n    - Warning\n    - Error\n  reasons:\n\
    \    - BackOff\n    - Unhealthy\n    - Failed\n    - OOMKilled\n    - CrashLoopBackOff\n  exclude_reasons:\n    - Scheduled\n\
    \    - Pulling\n    - Pulled\n    - Created\n    - Started\n  min_severity: warning\n  rate_limit: 20\n  dedup_window:\
    \ 600\n  mute_duration: 10\n  channels:\n    - ops-alert\n    - dev-notify\n```\n\n### 混合模式\n\n同时启用事件监听和轮询监控：\n\n```yaml\n\
    # 实时事件监听（秒级推送）\nevents:\n  enabled: true\n  watch_types: [Pod, Deployment]\n  event_types: [Warning, Error]\n\n# 传统监控（分钟级汇总，用于图表）\n\
    monitoring:\n  enabled: true\n  interval: 60\n```\n\n## \U0001F433 Docker 部署\n\n```bash\n# 构建镜像\ndocker build -t klaw:latest\
    \ .\n\n# 运行容器\ndocker run -d \\\n  -p 8080:8080 \\\n  -p 8081:8081 \\\n  -v ~/.kube/config:/root/.kube/config \\\n  -v\
    \ $(pwd)/configs/config.yaml:/app/configs/config.yaml \\\n  klaw:latest\n```\n\n## \U0001F4C8 性能指标\n\n| 功能 | 轮询模式 | Watch\
    \ 模式 | 提升 |\n|------|---------|-----------|------|\n| 事件延迟 | 30-60 秒 | < 1 秒 | 60x |\n| API 调用 | 高频轮询 | 事件驱动 | 90%↓ |\n\
    | 资源占用 | CPU 密集 | 内存密集 | 更均衡 |\n| 连接稳定性 | 短连接 | 长连接 | 更稳定 |\n\n## \U0001F4DA 相关文档\n\n- [钉钉集成指南](./docs/dingtalk-integration.md)\
    \ - 完整的钉钉配置和使用说明\n- [Phase 1 实施总结](./docs/phase1-implementation-summary.md) - 钉钉双向通信实现\n- [Phase 2 实施总结](./docs/phase2-implementation-summary.md)\
    \ - 实时事件推送实现\n- [Service 管理实现](./docs/service-management-impl.md) - Service 功能详细设计\n\n## \U0001F91D 贡献\n\n欢迎提交 Issue 和\
    \ Pull Request！\n\n1. Fork 本仓库\n2. 创建特性分支 (`git checkout -b feature/AmazingFeature`)\n3. 提交更改 (`git commit -m 'Add some\
    \ AmazingFeature'`)\n4. 推送到分支 (`git push origin feature/AmazingFeature`)\n5. 开启 Pull Request\n\n## \U0001F4C4 许可证\n\n\
    MIT License\n\n## \U0001F517 链接\n\n- 项目主页：https://github.com/kudig-io/klaw\n- 问题反馈：https://github.com/kudig-io/klaw/issues\n"
