  readme_excerpt: '# Docsy - 语料库管理平台'
  readme_full: '# Docsy - 语料库管理平台


    Docsy 是一个**专业的 Markdown 语料库仓库管理平台**，面向拥有 10~20 个不同领域 LLM-Wiki 型语料库仓库的个人与团队：一个领域/赛道 = 一个仓库。平台提供跨库检索、健康检查、知识图谱、4K 加工流水线、仓库级
    AI 智能体与多 API Key Profile 管理，是统一的「语料库中枢」。


    > 旧版「阿里云工单运维文档管理平台」的全部功能已归档至 [`plugins/aliyun-ops-docs/`](plugins/aliyun-ops-docs/README.md)，未来以插件化方式针对特定赛道独立演进。


    ## 功能特性


    ### 仓库管理（本地后端驱动）

    - **仓库注册表**：注册任意本地 Markdown 目录为语料库仓库（`server/registry.ts`，持久化于 `.docsy/repos.json`），支持任意路径、自定义名称、去重校验

    - **仓库总览**：文件数 / 体积 / git 分支与未提交变更 / 健康评分卡片

    - **文件浏览**：文件树 + Markdown 渲染，支持行内编辑并写回磁盘（仅限 `.md/.markdown`，路径穿越防护）

    - **跨库检索**：BM25 全文检索（复用 `src/lib/corpus-search` 的 rankPages），跨全部仓库聚合，相关度排序

    - **健康检查**：复用 `corpus-lint` 的 generateHealthReport（断链 / 孤立页 / frontmatter 缺失 / 空页 / 重名），给出 0-100 评分与逐条问题清单

    - **知识图谱**：基于 `[[wikilink]]` 构建仓库级图谱，点击节点跳转文件


    ### 多 API Key Profile（灵活切换 Token Plan）

    - 多套 Profile：名称 / 模型 / API Key / 端点，一键新增、复制、删除、设为当前

    - 内置多服务商模型注册表（DeepSeek / 阿里云百炼 / Kimi / OpenAI），切换模型自动匹配官方兼容端点

    - 每套 Profile 支持独立「测试连接」；API Key 仅存浏览器本地（localStorage），后端不持有任何 Key


    ### 4K Wiki 处理流水线

    - K1 知识提炼 → K2 知识结构化 → K3 知识问答 → K4 知识场景化，链式增强

    - 产出 Obsidian 兼容（frontmatter + `[[wikilink]]`）Wiki 页面：断点续传、单阶段重试、逐页导出 / Vault 打包

    - **写回仓库**：将 4K 产物直接写入任意已注册语料库仓库（指定子目录），亦可存入本地 IndexedDB 加工产物库


    ### 仓库级 AI 智能体

    - 对话按仓库维度隔离（全局对话 / 各仓库智能体），自动注入当前浏览文件内容 + 4K 产物库 RAG-lite 上下文

    - 流式输出、对话历史检索、Markdown 导出；Cmd+K 全局命令面板支持仓库/文件搜索与跳转


    ## 技术栈


    - **前端**: React 18 + TypeScript (strict) + Vite + Tailwind CSS + Zustand（persist v2 迁移）

    - **后端**: Node.js + Express（`server/`，tsx watch 运行，端口 8787，Vite 代理 `/api`）

    - **Markdown**: react-markdown + remark-gfm；**图谱**: cytoscape / 自研力导向布局

    - **测试**: Vitest（前端 + `server/__tests__` 纯逻辑单测）


    ## 快速开始


    ```bash

    npm install        # 安装依赖

    npm run dev        # 开发模式：vite(5173) + api(8787) 并行启动

    npm run build      # 类型检查 + 生产构建

    npm run preview    # 预览生产构建

    ```


    ### 质量检查


    ```bash

    npm test               # 运行全部测试

    npm run lint           # ESLint 检查（src + server）

    npm run format         # Prettier 格式化

    ```


    ### AI 配置


    应用内「系统设置」→ API Key Profiles：新增 Profile 并填写 API Key 即可（多套 Token Plan 可建多个 Profile 灵活切换）。也可在 `.env.local` 提供默认 Key：


    ```bash

    VITE_DEEPSEEK_API_KEY=your-key-here

    ```


    > ⚠️ `VITE_` 前缀环境变量会打包进前端产物，请勿在公开部署中携带真实 Key；生产环境应使用服务端代理。


    ## 项目结构


    ```

    docsy/

    ├── server/                        # 本地语料库后端（Express, 8787）

    │   ├── index.ts                   # API 路由（repos/tree/file/git/search/lint）

    │   ├── registry.ts                # 仓库注册表（.docsy/repos.json）

    │   ├── fs-utils.ts                # 路径安全 / md 白名单 / 忽略目录

    │   └── __tests__/                 # 后端纯逻辑单测

    ├── src/

    │   ├── components/

    │   │   ├── Sidebar.tsx            # 平台导航 + 仓库列表（git 脏标记）

    │   │   ├── LibraryView.tsx        # 仓库总览 + 跨库搜索

    │   │   ├── RepoView.tsx           # 文件树 / 阅读 / 编辑 / 健康 / 图谱

    │   │   ├── FourKView.tsx          # 4K 处理流水线（含写回仓库）

    │   │   ├── CorpusView.tsx         # 加工产物库（IndexedDB）

    │   │   ├── AIChat.tsx             # 仓库级 AI 智能体

    │   │   ├── CommandPalette.tsx     # Cmd+K 全局搜索

    │   │   ├── Settings.tsx           # 多 API Key Profile 管理

    │   │   └── ...（MarkdownContent / KnowledgeGraph / ErrorBoundary 等）

    │   ├── lib/

    │   │   ├── repo-api.ts            # 前端调用后端唯一入口（fetch 封装）

    │   │   ├── ai-service.ts          # LLM 服务（OpenAI 兼容、SSE 流式）

    │   │   ├── corpus-search.ts       # BM25 检索（server 复用）

    │   │   ├── corpus-lint.ts         # 健康检查（server 复用）

    │   │   ├── four-k-service.ts      # 4K 流水线核心

    │   │   └── useHashRouter.ts       # Hash 路由（#/library|repo|corpus|processing|settings）

    │   ├── store/index.ts             # Zustand store（含 persist v1→v2 迁移）

    │   └── App.tsx / main.tsx

    ├── plugins/aliyun-ops-docs/       # 归档：阿里云工单运维文档平台（插件化演进）

    ├── docs/                          # 项目文档与评估记录

    └── vite.config.ts / vitest.config.ts / eslint.config.js

    ```


    ## 路由


    | Hash | 视图 |

    |---|---|

    | `#/library` | 仓库总览 |

    | `#/repo/{repoId}/{filePath}` | 仓库浏览（filePath 为 encodeURIComponent 的相对路径） |

    | `#/corpus` | 加工产物库 |

    | `#/processing` | 4K 处理 |

    | `#/settings` | 系统设置 |


    ## 使用指南


    1. **注册仓库**：侧边栏「+」或总览页「添加仓库」，输入本地 Markdown 语料库绝对路径

    2. **跨库检索**：总览页顶部搜索框，输入关键词实时检索全部仓库

    3. **浏览与编辑**：点击仓库 → 文件树选择文件；「编辑」支持直接修改并保存回磁盘

    4. **健康与图谱**：仓库概览页「健康检查」「知识图谱」分析整个仓库

    5. **AI 问答**：右侧面板自动切换为当前仓库的智能体，可引用当前文件内容

    6. **4K 处理**：粘贴文档运行 K1-K4 流水线，「写回仓库」将产物落到指定语料库


    ## 许可证


    MIT License

    '
