  readme_excerpt: '# Cinelume Database — 电影专业知识库'
  readme_full: '# Cinelume Database — 电影专业知识库


    > **A comprehensive film knowledge database for cinema enthusiasts.**

    > 基于电影学院专业知识体系构建的系统化学习资源库。


    ---


    ## 语言说明 | Language Notes


    | 项目 | 语言 | 说明 |

    |------|------|------|

    | 📁 文件夹名称 | **English** | 英文命名，便于跨平台兼容 |

    | 📄 文件名称 | **English** | 英文命名，统一编码规范 |

    | 📝 文档内容 | **中文** | 全部正文以中文撰写 |

    | 🔤 专业术语 | **中英对照** | 首次出现的专业术语标注英文，格式：`中文术语（English Term）` |


    **术语对照示例：**

    - 蒙太奇（Montage）、长镜头（Long Take）、场面调度（Mise-en-scène）

    - 景别（Shot Size）、特写（Close-Up）、连续性剪辑（Continuity Editing）


    ---


    ## 项目结构 | Project Structure


    ```

    cinelume-database/

    ├── README.md                              # 项目导航（本文件）

    ├── DIRECTORY-MAP.md                       # 完整目录地图（含 13-20 模块详解）

    ├── 00-film-fundamentals/                  # 电影基础 Film Fundamentals

    ├── 01-directing/                          # 导演 Directing

    ├── 02-screenwriting/                      # 编剧 Screenwriting

    ├── 03-cinematography/                     # 摄影 Cinematography

    ├── 04-editing/                            # 剪辑 Editing

    ├── 05-sound-design/                       # 声音设计 Sound Design

    ├── 06-production-design/                  # 美术设计 Production Design

    ├── 07-acting/                             # 表演 Acting

    ├── 08-producing/                          # 制片管理 Producing

    ├── 09-visual-effects/                     # 后期特效 Visual Effects

    ├── 10-film-criticism/                     # 影评与分析 Film Criticism

    ├── 11-film-list/                          # 电影电视信息卡 Film & TV Cards

    ├── 12-appendix/                           # 附录 Appendix

    ├── 13-video-essays/                       # 视频论文 Video Essays

    ├── 14-special-topics/                     # 专题研究 Special Topics（逐季逐集剧评）

    ├── 15-film-music/                         # 电影音乐 Film Music

    ├── 16-animation/                          # 动画 Animation

    ├── 17-documentary/                        # 纪录片 Documentary

    ├── 18-world-cinema/                       # 世界电影 World Cinema

    ├── 19-distribution/                       # 发行与放映 Distribution

    └── 20-film-theory/                        # 电影理论 Film Theory

    ```


    > 13-20 模块的完整文件清单与学习路径请见 [`DIRECTORY-MAP.md`](DIRECTORY-MAP.md)。


    ---


    ## 内容导航 | Content Guide


    ### 00-film-fundamentals/ — 电影基础


    > 电影艺术的通识基础，适合所有学习者作为起点。


    | 文件 | 内容 | 术语语言 |

    |------|------|----------|

    | `01-film-history.md` | 电影史概论：从默片到数字时代 | 中英对照 |

    | `02-film-language.md` | 电影语言基础：镜头、构图、蒙太奇 | 中英对照 |

    | `03-genres-and-movements.md` | 电影类型与流派 | 中英对照 |

    | `04-film-aesthetics.md` | 电影美学概论 | 中英对照 |

    | `05-film-industry.md` | 电影产业概览 | 中英对照 |


    ### 01-directing/ — 导演艺术 (Directing)


    > 导演的创作方法、视听语言控制与艺术风格建立。


    | 文件 | 内容 |

    |------|------|

    | `01-fundamentals.md` | 导演职能、创作流程、必备素养 |

    | `02-advanced-theory.md` | 场面调度（Mise-en-scène）、视听思维、叙事策略 |

    | `03-practical-skills.md` | 演员指导、片场管理、视觉预演 |

    | `04-industry-standards.md` | 导演合同、工会规范、行业惯例 |

    | `05-case-studies.md` | 经典导演案例深度分析 |

    | `06-classic-works.md` | 大师作品解读 |

    | `07-contemporary-trends.md` | 虚拟制作、流媒体、AI时代的导演 |

    | `08-television-directing.md` | **电视剧导演**：节目统筹制度、多集轮换、剧集类型 |


    ### 02-screenwriting/ — 编剧 (Screenwriting)


    > 剧本格式、故事结构、角色塑造与对白写作。


    | 文件 | 内容 |

    |------|------|

    | `01-fundamentals.md` | 剧本格式、故事要素、角色创作 |

    | `02-advanced-theory.md` | 三幕结构（Three-Act Structure）、英雄之旅、非线性叙事 |

    | `03-practical-skills.md` | 对白技巧、改编方法、类型编剧 |

    | `04-industry-standards.md` | 编剧合同、版权、行业规范 |

    | `05-case-studies.md` | 经典剧本案例分析 |

    | `06-classic-works.md` | 里程碑剧本解读 |

    | `07-contemporary-trends.md` | IP改编、互动叙事、AI辅助写作 |

    | `08-television-writing.md` | **电视剧编剧**：编剧室、分集叙事、长期角色发展 |


    ### 03-cinematography/ — 摄影 (Cinematography)


    > 曝光、镜头、构图、灯光、色彩与摄影机运动。


    | 文件 | 内容 |

    |------|------|

    | `01-fundamentals.md` | 曝光三角、镜头系统、摄影机运动 |

    | `02-advanced-theory.md` | 色彩理论、光影设计、视觉叙事 |

    | `03-practical-skills.md` | 布光方案、运动设计、特殊拍摄 |

    | `04-industry-standards.md` | 数字标准、HDR、色彩空间 |

    | `05-case-studies.md` | 经典摄影案例分析 |

    | `06-classic-works.md` | 摄影大师作品解读 |

    | `07-contemporary-trends.md` | 虚拟摄影、LED Volume、AI调色 |

    | `08-television-cinematography.md` | **电视剧摄影**：多机位/单机位、节目风格、HDR |


    ### 04-editing/ — 剪辑 (Editing)


    > 剪辑原理、节奏控制、蒙太奇（Montage）与非线性编辑。


    | 文件 | 内容 |

    |------|------|

    | `01-fundamentals.md` | 剪辑核心概念、基本原则、工作流程 |

    | `02-advanced-theory.md` | 蒙太奇理论、节奏与情感、认知剪辑 |

    | `03-practical-skills.md` | NLE操作、转场技巧、声画配合 |

    | `04-industry-standards.md` | 交付规格、工作流标准、版本管理 |

    | `05-case-studies.md` | 经典剪辑案例分析 |

    | `06-classic-works.md` | 剪辑大师作品解读 |

    | `07-contemporary-trends.md` | AI剪辑、实时编辑、远程协作 |

    | `08-television-editing.md` | **电视剧剪辑**：叙事线交织、幕间节奏、类型剪辑 |


    ### 05-sound-design/ — 声音设计 (Sound Design)


    > 录音、拟音（Foley）、混音（Mixing）、配乐与空间音频。


    | 文件 | 内容 |

    |------|------|

    | `01-fundamentals.md` | 声音分类、录音基础、声画关系 |

    | `02-advanced-theory.md` | 声音叙事、空间音频、心理声学 |

    | `03-practical-skills.md` | 拟音技术、对白编辑、混音实践 |

    | `04-industry-standards.md` | 杜比全景声（Dolby Atmos）、交付规范 |

    | `05-case-studies.md` | 经典声音设计案例 |

    | `06-classic-works.md` | 声音设计大师作品解读 |

    | `07-contemporary-trends.md` | 空间音频、AI音频、沉浸式声音 |

    | `08-television-sound.md` | **电视剧声音**：对白优先、配乐产量、多平台混音 |


    ### 06-production-design/ — 美术设计 (Production Design)


    > 场景设计、道具（Props）、服装（Costume）、色彩设计。


    | 文件 | 内容 |

    |------|------|

    | `01-fundamentals.md` | 美术部门职能、场景类型、色彩理论 |

    | `02-advanced-theory.md` | 视觉叙事、空间心理学、风格建立 |

    | `03-practical-skills.md` | 搭景、道具制作、服装设计实践 |

    | `04-industry-standards.md` | 预算管理、安全规范、行业标准 |

    | `05-case-studies.md` | 经典美术设计案例 |

    | `06-classic-works.md` | 美术设计大师作品解读 |

    | `07-contemporary-trends.md` | 虚拟美术、3D打印、可持续设计 |

    | `08-television-design.md` | **电视剧美术**：常驻场景、世界构建、虚拟制作 |


    ### 07-acting/ — 表演艺术 (Acting)


    > 表演体系、角色分析、情感表达与镜头前表演。


    | 文件 | 内容 |

    |------|------|

    | `01-fundamentals.md` | 表演类型、主要体系、角色创造基础 |

    | `02-advanced-theory.md` | 方法派（Method Acting）、迈斯纳技巧、间离效果 |

    | `03-practical-skills.md` | 台词处理、情感调动、形体训练 |

    | `04-industry-standards.md` | 演员工会、试镜流程、合同规范 |

    | `05-case-studies.md` | 经典表演案例分析 |

    | `06-classic-works.md` | 表演大师作品解读 |

    | `07-contemporary-trends.md` | 动作捕捉（Motion Capture）、虚拟角色、远程表演 |

    | `08-television-acting.md` | **电视剧表演**：长期角色塑造、多机位技巧、试镜选角 |


    ### 08-producing/ — 制片管理 (Producing)


    > 项目开发（Development）、预算管理、拍摄计划与发行策略。


    | 文件 | 内容 |

    |------|------|

    | `01-fundamentals.md` | 制片人角色、工作流程、预算体系 |

    | `02-advanced-theory.md` | 融资策略、风险评估、商业模式 |

    | `03-practical-skills.md` | 日程编排、通告管理、突发应对 |

    | `04-industry-standards.md` | 合同法务、保险、版权规范 |

    | `05-case-studies.md` | 经典制片案例分析 |

    | `06-classic-works.md` | 制片传奇项目解读 |

    | `07-contemporary-trends.md` | 流媒体制片、国际联合制作、AI辅助管理 |

    | `08-television-producing.md` | **电视剧制片**：开发流程、预算管理、发行模式 |

