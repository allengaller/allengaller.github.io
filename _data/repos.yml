    \ Cache 压缩技术\n- `optimization/gguf-quantization`：GGUF 量化与 llama.cpp 部署\n- `evaluation/bbh-evaluation`：BBH 复杂推理评测\n- `application/text2sql`：自然语言转\
    \ SQL\n\n### 剩余缺口清单\n\n- **架构**：~~KV 压缩~~ ✅；专家路由可视化、Mamba/RetNet 实战\n- **训练**：~~数据清洗 pipeline~~ ✅；Dora/RS-LoRA、模型 soups\n\
