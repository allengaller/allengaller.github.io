  description: '# 万死志 Thanatopedia'
  readme_excerpt: '# 万死志 Thanatopedia'
  readme_full: '# 万死志 Thanatopedia


    > Thanatos + Encyclopedia — 一万种死亡方式的结构化诗学数据库


    ---


    ## 疗愈声明


    本项目不是死亡教程，不是恐怖读物，不是对生命的轻视。


    **万死志**是一个死亡冥想工具：通过穷举人类可能面临的终结方式，以客观、诗性、去恐怖化的语言呈现，将死亡从「不可言说的恐惧」转化为「可凝视的风景」——从而唤起对当下每一刻呼吸的深切觉察。


    死亡有一万种形状，呼吸只此一种——此刻这一种。


    ---


    ## 项目结构


    ```

    thanatopedia/

    ├── README.md                 # 项目总览与疗愈声明

    ├── 0001-1000/               # 千位分卷

    │   ├── 0001.md

    │   └── ...

    ├── 1001-2000/

    ├── ...

    ├── 9001-10000/

    ├── taxonomy.yml             # 全局分类与标签字典

    └── template.md              # 单条记录模板

    ```


    ## 内容原则


    1. **去恐怖化** — 禁用内脏描写、血腥细节，以物理和生理语言替代

    2. **去煽情化** — 禁用价值判断词，保持客观中立

    3. **诗意准确** — 文学性与科学性并存

    4. **冥想锚点** — 每条必有「冥想视角」，将终结转化为觉察

    5. **互文网络** — 条目间相互链接，形成知识图谱


    ## 贡献


    1. 在 Issue 中申请空闲编号段

    2. 复制 `template.md` 至对应分卷目录

    3. 按规范填写 Frontmatter 与正文

    4. 提交 PR，标题格式：`[条目] 0427 溺于一杯温水`


    ## 许可


    CC BY-NC-SA 4.0

    '
