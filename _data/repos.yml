  readme_full: "# knm — Kubernetes Network Master CLI\n\n`knm` is a single binary for **debugging, observing, securing, and\
    \ migrating**\nKubernetes networking. It is also installable as the kubectl plugin\n`kubectl-net`, so `kubectl net <subcommand>`\
    \ works.\n\n> Kubernetes networking is the classic \"black box\": to debug one broken\n> Service you juggle CNI state,\
    \ iptables/IPVS, DNS, NetworkPolicy, Endpoints,\n> and node routes by hand. `knm` glues those layers together in one tool.\n\
    \nThis is an **early release**: every command is wired up and produces real,\nuseful output, but the deep features (active\
    \ probing, eBPF capture, traffic\nreplay) are explicitly marked as roadmap items. See each command's\n`ℹ not yet implemented:`\
    \ note and [`docs/`](docs/).\n\n---\n\n## Install\n\n### From source\n\n```bash\ngit clone https://github.com/kudig-io/kubernetes-network-master\n\
    cd kubernetes-network-master\nmake build          # → ./bin/knm\n\n# install to $GOPATH/bin AND create the kubectl-net\
    \ plugin alias:\nmake install\n```\n\n### Use as a kubectl plugin\n\n`make install` places two binaries on your `PATH`:\n\
    \n```bash\nknm trace pod/web svc/api                 # standalone\nkubectl net trace pod/web svc/api         # same binary,\
    \ plugin form\n```\n\nBoth share one codebase; the binary detects when it's invoked as\n`kubectl-net` and strips kubectl's\
    \ `net` argument automatically.\n\n### Verify\n\n```bash\nknm version\nknm --help\n```\n\n---\n\n## Command reference\n\
    \nAll commands accept the standard kubectl flags (`--kubeconfig`, `--context`,\n`-n`, `-A`, `--as`, …) and a unified `-o\
    \ table|wide|json|yaml|dot|mermaid`.\n\n| Command | Category | What it does | Status |\n|---|---|---|---|\n| `knm trace\
    \ SRC DST` | Debug/Observability | Walk DNS→NetworkPolicy→Service→Endpoints→TCP→CNI→Pod, mark the break | ✅ + active probe\
    \ |\n| `knm policy check POD` | Debug/Security | List policies selecting a Pod + isolation state | ✅ |\n| `knm policy\
    \ simulate` | Security | Pure-static allow/deny verdict (no cluster needed) | ✅ |\n| `knm policy matrix` | Security |\
    \ Pod×Pod ingress allow matrix | ✅ |\n| `knm policy generate` | Security | default-deny baseline / least-privilege from\
    \ flows | \U0001F7E1 eBPF→fallback |\n| `knm observe flows` / `events` | Observability | eBPF live flows/events (CNI-agnostic)\
    \ | \U0001F7E1 eBPF→fallback |\n| `knm gateway migrate` | Gateway API | Ingress → Gateway + HTTPRoute + diff report |\
    \ ✅ |\n| `knm gateway lint` | Gateway API | Catch route conflicts, dangling refs, missing TLS | ✅ |\n| `knm gateway replay`\
    \ | Gateway API | Replay recorded traffic against a new config | \U0001F532 roadmap |\n| `knm cni bench` | CNI | Detect\
    \ CNI + standardized benchmark method | ✅ method |\n| `knm cni fault` | CNI | List chaos fault-injection scenarios | ✅\
    \ catalog |\n| `knm cni drift` | CNI | Expected-vs-actual node network state baseline | ✅ baseline |\n| `knm security\
    \ baseline` | Security | Per-Pod behavior baseline + deviation alerts | \U0001F7E1 eBPF→fallback |\n| `knm security dns`\
    \ | Security | CoreDNS stats / DNS anomaly first-pass | \U0001F7E1 |\n| `knm mc topo` | Multi-cluster | Cross-context\
    \ service topology | ✅ |\n| `knm mc policy-sync` | Multi-cluster | Dry-run diff a NetworkPolicy across contexts | ✅ |\n\
    | `knm mc connectivity` | Multi-cluster | Hybrid-cloud MTU/route/connectivity self-check | ✅ baseline |\n| `knm gpu rdma`\
    \ | AI/GPU | GPU nodes, Multus/SR-IOV, RDMA readiness | ✅ detect |\n| `knm gpu analyze` | AI/GPU | Locate slow NCCL/AllReduce\
    \ links | \U0001F7E1 eBPF→fallback |\n| `knm gpu qos` | AI/GPU | RDMA-vs-HTTP priority + QoS manager | \U0001F532 roadmap\
    \ |\n| `knm sandbox` | DevEx | kind/k3d multi-CNI sandbox + tutorial | ✅ detect |\n| `knm depgraph` | DevEx | Service+EndpointSlice+NetworkPolicy\
    \ → mermaid/dot | ✅ |\n| `knm version` / `completion` | — | Build info / shell completion | ✅ |\n\nLegend: ✅ implemented\
    \ (shallow) · \U0001F7E1 implemented with eBPF degrade path · \U0001F532 roadmap\n\n---\n\n## Examples\n\n### Trace a\
    \ broken connection\n\n```bash\n$ knm trace pod/debug svc/api\ntrace pod/debug → svc/api\n+----------------+--------+----------------------------------------------------------+\n\
    | STAGE          | STATUS | DETAIL                                                   |\n+----------------+--------+----------------------------------------------------------+\n\
    | Source Pod     | OK     | default/debug ip=10.244.1.5 node=node-1                  |\n| DNS            | OK     | kube-dns\
    \ clusterIP=10.96.0.10 — resolved \"api.default…\"  |\n|                |        |   → 10.96.7.7                     \
    \                       |\n| NetworkPolicy  | OK     | no NetworkPolicies in default → default allow            |\n| Service\
    \        | OK     | default/api type=ClusterIP clusterIP=10.96.7.7           |\n| Endpoints      | FAIL   | 0 ready backing\
    \ pods — Service has no usable Endpoints   |\n| ...            |        |                                            \
    \              |\n+----------------+--------+----------------------------------------------------------+\n✗ path is broken\
    \ at the first FAIL hop above\nℹ kube-proxy rule inspection, CNI datapath probe, path-MTU discovery are roadmap items\n\
    ```\n\nActive probes (DNS resolve, TCP connect) run inside the source Pod and auto-\ndetect available tools (`getent`/`nslookup`;\
    \ `nc`/`bash /dev/tcp`/`wget`/`curl`).\nThey degrade to SKIP/WARN — never crash — under `--probe=api` or without\n`pods/exec`\
    \ RBAC. Render the chain as a path graph with `-o mermaid`/`-o dot`.\nSee [`docs/trace.md`](docs/trace.md).\n\n### Simulate\
    \ a NetworkPolicy (CI-friendly, no cluster)\n\n```bash\n$ knm policy simulate --policy netpol.yaml --src pod/app --dst\
    \ pod/db --port 5432\n+---------+------------------+-------------------------------------------------------+\n| ALLOWED\
    \ | INGRESS-ISOLATED | REASON                                                |\n+---------+------------------+-------------------------------------------------------+\n\
    | yes     | yes              | allowed by default/db-allow-from-app via ingress peer |\n+---------+------------------+-------------------------------------------------------+\n\
    ```\n\nEndpoints auto-seed `app=<name>`/`pod=<name>` labels; override with\n`--src-labels app=web,team=payments --dst-labels\
    \ app=db`.\n\n### Migrate Ingress → Gateway API\n\n```bash\n$ knm gateway migrate -f ingress.yaml\n# prints the generated\
    \ Gateway + HTTPRoute YAML, then a migration diff table.\n```\n\n### Render a service dependency graph\n\n```bash\nknm\
    \ depgraph -o mermaid        # paste into any mermaid renderer\nknm depgraph -A -o dot | dot -Tsvg > deps.svg\n```\n\n\
    ---\n\n## Output formats\n\nEvery command honors `-o`:\n\n- `table` (default) — human-friendly\n- `wide` — extra detail\
    \ columns\n- `json` / `yaml` — structured, CI-friendly\n- `dot` / `mermaid` — for graph-producing commands (`depgraph`,\
    \ `mc topo`)\n\n---\n\n## eBPF features & graceful degrade\n\nSeveral commands (`observe`, `security baseline`, `policy\
    \ generate`,\n`gpu analyze`) ultimately want eBPF for zero-instrument kernel visibility.\nThis build does not yet ship\
    \ the libbpf backend, and on non-Linux hosts it\ncan't. Rather than crash, those commands:\n\n1. probe `ebpf.Availability()`,\n\
    2. print a clear reason (`eBPF requires a Linux kernel; current OS is darwin`),\n3. fall back to an API-level implementation\
    \ (e.g. a static service map).\n\nSee [`docs/ebpf.md`](docs/ebpf.md) for the roadmap to a real\n`libbpf-go` / Aya backend\
    \ behind the same degrade contract.\n\n---\n\n## Project layout\n\n```\ncmd/knm/              # entry point (kubectl-net\
    \ alias detection)\ninternal/\n  cli/                # cobra command tree (thin layer over logic)\n  kube/           \
    \    # kubectl-style flag factory + clientset cache\n  ebpf/               # availability probe + degrade messaging\n\
    \  output/             # table/json/yaml/dot/mermaid renderer\n  version/            # build-time metadata\n  trace/ policy/\
    \ gateway/ cni/ observe/ security/ mc/ gpu/ sandbox/ depgraph/\n                      # pure domain logic (unit-tested,\
    \ cluster-free where possible)\ndocs/                 # per-feature design notes\n```\n\n## Development\n\n```bash\nmake\
    \ test       # unit tests\nmake vet        # go vet\nmake lint       # vet + gofmt check\nmake run ARGS=\"policy simulate\
    \ --policy x.yaml ...\"\n```\n\n## License\n\nApache 2.0 — see [LICENSE](LICENSE).\n"
