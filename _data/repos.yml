  readme_full: '# 艺术学院专业文档数据库


    ## 项目说明


    本项目是一个以艺术学院专业设置为框架的知识库，采用 Markdown 格式文档，文件夹名称为英文，文档内容使用中文。课程体系参照世界顶级艺术院校（RISD、Yale、RCA、UAL、Slade、Parsons、CalArts、MIT Media
    Lab、Juilliard、Tisch 等）设计。


    ## 文档标准


    每个专业文件夹包含以下 5 个标准文档，以及 1 个专业基础文档：


    **标准文档**：

    1. **专业介绍.md** — 专业概述、培养目标、核心课程、就业方向

    2. **课程体系与学年规划.md** — 学年课程安排表格、学分结构、Wintersession 短学期

    3. **核心理论与批判性思维.md** — 理论模块、必读书目、写作与批评训练

    4. **实践项目与工作室.md** — 核心实践项目、Critique 文化、技术工坊、展览实践

    5. **毕业要求与职业发展.md** — 学位项目标准、评分维度、职业路径、国际赛事、作品集标准


    **专业基础文档**（按大类命名）：

    - 美术学类：**核心技法.md** — 各媒介核心技法与材料工艺

    - 设计学类：**设计基础理论.md** — 设计思维、方法、工具链

    - 音乐与舞蹈学类：**核心技法与表演训练.md** — 演奏/演唱/编舞/作曲技法

    - 戏剧与影视学类：**核心技法与创作训练.md** — 表演/导演/拍摄/编剧技法

    - 艺术学理论类：**研究方法与学术写作.md** — 文献、田野、写作规范

    - 新媒体艺术类：**技术基础与工具链.md** — 软件、引擎、硬件平台

    - 艺术教育学类：**教学方法与课程设计.md** — 教案、评价、课堂管理

    - 策展与博物馆类：**策展方法与展览实务.md** — 空间规划、藏品管理、公教


    **基础学部（00-FoundationStudies）文档**：

    基础学部作为预科/大一年级通识教育，第 6 个文档按具体方向命名：

    - 素描基础：**核心训练方法.md**

    - 设计基础：**构成与视觉语言.md**

    - 空间动态：**空间建构与模型.md**

    - 批判理论导论：**批判性阅读与写作.md**

    - 艺术史概论：**图像分析与研究方法.md**


    ---


