  description: '# 小观 Xiao Guan'
  readme_excerpt: '# 小观 Xiao Guan'
  readme_full: "# 小观 Xiao Guan\n\n[![PlatformIO](https://img.shields.io/badge/PlatformIO-6.x-orange?logo=data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyNCIgaGVpZ2h0PSIyNCIgdmlld0JveD0iMCAwIDI0IDI0Ij48cGF0aCBmaWxsPSIjZmZmIiBkPSJNMTIgMkwyIDIydjAtLjVoMjBWMjJMMTIyem0wIDNsNy41IDEzSDQuNUwxMiA1eiIvPjwvc3ZnPg==)](https://platformio.org/)\n\
    [![Python](https://img.shields.io/badge/Python-3.8%2B-blue?logo=python&logoColor=white)](https://python.org/)\n[![ESP32](https://img.shields.io/badge/ESP32-S3%20%7C%20PICO--D4-green)](https://www.espressif.com/)\n\
    [![License: MIT](https://img.shields.io/badge/License-MIT-yellow.svg)](LICENSE)\n\n> **冥想感知开源硬件** — 用呼吸和定力，观照当下\n\n小观是一款开源冥想辅助设备。通过麦克风感知呼吸频率与深度，通过陀螺仪感知身体的晃动与定力。支持三种\
    \ M5Stack 硬件形态；无硬件时，可作为纯软件桌面冥想陪伴程序运行。\n\n---\n\n## 特性\n\n- **呼吸检测** — 实时检测呼吸频率（6-30 bpm）和深度（浅 / 中 / 深），基于 IIR 带通滤波 + 峰值检测算法\n\
    - **定力评估** — 6 轴 IMU 加速度 → 滑动窗口方差 → 指数衰减映射 → 0-100 分稳定性评分\n- **冥想引导** — 调息(2min) → 入定 → 结束，三阶段自动流转，颂钵音效提示\n- **WiFi 实时看板**\
    \ — 设备创建 WiFi 热点，手机浏览器即可查看呼吸曲线、定力趋势、历史记录\n- **数据持久化** — SD 卡 / NVS 存储冥想记录，重启后自动恢复\n- **纯软件模式** — 无硬件时用电脑麦克风 + 摄像头运行 Python\
    \ 桌面陪伴程序\n- **功耗优化** — 4 级功耗管理（全功能 → 暗屏 → 低功耗 → light sleep），Cardputer Adv 续航可达 13h+\n\n## 支持的硬件\n\n| 硬件 | 芯片 | 麦克风 |\
    \ IMU | 电池 | 定位 |\n|------|------|--------|-----|------|------|\n| **M5Stack StickS3** | ESP32-S3 (8MB+8MB PSRAM) | ES8311\
    \ I2S | BMI270 | 250mAh | 音频质量最好，首选开发 |\n| **M5Stack StickC Plus** | ESP32-PICO-D4 (4MB) | SPM1423 PDM | MPU6886 | 120mAh\
    \ | 最小巧 (16.9g)，适合夹口罩 |\n| **M5Stack Cardputer Adv** | ESP32-S3FN8 (8MB) | ES8311 I2S | BMI270 | 1750mAh | 56 键键盘 + SD\
    \ 卡 + 3.5mm，续航最长 |\n\n## 架构概览\n\n```mermaid\ngraph TB\n    subgraph 共享算法层 firmware/shared\n        BD[BreathDetector]\n\
    \        MA[MotionAnalyzer]\n        MS[MeditationSession]\n        PM[PowerManager]\n        UI[UIRenderer]\n       \
    \ WS[WifiServer]\n        SE[SoundEffects]\n    end\n\n    subgraph 设备固件\n        S3[StickS3 main.cpp]\n        SC[StickC\
    \ Plus main.cpp]\n        CA[Cardputer Adv main.cpp]\n    end\n\n    subgraph 纯软件版 companion\n        CP[companion.py]\n\
    \        VB[validate_breath.py]\n    end\n\n    S3 --> BD & MA & MS & PM & UI & WS & SE\n    SC --> BD & MA & MS & PM\
    \ & UI & WS\n    CA --> BD & MA & MS & PM & UI & WS & SE\n\n    CP --> VB\n```\n\n**固件共享算法层**以平台无关 C++ 实现，通过条件编译宏 (`DEVICE_STICK_S3`\
    \ / `DEVICE_STICK_C_PLUS` / `DEVICE_CARDPUTER_ADV`) 区分设备差异。\n\n| 模块 | 职责 | 核心接口 |\n|------|------|----------|\n| `BreathDetector`\
    \ | 音频 → 呼吸频率 + 深度 | `processAudioFrame()`, `getResult()` |\n| `MotionAnalyzer` | IMU → 定力评分 (0-100) | `update()`, `getResult()`\
    \ |\n| `MeditationSession` | 会话计时 / 阶段 / 统计 | `start()`, `update()`, `getStats()` |\n| `PowerManager` | 电池 / 亮度 / light\
    \ sleep | `recommendMode()`, `applyMode()` |\n| `UIRenderer` | 4 界面渲染 | `drawMenu()`, `drawMeditationScreen()` |\n| `WifiServer`\
    \ | WiFi AP + Web 看板 + 历史 | `begin()`, `updateLiveData()` |\n| `SoundEffects` | PCM 颂钵 / 雨声合成 | `synthSingingBowl()`,\
    \ `synthRain()` |\n\n## 快速开始\n\n### 前置条件\n\n- [VS Code](https://code.visualstudio.com/) + [PlatformIO IDE](https://platformio.org/install/ide?install=vscode)\
    \ 插件\n- USB-C 数据线（非纯充电线）\n- Python 3.8+（仅纯软件版需要）\n\n### 固件开发\n\n```bash\n# 1. 克隆仓库\ngit clone https://github.com/peace-lab-global/xiao-guan.git\n\
    cd xiao-guan\n\n# 2. 用 VS Code + PlatformIO 打开设备目录\n#    File → Open Folder → 选择 firmware/stickS3/（推荐首选）\n#    等待 PlatformIO\
    \ 下载工具链和依赖库（首次约 3-5 分钟）\n\n# 3. 连接设备，编译 + 烧录\ncd firmware/stickS3\npio run                  # 编译\npio run -t upload  \
    \      # 烧录到设备\npio device monitor --baud 115200   # 串口监控\n```\n\n### 纯软件模式（无需硬件）\n\n```bash\ncd companion\npython3 -m\
    \ venv .venv && source .venv/bin/activate\npip install -r requirements.txt\n\npython3 companion.py               # 启动冥想陪伴\n\
    python3 validate_breath.py --simulate  # 算法验证（7/8 PASS）\n```\n\n> 详细步骤请参阅 [从零部署与调试指南](docs/getting-started.md)\n\n## 项目结构\n\
    \n```\nxiao-guan/\n├── firmware/\n│   ├── shared/              # 共享 C++ 算法层（7 模块，平台无关）\n│   │   ├── breath_detector.h/cpp\
    \     # 呼吸检测\n│   │   ├── motion_analyzer.h/cpp     # 定力评估\n│   │   ├── meditation_session.h/cpp  # 会话管理\n│   │   ├──\
    \ power_manager.h/cpp       # 功耗管理\n│   │   ├── ui_renderer.h/cpp         # UI 渲染\n│   │   ├── wifi_server.h/cpp     \
    \    # WiFi Web 看板\n│   │   └── sound_effects.h           # 音效合成\n│   ├── stickS3/             # StickS3 固件\n│   ├── stickC_plus/\
    \         # StickC Plus 固件\n│   └── cardputer_adv/       # Cardputer Adv 固件\n├── companion/\n│   ├── companion.py    \
    \     # 桌面冥想陪伴（麦克风 + 摄像头 + TUI）\n│   ├── validate_breath.py   # 呼吸算法 Python 验证\n│   └── requirements.txt\n├── docs/\n\
    │   ├── project-design.md           # 架构设计与硬件规格\n│   ├── getting-started.md          # 部署与调试指南\n│   ├── implementation-status.md\
    \    # 实现进度追踪\n│   └── M5-hardware-official-document/  # M5Stack 官方硬件参考\n└── hardware/                # 3D 打印外壳（规划中）\n\
    ```\n\n## 技术栈\n\n| 层级 | 技术 |\n|------|------|\n| **固件** | C++17 / Arduino 框架 / PlatformIO |\n| **音频算法** | 分帧 RMS → IIR\
    \ Butterworth 带通 (0.1-0.5 Hz, 4 阶 SOS) → 峰值检测 |\n| **运动算法** | 三轴加速度方差 → 指数衰减映射 |\n| **桌面软件** | Python 3.8+ / NumPy / SciPy\
    \ / sounddevice / OpenCV (可选) |\n| **通信** | WiFi AP (ESP32 SoftAP) / SD 卡 / NVS 持久化 |\n| **UI** | M5GFX LCD 渲染 (固件) /\
    \ ANSI 彩色 TUI (桌面) |\n\n## WiFi 看板\n\n设备启动后自动创建 WiFi 热点：\n\n| 参数 | 值 |\n|------|-----|\n| SSID | `XiaoGuan` |\n| 密码 |\
    \ `meditate` |\n| 看板地址 | `http://192.168.4.1` |\n\n手机连接 WiFi 后浏览器访问即可看到：实时呼吸曲线、定力趋势图、冥想会话信息、历史记录。\n\n## 文档\n\n| 文档 | 内容\
    \ |\n|------|------|\n| [用户手册](docs/user-manual.md) | 面向终端用户的使用指南：操作、WiFi 看板、桌面陪伴、FAQ |\n| [从零部署指南](docs/getting-started.md)\
    \ | 环境搭建、三款设备烧录、传感器调试、FAQ |\n| [架构设计文档](docs/project-design.md) | 完整 PinMap、算法流程、PlatformIO 配置、功耗数据 |\n| [实现进度追踪](docs/implementation-status.md)\
    \ | 模块完成度、已知问题、后续路线 |\n| [M5Stack 官方硬件参考](docs/M5-hardware-official-document/) | STL 模型、KiCad 封装、原理图 |\n\n## 开发路线\n\n\
    ```\n环境搭建 → 传感器驱动 → 呼吸算法 + 定力算法 (并行)\n  → 冥想会话 → 三硬件适配 → 数据记录\n    → 纯软件版 (可独立并行) → 功耗优化 → 3D 外壳\n```\n\n**建议从 StickS3\
    \ 开始**（音频芯片最好、内存最大），算法稳定后再移植到其他设备。\n\n## 贡献指南\n\n欢迎贡献！请按以下流程操作：\n\n1. **Fork** 本仓库\n2. 创建特性分支：`git checkout -b feature/your-feature`\n\
    3. 编写/修改代码并确保编译通过：`pio run`\n4. 提交变更：`git commit -m \"feat: add your feature\"`\n5. 推送并创建 Pull Request\n\n### 代码规范\n\n\
    - **C++ 固件**：遵循项目现有的 `firmware/shared/` 模块结构，新算法放入共享层\n- **Python**：遵循 PEP 8，函数和类添加 docstring\n- **Commit 消息**：使用 [Conventional\
    \ Commits](https://www.conventionalcommits.org/) 格式\n  - `feat:` 新功能 / `fix:` 修复 / `docs:` 文档 / `refactor:` 重构\n\n###\
