  readme_full: "\n# Standup Coder Database\n\n## ⚠️ 重要声明\n\n### 数据来源与准确性说明\n- **AI辅助生成**：本项目内容部分由AI辅助生成，可能存在不准确或过时的信息\n- **仅供参考**：所有企业信息、数据均来源于公开渠道整理，**未经逐一核实**\n\
    - **自行验证**：使用者请务必通过官方渠道自行核实关键信息\n- **时效性说明**：数据收集截止至2026年初，后续变动请以官方信息为准\n\n### 使用建议\n- 本数据库仅供研究和参考使用\n- 重要决策请结合多方信息源进行判断\n\
    - 如发现信息错误或过时，欢迎反馈指正\n\n---\n\n## 项目介绍\nStandup Coder Database 是一个全面的企业清单和IT岗位信息数据库项目，采用清晰的文件夹结构组织各类权威企业榜单、行业信息以及IT技术岗位详细信息。项目包含权威榜单、行业清单、专题榜单、投资信息、技术活动、求职招聘、法律实务、IT岗位JD、超级个体等九大类别，覆盖全国多个城市的科技企业，以及财富500强、专精特新、独角兽等国家级/国际级权威榜单，同时提供全球IT技术岗位的详细JD信息和真实案例，以及面向超级个体和OPC（One\
    \ Person Company，一人公司）的工商注册、自媒体运营、AI工具链、个人IP、自由职业、数字产品、财税合规、副业规划、AI Agent工作流、OPC政策红利、全球化扩张等全方位实操指南，旨在为程序员、运维人员、行业研究者、投资者、求职者、独立创业者、OPC创业者等提供有价值的**参考资料**。\n\
    \n### \U0001F680 Web 控制台\n项目配套提供了一个现代化的 Web 控制台，支持多维度查询和数据可视化：\n\n```bash\ncd console\nnpm install\nnpm run dev\n```\n\
    \n**控制台功能**：\n- \U0001F4CA **首页仪表板** - 数据统计和可视化图表\n- \U0001F50D **企业查询** - 多维度筛选（城市、行业、规模、上市状态）\n- \U0001F4BC **岗位查询**\
    \ - IT岗位浏览和技能筛选\n- \U0001F3C6 **榜单浏览** - 独角兽、财富500强等权威榜单\n- \U0001F4C8 **数据分析** - 行业分布、城市布局等深度分析\n\n**技术栈**: React 19\
    \ + TypeScript + Ant Design 6 + Vite 8\n\n项目采用模块化文件夹结构：\n- **rankings/** - 国内权威企业榜单（8个文件）\n- **industry/** - 中国行业企业清单（148个文件）\n\
    - **industry-international/** - 国际行业企业清单（42个文件）\n- **outsourcing/** - 国内IT外包公司清单（4个文件）\n- **outsourcing-international/**\
    \ - 国际IT外包服务提供商清单（4个文件）\n- **rankings-international/** - 国际权威企业榜单（3个文件）\n- **interview-skills/** - 国内面试技巧指南（4个文件）\n- **interview-skills-international/**\
    \ - 国际面试技巧指南（2个文件）\n- **resume-skills/** - 国内简历制作技巧（4个文件）\n- **open-source-communities/** - 国内开源社区指南（3个文件）\n- **open-source-communities-international/**\
    \ - 国际开源社区指南（1个文件）\n- **topics-international/** - 国际科技专题榜单（1个文件）\n- **investment/** - 风险投资专题（7个文件）\n- **investment-international/**\
    \ - 国际风险投资机构清单（6个文件）\n- **events/** - 技术活动信息（4个文件）\n- **events-international/** - 国际技术活动与竞赛清单（9个文件）\n- **careers/** -\
    \ 国内求职招聘信息（23个文件）\n- **careers-international/** - 国际求职招聘信息（6个文件）\n- **legal/** - 法律实务指南（7个文件）\n- **legal-international/**\
    \ - 国际法律实务指南（8个文件）\n- **jobs/** - IT技术岗位JD信息（41个文件，含真实案例）\n- **management/** - 技术管理知识体系（21个文件，专业分类）\n- **super-individual/**\
    \ - 超级个体与OPC一人公司知识体系（50个文件，全面覆盖OPC速查手册、OPC完全指南、OPC政策红利、AI Agent工作流、Vibe Coding、OPC全球化扩张、OPC案例研究、OPC融资指南、OPC增长营销、OPC产品设计、OPC数据驱动、OPC心理健康、工商注册、自媒体、AI工具链、个人IP、自由职业、数字产品、财税合规、副业规划、程序员技能蒸馏）\n\
    \n## 目录结构说明\n\n### 权威企业榜单 (rankings/)\n收录中国最具影响力的权威企业排行榜，包括财富中国500强、福布斯中国富豪榜等国家级榜单，为投资者、研究人员、商业决策者提供权威参考。\n\n**覆盖榜单类型**：\n\
    - 国内综合性企业排行榜\n- 行业专业性榜单\n- 创新型企业榜单\n- 可持续发展榜单\n\n### 国际权威企业榜单 (rankings-international/)\n收录全球最具影响力的权威企业排行榜，涵盖财富世界500强等国际性企业榜单，为用户提供全球企业格局和发展趋势的重要参考。\n\
    \n**覆盖榜单类型**：\n- 全球综合性企业排行榜\n- 行业专业性榜单\n- 创新型企业榜单\n- 可持续发展榜单\n\n### 中国行业企业清单 (industry/)\n收录中国16个主要城市在13个科技行业的代表性企业清单，为企业调研、投资决策、求职参考提供详实的数据支撑。\n\
    \n**覆盖城市**：北京、上海、深圳、广州、杭州、南京、苏州、成都、武汉、西安、青岛、天津、重庆、长沙、合肥、济南\n\n**覆盖行业**：人工智能、大数据、区块链、物联网、智能制造、新能源、新材料、生物技术、3C电子、云计算、网络安全、互联网、软件\n\
    \n### 国际行业企业清单 (industry-international/)\n收录全球主要发达国家在各个科技行业的重要企业清单，按照国家和地区进行分类整理，为用户提供国际科技产业发展状况的参考信息。\n\n**覆盖国家和地区**：美国、欧洲、印度、日本、韩国、加拿大、英国、德国\n\
    \n**覆盖行业**：人工智能、大数据、区块链、物联网、智能制造、新能源、新材料、生物技术、3C电子、云计算、网络安全、互联网、软件\n\n### IT外包公司清单 (outsourcing/)\n收录国内主要的IT外包服务提供商，涵盖金融、电信、政府、制造业等多个行业的IT服务外包企业，为需要IT外包服务的企业和项目经理提供权威的供应商参考信息。\n\
    \n### 国际IT外包服务 (outsourcing-international/)\n收录全球主要的IT外包服务提供商，涵盖欧美、印度等主要IT服务外包市场的顶级企业，为需要国际IT外包服务的企业、项目经理、采购人员提供权威的供应商参考信息。\n\
