    - [Agent 工作指南](AGENTS.md) — AI Agent 协作规范


    ## 文档标准


    每篇文档建议尽量包含以下元素：


    - 定义 / 概述

    - 边界说明

    - 适用与非适用场景

    - 典型风险或威胁模型

    - 检测与防护要点

    - 常见误区 / FAQ

    - 关联文档


    ### Front Matter 关键字段


    ```yaml

    ---

    id: "unique-doc-id"

    title: "文档标题"

    description: "一句话描述"

    category: "foundations"

    tags: ["iam", "authentication"]

    status: "published"

    created_at: "2026-04-11"

    updated_at: "2026-04-11"

    version: "1.0.0"

    ai_summary: "面向 AI 检索的摘要"

    related_docs: ["other-doc-id"]

    ---

    ```


    ## 快速开始


    ```bash

    git clone https://github.com/hack-core-global/hack-core-database.git

    cd hack-core-database


    # 先看导航

    cat index/topic-index.md

    cat index/learning-path.md


    # 再看术语

    cat glossary/security-core-glossary.md

    ```


    ## 适用场景


    - 团队内部安全知识库

    - 安全 Agent 的外部知识工具

    - RAG 检索语料和精调母本

    - 安全产品选型、概念消歧与培训材料

    - 案例复盘与响应手册沉淀


    ## 路线图


    当前重点方向包括：


    - 持续补齐高频知识点和产品边界

    - 消减草稿/模板化文档的误召回风险

    - 加强术语消歧、标签治理和索引同步

    - 为后续 Embedding、知识图谱和问答测试集提供更稳定的知识底座

    - 扩展职业发展（09-career）与开源工具深度评测（07-open-source）

    - 完善安全基线脚本的功能测试与 Docker 化部署


    详见 [ROADMAP.md](ROADMAP.md)。


    ## 2025-2026 网络安全趋势速览


    > 本节综合 Gartner、IBM、奇安信、世界经济论坛等权威来源，提炼 2025-2026 年网络安全领域最具影响力的趋势方向，供安全从业者快速把握行业脉搏。


    ### 1. AI Agent 安全：自主智能体成为攻防新战场


    攻击者利用 AI Agent 自主探测系统漏洞并实施精准诈骗，防御方也借助智能体实现自动化威胁检测与响应。IBM 指出"自主 AI 代理正在重塑企业风险格局，传统安全模型将在其压力下瓦解"（IBM Think, 2026）。安全团队需将治理机制嵌入
    AI 开发生命周期，实时验证智能体行为合规性。


    > 来源：[IBM Cybersecurity Trends 2026](https://www.ibm.com/think/news/cybersecurity-trends-predictions-2026)、[Gartner Top
    Cybersecurity Trends 2026](https://www.gartner.com/en/newsroom/press-releases/2026-02-05-gartner-identifies-the-top-cybersecurity-trends-for-2026)、[奇安信
    2026 趋势展望](https://www.qianxin.com/chuangkehui/activity/news/details?id=14563)


    ### 2. 后量子密码与密码敏捷性


    量子计算对现有加密体系的威胁从理论走向工程实践，证书有效期持续缩短，静态加密方案已无法满足需求。IBM 强调"密码敏捷性正在成为企业韧性的基石"，组织必须能够快速切换加密标准以应对量子威胁（IBM Think, 2026）。建议立即启动密码资产盘点与抗量子算法迁移评估。


    > 来源：[IBM Cybersecurity Trends 2026](https://www.ibm.com/think/news/cybersecurity-trends-predictions-2026)、[CERNET 2026
    七大趋势](https://www.edu.cn/xxh/ji_shu_ju_le_bu/wlaq/202601/t20260129_2717911.shtml)、[ECCU 2026 Trends](https://www.eccu.edu/blog/cybersecurity-trends-2026/)


    ### 3. Shadow AI 与未授权智能体的数据泄露


    员工私自使用未经批准的 AI 工具（Shadow AI）处理敏感数据，已成为企业知识产权泄露的主要渠道。IBM 预测"我们将看到因 Shadow AI 系统导致敏感知识产权被泄露的重大安全事件"。安全团队需提供经过审批的 AI 工具替代方案，并建立机器对机器数据传输的可见性监控。


    > 来源：[IBM Cybersecurity Trends 2026](https://www.ibm.com/think/news/cybersecurity-trends-predictions-2026)、[Gartner Top
    Cybersecurity Trends 2026](https://www.gartner.com/en/newsroom/press-releases/2026-02-05-gartner-identifies-the-top-cybersecurity-trends-for-2026)


    ### 4. 深伪技术驱动的社会工程攻击升级


    AI 生成的伪造音视频使攻击者能够逼真伪装成高管或可信身份，诱导内部人员执行转账或泄露凭证。2026 年此类安全事件预计显著增多，身份验证正在成为"攻击者最容易利用且风险最高的入口"。组织应部署多模态生物识别验证并加强防钓鱼演练。


    > 来源：[IBM Cybersecurity Trends 2026](https://www.ibm.com/think/news/cybersecurity-trends-predictions-2026)、[CERNET 2026
    七大趋势](https://www.edu.cn/xxh/ji_shu_ju_le_bu/wlaq/202601/t20260129_2717911.shtml)


    ### 5. 零信任架构深化与身份即基础设施


    零信任从概念普及进入深度落地阶段，身份管理被提升至与云安全同等重要的战略高度。奇安信指出国内安全需求正从"合规驱动"转向"价值驱动"，产品与服务模式向"智能原生、平台聚合、服务订阅"转型（奇安信, 2025）。安全从业者需构建持续验证、最小权限的动态访问控制体系。


    > 来源：[奇安信 2026 趋势展望](https://www.qianxin.com/chuangkehui/activity/news/details?id=14563)、[ECCU 2026 Trends](https://www.eccu.edu/blog/cybersecurity-trends-2026/)、[WEF
    Global Cybersecurity Outlook 2026](https://www.weforum.org/publications/global-cybersecurity-outlook-2026/)


    ### 对安全从业者的启示


    | 趋势 | 关键行动 |

    |:---|:---|

    | AI Agent 安全 | 建立 AI 行为审计框架，将安全治理嵌入 Agent 开发流程 |

    | 后量子密码 | 启动密码资产清单，评估 NIST PQC 标准迁移路径 |

    | Shadow AI | 部署 AI 工具使用可见性，提供企业级合规 AI 替代方案 |

    | 深伪攻击 | 升级身份验证为多模态生物识别，定期开展反社工演练 |

    | 零信任深化 | 推进持续自适应认证，实现微分段与最小权限全覆盖 |


    ## 常见问题


    ### Q: 如何开始使用 hack-core-database？

    请参考本文档的快速开始部分。推荐首先阅读主题索引（index/topic-index.md）和学习路径导航（index/learning-path.md），然后根据您的需求选择相应的分类目录深入学习。


    ### Q: 本知识库主要覆盖哪些领域？

    hack-core-database 覆盖信息安全与网络安全的完整学科体系，包括：安全基础理论（01-foundations）、攻防技术（02-offensive-security）、安全运营（03-security-operations）、合规治理（04-compliance-governance）、安全架构（05-security-architecture）、安全产品（06-security-products）、开源工具（07-open-source）、案例分析（08-case-studies）、职业发展（09-career）和安全命令（10-security-commands）。


    ### Q: 如何贡献新文档或改进现有内容？

    请参考 AGENTS.md 中的贡献指南。标准流程包括：选择正确的分类目录、使用完整的 Front Matter 元数据、遵循文档模板、运行验证脚本检查、提交 Pull Request。


    ### Q: 本知识库如何保证内容质量？

    所有文档遵循统一的 Front Matter 元数据规范，CI/CD 流水线自动执行 Markdown 语法检查、Front Matter 完整性校验和死链检测。重点文档包含威胁模型、检测信号、防护措施、常见误区和 FAQ 等完整维度。


    ### Q: 可以将本知识库用于哪些场景？

    本知识库适用于：团队内部安全知识库、安全 Agent 的外部知识工具、RAG 检索语料和精调母本、安全产品选型和概念消歧，以及安全培训和教学材料。

    '
