    \ | 摇滚歌曲创作 |\n| [历史与流派](./15-Rock-School/05-History-and-Genres/rock-history-comprehensive.md) | 摇滚历史与流派 |\n\n### [`Appendix-A-Music-Institutions`](./Appendix-A-Music-Institutions/)\
    \ — 音乐院校\n\n学音乐选对学校是第一步，国内\"九大\"到海外名校全覆盖。\n\n| 文档 | 内容概要 |\n|------|---------|\n| [中国音乐院校](./Appendix-A-Music-Institutions/01-Chinese-Conservatories/chinese-conservatories.md)\
    \ | 九大音乐学院 + 综合类大学音乐院系 |\n| [国际音乐院校](./Appendix-A-Music-Institutions/02-International-Conservatories/international-conservatories.md)\
    \ | 美/英/德/奥/法/亚太顶尖音乐学府 |\n\n## 学习路径\n\n不知道从哪开始？看你的目标：\n\n```mermaid\ngraph LR\n    START[我想学音乐] --> Q{你的方向?}\n    Q -->|弹琴/唱歌|\
    \ A[基本乐理 → 视唱练耳 → 音乐表演]\n    Q -->|写歌/编曲| B[基本乐理 → 视唱练耳 → 作曲理论]\n    Q -->|研究/评论| C[基本乐理 → 视唱练耳 → 音乐学]\n    Q -->|当老师|\
    \ D[基本乐理 → 视唱练耳 → 表演 → 音乐教育]\n    Q -->|做音乐制作| E[基本乐理 → 视唱练耳 → 作曲理论 → 音乐科技]\n    Q -->|当指挥| F[基本乐理 → 视唱练耳 → 作曲理论 → 指挥]\n\
    \    Q -->|进音乐公司| G[音乐产业管理 + 任意基础]\n    Q -->|做音乐治疗| H[基本乐理 → 音乐学 → 音乐治疗]\n```\n\n| 路径 | 推荐阅读顺序 |\n|------|-------------|\n\
    | **音乐表演** | `00-基本乐理` → `01-视唱练耳` → `02-音乐表演`（选你的乐器） |\n| **作曲** | `00-基本乐理` → `01-视唱练耳` → `03-作曲理论`（从和声学开始） |\n| **音乐学**\
    \ | `00-基本乐理` → `01-视唱练耳` → `04-音乐学`（从音乐史入门） |\n| **音乐教育** | `00-基本乐理` → `01-视唱练耳` → `02-表演基础` → `05-音乐教育` |\n| **音乐科技**\
    \ | `00-基本乐理` → `01-视唱练耳` → `03-作曲理论` → `06-音乐科技` |\n| **音乐产业** | `07-音乐产业` + 根据兴趣补充其他模块 |\n| **指挥** | `00-基本乐理` → `01-视唱练耳`\
    \ → `03-作曲理论` → `08-指挥` |\n| **音乐治疗** | `00-基本乐理` → `04-音乐学`（音乐心理学） → `09-音乐治疗` |\n\n## 基础设施\n\n本项目配备完善的元数据系统，适合作为结构化语料库使用：\n\
    \n| 目录 | 用途 |\n|------|------|\n| [`_meta/taxonomy.yaml`](./_meta/taxonomy.yaml) | 学科分类法 — 全部模块和子模块的层级关系、标签、前置知识 |\n|\
    \ [`_meta/glossary.yaml`](./_meta/glossary.yaml) | 多语言术语表 — 中/英/意/德/法对照 |\n| [`_meta/content-schema.md`](./_meta/content-schema.md)\
    \ | 内容规范 — 6 种文档类型的标准结构定义 |\n| [`_meta/difficulty-levels.md`](./_meta/difficulty-levels.md) | 难度分级 — 4 级难度体系 |\n| [`_meta/cross-references.yaml`](./_meta/cross-references.yaml)\
    \ | 交叉引用 — 知识链路与跨模块关联 |\n| [`_templates/`](./_templates/) | 文档模板 — 乐器/理论/历史/科技/人物 5 种 |\n\n## 文档规范\n\n每篇文档遵循统一的写作标准：\n\
    \n- **语言**：中文撰写，专业术语标注英文原文及来源语言\n- **术语格式**：`中文（English, 原语言: 原文）`，例如 `力度（Dynamics, 意大利语: dinamica）`\n- **内容结构**：概述 →\
    \ 历史沿革 → 核心知识 → 技术要点 → 实践指导 → 延伸资源\n- **交叉引用**：每篇文档底部链接相关文档，方便跳转阅读\n- **写作风格**：口语化表达，用生活场景打比方，拒绝学术八股\n- **元数据**：支持 YAML\
    \ Front Matter 标注分类、难度、标签等信息\n\n## 贡献指南\n\n欢迎参与完善这个知识库！\n\n### 你可以做什么\n\n- **纠错**：发现事实错误、术语翻译不准、链接失效 → 提 Issue\n- **补充**：觉得某篇文档遗漏了重要内容\
    \ → 提 PR\n- **新增**：想写一个还没覆盖的话题 → 先开 Issue 讨论，再提 PR\n- **翻译**：有能力把内容翻译成其他语言 → 非常欢迎\n\n### 写作要求\n\n1. 遵循上方 [文档规范](#文档规范)\
    \ 和 [`_meta/content-schema.md`](./_meta/content-schema.md)\n2. 参考 [`_templates/`](./_templates/) 中的对应模板\n3. 专业术语必须标注英文/原语言来源\n\
    4. 别写成教科书 —— 用大白话，多打比方，让人读得下去\n5. 每篇文档底部添加相关文档的交叉引用链接\n6. 文件名使用小写英文 + 连字符（如 `chord-fundamentals.md`）\n\n### 提交规范\n\n```\n\
    feat: 新增小提琴演奏技法文档\nfix: 修正和声学文档中的术语错误\ndocs: 补充录音技术文档的设备推荐章节\n```\n\n## 项目状态\n\n> 最后统计：2026-07-29，仅统计正文 Markdown（不含 README\
    \ / INDEX / 模板 / 元数据）。  \n> 状态分级依据：✅ 核心覆盖 / \U0001F7E1 建设中（主干已有，部分子领域偏薄）/ \U0001F3D7️ 骨架（仅框架，待充实）。\n\n| 模块 | 文档数 | 状态\
