  description: '# 孤裂 / The Aporia'
  readme_excerpt: '# 孤裂 / The Aporia'
  readme_full: "# 孤裂 / The Aporia\n\n一部关于爱、囚禁与不可逃脱之命运的心理恐怖长篇小说。\n\n## 故事梗概\n\n工程师陈默将自己封闭在三楼阳光房——一个被三百七十二张电影海报封死的玻璃盒子。他隔着露台一米五的距离，注视着邻居苏青，一个被丈夫暴力对待的画家。当倒计时出现在海报表面，当墙壁里传来姐姐的呼吸声，陈默跨越了那一米五。他以为自己是在拯救，却不知道真正的囚笼不是他建造的——是他自己。\n\
    \n**Aporia**（古希腊语：απορία），意为\"无路可走\"。你保护一个人，却成为囚禁她的人。你爱她，却让她生不如死。\n\n## 结构\n\n全书六幕二十章，共 5567 行。\n\n### 第一幕：海报背后（1–3章）\n\
    \n| 章 | 标题 | 行数 |\n|----|------|------|\n| 1 | 海报后面的眼睛 | 313 |\n| 2 | 过滤过的听觉 | 145 |\n| 3 | 那个指甲 | 137 |\n\n### 第二幕：裂缝（4–7章）\n\
    \n| 章 | 标题 | 行数 |\n|----|------|------|\n| 4 | 低压 | 1272 |\n| 5 | 管道里的头发 | 499 |\n| 6 | 林若的离开 | 297 |\n| 7 | 姐姐的坟墓 | 239\
    \ |\n\n### 第三幕：淤青（8–11章）\n\n| 章 | 标题 | 行数 |\n|----|------|------|\n| 8 | 七月十四 | 395 |\n| 9 | 跨越一米五 | 229 |\n| 10 | 工程师的设计\
    \ | 167 |\n| 11 | 最后的晚餐 | 133 |\n\n### 第四幕：台风夜（12–15章）\n\n| 章 | 标题 | 行数 |\n|----|------|------|\n| 12 | 台风眼 | 215 |\n\
    | 13 | 血与肉 | 195 |\n| 14 | 清理 | 117 |\n| 15 | 回来 | 185 |\n\n### 第五幕：囚徒（16–18章）\n\n| 章 | 标题 | 行数 |\n|----|------|------|\n\
    | 16 | 消失 | 187 |\n| 17 | 刑警的眼睛 | 191 |\n| 18 | 夹层 | 137 |\n\n### 第六幕：孤裂（19–20章）\n\n| 章 | 标题 | 行数 |\n|----|------|------|\n\
    | 19 | 她刚睡着 | 233 |\n| 20 | Aporia | 281 |\n\n## 核心人物\n\n- **陈默**——工程师，住三楼阳光房，用海报封死所有光线。第一人称叙述者。\n- **苏青**——邻居画家，遭受丈夫家暴。与陈默隔露台共享沉默。\n\
    - **林若**——陈默之妻，提出离婚，带走儿子。\n- **陈曦**——陈默八岁的儿子，能听到\"墙后面的声音\"。\n- **陈静**——陈默的姐姐，出生前三个月死去，葬在后院月季下。\n- **周明**——刑侦支队警官，调查苏青失踪案。\n\
    \n## 空间象征\n\n三层别墅的垂直结构对应三重隔绝：\n\n- **一楼**——父母，地基，腐朽的根源\n- **二楼**——妻儿，表象的秩序\n- **三楼**——陈默的阳光房，自我囚禁的透明盒子\n\n一米五的露台间距是全书核心空间隐喻——一步之遥，生死之隔。结尾用三步走完。\n\
    \n## 文件说明\n\n```\nchapters/\n  chapter1.md — chapter20.md      全书正文（20章）\n\noutlines/\n  outline-20chapters.md       \
    \    二十章结构大纲\n  outline.md                      原始大纲\n\nexports/\n  孤裂.txt                        微信读书导入版（纯文本，无章节编号）\n\
    \nreviews/\n  evaluation-report.md            文学评估报告\n```\n# the-aporia\n《孤裂》《The Aporia》\n"
