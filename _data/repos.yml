  description: '# AI News Database（AI 新闻数据库）'
  readme_excerpt: '# AI News Database（AI 新闻数据库）'
  readme_full: "# AI News Database（AI 新闻数据库）\n\n一个专门用于持续沉淀 AI 高质量新闻和重点事件的 Markdown 数据库。按主题组织、以线索为单位、用时间线累积，最终呈现深度分析与演进脉络。\n\
    \n## 这是什么\n\n- **Markdown 数据库为主体**：根目录是按 AI 全景主题组织的 Markdown 文件，git 跟踪、人可读、可长期沉淀。\n- **一条线索 = 一个时间线文档**：每个 `.md` 持续追加某条故事线（产品、技术、趋势）的相关新闻，越积越厚。\n\
    - **手动整理为主**：当前阶段不依赖自动化抓取，新闻由人工筛选、整理后录入，保证质量。\n- **辅助工具统一在 [`tools/`](tools/)**：CLI、Web 界面、浏览器扩展均在 `tools/cmd/` 下作为自包含\
    \ Go module 维护，仅作可选辅助，不是核心入口。\n\n## 目录结构\n\n```\nai-news-database/\n├── <主题文件夹>/          # 13 个 AI 全景主题，见 _topics.md\n\
    │   ├── _index.md          # 主题说明 + 线索列表\n│   └── <线索>.md          # 线索·时间线文件\n├── _topics.md             # 中心主题索引\n├──\
    \ _2026大事记.md         # 2026 年度重点事件索引（按月归档）\n├── tools/                 # 辅助工具（CLI + Web 界面 + 浏览器扩展）\n│   └── cmd/   \
    \            # 自包含 Go module\n├── docs/                  # 项目文档 + 线索模板\n└── README.md\n```\n\n## 如何阅读\n\n1. 从 [`_topics.md`](_topics.md)\
    \ 选一个主题，或从 [`_2026大事记.md`](_2026大事记.md) 按月份浏览年度重点事件。\n2. 进入主题文件夹，读 `_index.md` 看该主题下有哪些线索。\n3. 打开任一线索 `.md`，「时间线」章节按时间倒序排列（最新在上），往下看即追溯演进。\n\
    \n## 如何贡献一条新闻\n\n1. 找到新闻所属的线索文件（如 `智能体平台/Claude代码助手.md`）。若无线索，从 [`docs/线索模板.md`](docs/线索模板.md) 复制一个新建。\n2. 在「时间线」顶部最近的\
    \ `### YYYY-MM` 下插入一条：\n\n   ```\n   - **2026-07-21** · [标题](URL)\n     一句话摘要。关键数据/影响。\n   ```\n\n3. 跨月则新建月份标题。\n4. 更新\
    \ frontmatter 的 `更新:` 日期。\n5. 若属于年度重点事件，同步在 [`_2026大事记.md`](_2026大事记.md) 对应月份下登记一行。\n6. （可选）补充「概述」（事实）或「分析」（观点）。\n\n详见\
    \ [`CONTRIBUTING.md`](CONTRIBUTING.md)。\n\n## 如何新建一个主题\n\n见 [`_topics.md`](_topics.md) 的「如何新增主题」。\n\n## 工具\n\n所有辅助工具统一在\
    \ [`tools/`](tools/) 目录下管理（当前阶段以手动整理为主，工具仅作可选辅助）：\n\n- `tools/cmd/`：Go CLI（`ai-news-database`），含本地阅读、筛选、导出等能力\n- `tools/cmd/web/`：本地\
    \ Web 界面（由 CLI 的 `web` 子命令提供服务）\n- `tools/cmd/browser-extension/`：浏览器剪藏扩展\n\n在 `tools/cmd/` 目录下构建：\n\n```bash\ncd tools/cmd\n\
    go build ./...\ngo test ./...\n```\n\n或从仓库根用转发 Makefile：\n\n```bash\nmake build\nmake test\n```\n"
