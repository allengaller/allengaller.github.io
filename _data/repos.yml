    \ | 噪声、ASMR、频率治疗 |\n\n### [`14-Jazz-School`](./14-Jazz-School/) — 爵士音乐学院\n\n爵士乐从基础理论到即兴演奏的系统课程（当前为骨架，持续建设中）。\n\n| 单元 |\
