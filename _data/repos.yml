  description: '# MCP Tool Suite'
  readme_excerpt: '# MCP Tool Suite'
  readme_full: "# MCP Tool Suite\n\n[![Python](https://img.shields.io/badge/python-3.11%2B-blue.svg)](https://www.python.org/)\n\
    [![License](https://img.shields.io/badge/license-MIT-green.svg)](LICENSE)\n[![Servers](https://img.shields.io/badge/MCP%20Servers-37-orange.svg)](#mcp-服务器一览)\n\
    [![Build](https://img.shields.io/github/actions/workflow/status/standup-coder/mcp4coder/ci.yml?branch=main)](https://github.com/standup-coder/mcp4coder/actions)\n\
    \n**37 个 MCP Server，一套统一框架。** 覆盖开发工具链、云平台管理、文档查询、浏览器自动化、设计协作、项目管理、错误监控、代码沙箱、支付通信等场景，配套 Web 管理界面和可视化工作流设计器。\n\n---\n\n\
    ## 目录\n\n- [MCP 服务器一览](#mcp-服务器一览)\n- [架构概览](#架构概览)\n- [快速开始](#快速开始)\n- [环境配置](#环境配置)\n- [API 使用](#api-使用)\n- [Docker\
    \ 部署](#docker-部署)\n- [安全特性](#安全特性)\n- [项目结构](#项目结构)\n- [开发新 Server](#开发新-server)\n- [Dumb 模式（极简版）](#dumb-模式极简版)\n- [2026\
    \ MCP 生态趋势](#2026-mcp-生态趋势)\n- [Roadmap](#roadmap)\n- [文档](#文档)\n- [贡献](#贡献)\n\n---\n\n## MCP 服务器一览\n\n### 开发工具链\n\n|\
    \ Server | 说明 | Tools | 所需环境变量 |\n|--------|------|:-----:|-------------|\n| \U0001F4C1 **Filesystem** | 文件读写、目录操作、路径搜索\
    \ | 7 | — |\n| \U0001F527 **Git** | 版本控制全操作（commit/branch/diff/log） | 9 | — |\n| \U0001F5C4️ **Database** | MySQL / PostgreSQL\
    \ / SQLite / Redis | 7 | — |\n| \U0001F310 **HTTP Client** | 发送任意 HTTP 请求 | 5 | — |\n| \U0001F4E6 **GitHub** | 仓库、Issue、PR、代码搜索\
