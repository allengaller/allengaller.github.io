    \ get llm transformer-scratch\n\n# 获取训练类案例\nopendemo get llm lora-fine-tuning\n\n# 获取推理优化案例\nopendemo get llm vllm-inference\n\
    \n# 获取 Agentic AI 案例\nopendemo get llm react-agent\n```\n\n### \U0001F3AF 里程碑目标与补齐计划\n\n当前 LLM 8 大领域已初步覆盖，近期已补齐 4 个高优先级缺口，剩余方向持续深化中。\n\
