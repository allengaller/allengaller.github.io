  readme_full: "<p align=\"center\">\n  <img src=\"https://img.shields.io/badge/docs-1300%2B%20articles-blue?style=flat-square\"\
    \ alt=\"Documents\">\n  <img src=\"https://img.shields.io/badge/modules-10%20majors%20%2B%20appendix-orange?style=flat-square\"\
    \ alt=\"Modules\">\n  <img src=\"https://img.shields.io/badge/language-中文-red?style=flat-square\" alt=\"Language\">\n\
    \  <img src=\"https://img.shields.io/github/last-commit/sit-music/sit-music-database?style=flat-square\" alt=\"Last Commit\"\
    >\n  <img src=\"https://img.shields.io/github/repo-size/sit-music/sit-music-database?style=flat-square\" alt=\"Repo Size\"\
    >\n  <img src=\"https://img.shields.io/badge/license-CC%20BY--SA%204.0-green?style=flat-square\" alt=\"License\">\n</p>\n\
    \n<h1 align=\"center\">SIT Music Knowledge Database</h1>\n\n<p align=\"center\">\n  <strong>按照专业音乐院校完整知识体系构建的开放音乐学习资源库</strong><br>\n\
    \  <em>An open music knowledge base structured around the complete conservatory curriculum</em>\n</p>\n\n<p align=\"center\"\
    >\n  <a href=\"#快速开始\">快速开始</a> •\n  <a href=\"#项目架构\">项目架构</a> •\n  <a href=\"#模块导航\">模块导航</a> •\n  <a href=\"#学习路径\"\
    >学习路径</a> •\n  <a href=\"INDEX.md\">完整索引</a> •\n  <a href=\"#贡献指南\">贡献指南</a>\n</p>\n\n---\n\n## 这是什么\n\n一句话说明白：**这是一个把音乐学院四年本科课程体系搬到\
    \ GitHub 上的项目。**\n\n十五大知识模块 + 附录，1,300+ 篇专业文档，从基本乐理、视唱练耳到音乐表演、作曲理论、音乐学、音乐教育、音乐科技、音乐产业、指挥、音乐治疗、歌单分类、脑波科学、爵士与摇滚学院 —— 全覆盖。\n\
    \n不是那种干巴巴的教科书搬运，每篇文档都用大白话写，该打比方打比方，该举例子举例子。专业术语全部标注英文原文和对应语言来源（意大利语、德语、法语……该标的一个不落）。\n\n配套完善的元数据基础设施：学科分类法（taxonomy）、多语言术语表（glossary）、内容规范（schema）、难度分级、交叉引用关系图、标准文档模板\
    \ —— 适合作为语料数据库使用。\n\n> \U0001F4D1 **两个入口文件，分工不同**：\n> - **README.md**（本文件）= 项目门面：是什么、怎么用、模块概览、精选入口。\n> - **[INDEX.md](./INDEX.md)**\
    \ = 完整文档索引：346+ 条逐篇链接，按模块分类。**找具体文档请直接去 INDEX。**\n\n## 快速开始\n\n```bash\n# 克隆仓库\ngit clone https://github.com/sit-music/sit-music-database.git\n\
    \n# 用你喜欢的 Markdown 编辑器打开\n# 推荐 Obsidian / Typora / VS Code\ncd sit-music-database\n```\n\n> **零基础？** 从这里开始 → [基本乐理](./00-Music-Fundamentals/README.md)\
    \ → [视唱练耳](./01-Sight-Singing-and-Ear-Training/README.md)\n>\n> **有基础？** 直接跳到你感兴趣的 [模块导航](#模块导航)，挑着看就行。\n\n## 项目架构\n\n\
    ```\nsit-music-database/\n│\n├── 00-Music-Fundamentals/                 # 基本乐理（12 篇）\n├── 01-Sight-Singing-and-Ear-Training/\
    \     # 视唱练耳基础（8 篇）\n├── 02-Music-Performance/                  # 音乐表演（219 篇）\n├── 03-Composition-and-Music-Theory/  \
    \     # 作曲与作曲技术理论（12 篇）\n├── 04-Musicology/                         # 音乐学（568 篇）\n├── 05-Music-Education/            \
    \        # 音乐教育（14 篇）\n├── 06-Music-Technology/                   # 音乐科技（373 篇）\n├── 07-Music-Industry-and-Management/\
    \      # 音乐产业与管理（12 篇）\n├── 08-Conducting/                         # 指挥（22 篇）\n├── 09-Music-Therapy/                 \
    \     # 音乐治疗（10 篇）\n├── 10-Playlist/                           # 歌单分类（54 篇）\n├── 11-Brainwave-Science/               \
    \   # 脑波科学（7 篇）\n├── 14-Jazz-School/                        # 爵士音乐学院（5 篇，骨架）\n├── 15-Rock-School/                    \
    \    # 摇滚音乐学院（6 篇，骨架）\n├── Appendix-A-Music-Institutions/         # 音乐院校（10 篇）\n│\n├── _meta/                        \
    \         # 元数据（分类法/术语表/规范）\n├── _templates/                            # 文档模板（16 种）\n├── _assets/                   \
    \            # 资源文件（图片/音频/乐谱）\n│\n├── INDEX.md                               # 完整文档索引\n└── README.md                 \
    \             # 你正在看的这个文件\n```\n\n> **关于编号体系**：顶层模块编号 `00–11` 按学科逻辑顺序排列；`12`、`13` 编号保留给 `04-Musicology` 内部的流行音乐子模块（`12-East-Asian-Popular-Music`、`13-Chinese-Language-Popular-Music`），因此顶层学院模块从\
    \ `14` 起——`14-Jazz-School`（JZ）、`15-Rock-School`（RK）。这不是缺漏，是刻意的双层编号。\n\n```mermaid\ngraph TB\n    MF[00 基本乐理]\n    SSET[01\
    \ 视唱练耳]\n    MP[02 音乐表演]\n    CMT[03 作曲理论]\n    MUS[04 音乐学]\n    ME[05 音乐教育]\n    MT[06 音乐科技]\n    MIM[07 音乐产业]\n    CON[08\
    \ 指挥]\n    MTH[09 音乐治疗]\n    PL[10 歌单分类]\n    BW[11 脑波科学]\n    JZ[14 爵士学院]\n    RK[15 摇滚学院]\n\n    MF --> SSET\n    SSET\
    \ --> MP\n    SSET --> CMT\n    SSET --> MUS\n    MP --> ME\n    MP --> CON\n    CMT --> MT\n    CMT --> ME\n    MUS -->\
    \ ME\n    MUS --> MTH\n    MP --> MIM\n    MT --> MIM\n    MUS --> PL\n    MTH --> BW\n    MUS --> JZ\n    MUS --> RK\n\
    \    MT --> JZ\n    MT --> RK\n```\n\n## 模块导航\n\n### [`00-Music-Fundamentals`](./00-Music-Fundamentals/) — 基本乐理\n\n一切音乐学习的起点，记谱法、音程、调性、拍号、术语。\n\
    \n| 文档 | 内容 |\n|------|------|\n| [记谱法](./00-Music-Fundamentals/01-Notation/notation-systems.md) | 五线谱、简谱、TAB谱、减字谱、图形记谱\
    \ |\n| [音程](./00-Music-Fundamentals/02-Intervals/intervals.md) | 度数、性质、协和与不协和、转位 |\n| [调与调性](./00-Music-Fundamentals/03-Keys-and-Tonality/keys-and-tonality.md)\
    \ | 大小调、调号、五度圈、转调 |\n| [拍号与速度](./00-Music-Fundamentals/04-Time-Signatures-and-Tempo/time-and-tempo.md) | 节拍、速度术语、节奏型 |\n\
    | [音乐术语大全](./00-Music-Fundamentals/05-Musical-Terms/musical-terms-glossary.md) | 力度/速度/表情/演奏法术语 |\n\n### [`01-Sight-Singing-and-Ear-Training`](./01-Sight-Singing-and-Ear-Training/)\
    \ — 视唱练耳基础\n\n所有音乐专业的公共基础课，训练你的音乐听觉。\n\n| 文档 | 内容 |\n|------|------|\n| [什么是音乐](./01-Sight-Singing-and-Ear-Training/what-is-music.md)\
    \ | 真正的第一课 |\n| [声音的属性](./01-Sight-Singing-and-Ear-Training/01-Pitch-Training/sound-properties.md) | 频率、振幅、波形、泛音 |\n|\
    \ [音高与音名](./01-Sight-Singing-and-Ear-Training/01-Pitch-Training/pitch-and-note-names.md) | 唱名、音名、十二平均律 |\n| [节奏与节拍](./01-Sight-Singing-and-Ear-Training/02-Rhythm-Training/rhythm-and-meter.md)\
    \ | 拍号、节奏型、律动感 |\n| [旋律听写](./01-Sight-Singing-and-Ear-Training/03-Melodic-Dictation/melodic-dictation.md) | 听到什么写什么 |\n\
    | [和声听辨](./01-Sight-Singing-and-Ear-Training/04-Harmonic-Ear-Training/harmonic-ear-training.md) | 分辨和弦色彩与功能 |\n| [音乐基本要素](./01-Sight-Singing-and-Ear-Training/05-Score-Reading/musical-elements.md)\
    \ | 旋律、和声、节奏、音色、力度、织体 |\n\n### [`02-Music-Performance`](./02-Music-Performance/) — 音乐表演\n\n所有乐器的演奏技术、历史沿革和学习方法。从声乐到打击乐，从西洋乐器到中国民乐。\n\
    \n| 分类 | 涵盖内容 |\n|------|---------|\n| [声乐](./02-Music-Performance/01-Vocal/vocal-overview.md) | 美声、民族、流行唱法 |\n| [键盘乐器](./02-Music-Performance/02-Keyboard-Instruments/)\
    \ | 钢琴、手风琴、管风琴、电子键盘、**合成器** |\n| [弦乐器](./02-Music-Performance/03-String-Instruments/) | 提琴族、吉他族（含**尤克里里**）、竖琴、二胡/琵琶/古筝\
    \ |\n| [木管乐器](./02-Music-Performance/04-Woodwind-Instruments/) | 长笛、双簧管、单簧管、大管、萨克斯、**中国传统管乐器** |\n| [铜管乐器](./02-Music-Performance/05-Brass-Instruments/)\
    \ | 圆号、小号、长号、大号 |\n| [打击乐器](./02-Music-Performance/06-Percussion/) | 定音鼓、小军鼓、马林巴、爵士鼓、民族打击乐 |\n| [室内乐](./02-Music-Performance/07-Chamber-Music/chamber-music-overview.md)\
    \ | 弦乐四重奏、木管五重奏、钢琴三重奏等 |\n| [乐队合奏](./02-Music-Performance/08-Ensemble/ensemble-overview.md) | 管弦乐队、管乐团、民族管弦乐团 |\n\n###\
    \ [`03-Composition-and-Music-Theory`](./03-Composition-and-Music-Theory/) — 作曲与作曲技术理论\n\n从和弦基础到影视配乐，作曲的十八般武艺。\n\n| 文档\
    \ | 一句话概要 |\n|------|-----------|\n| [作曲基础](./03-Composition-and-Music-Theory/01-Composition-Fundamentals/composition-fundamentals.md)\
    \ | 旋律、动机、乐句 —— 写曲子的第一步 |\n| [和弦基础](./03-Composition-and-Music-Theory/02-Harmony/chord-fundamentals.md) | 三和弦、七和弦、转位，听懂和声的起点\
    \ |\n| [调式与音阶](./03-Composition-and-Music-Theory/02-Harmony/modes-and-scales.md) | 大调小调教会调式，音阶不只是哆来咪 |\n| [和声进行](./03-Composition-and-Music-Theory/02-Harmony/harmonic-progression.md)\
    \ | I-IV-V-I 为什么好听，以及怎么玩出花来 |\n| [曲式分析](./03-Composition-and-Music-Theory/03-Form-and-Analysis/musical-form-analysis.md)\
    \ | 音乐的建筑学 —— 二段体到奏鸣曲式 |\n| [配器法](./03-Composition-and-Music-Theory/04-Orchestration/orchestration.md) | 怎么给乐队写总谱，哪些乐器搭配好听\
    \ |\n| [对位法](./03-Composition-and-Music-Theory/05-Counterpoint/counterpoint.md) | 多条旋律怎么编在一起不打架 |\n| [现代作曲技法](./03-Composition-and-Music-Theory/06-Modern-Composition-Techniques/modern-techniques.md)\
    \ | 十二音、偶然音乐、频谱主义…… |\n| [电子音乐作曲](./03-Composition-and-Music-Theory/07-Electronic-Music-Composition/electronic-music-composition.md)\
    \ | 合成器、采样、音色设计 |\n| [影视配乐](./03-Composition-and-Music-Theory/08-Film-Scoring/film-scoring.md) | 画面和音乐怎么配合讲故事 |\n| [歌曲创作](./03-Composition-and-Music-Theory/09-Songwriting/songwriting.md)\
    \ | 词曲搭配、Hook 设计、编曲思路 |\n\n### [`04-Musicology`](./04-Musicology/) — 音乐学\n\n音乐的前世今生，从远古骨笛到电子音乐。\n\n| 分类 | 涵盖内容 |\n|------|---------|\n\
    | [中国音乐史](./04-Musicology/01-Chinese-Music-History/) | 古代 → 近现代 → 当代 |\n| [西方音乐史](./04-Musicology/02-Western-Music-History/)\
    \ | 古代中世纪 → 文艺复兴 → 巴洛克 → 古典 → 浪漫 → 20世纪 |\n| [世界音乐](./04-Musicology/03-World-Music/) | 亚洲、非洲、拉美、欧洲民间音乐 |\n| 交叉学科 | [音乐美学](./04-Musicology/04-Music-Aesthetics/music-aesthetics.md)\
    \ · [民族音乐学](./04-Musicology/05-Ethnomusicology/ethnomusicology.md) · [音乐社会学](./04-Musicology/06-Music-Sociology/music-sociology.md)\
    \ · [音乐心理学](./04-Musicology/07-Music-Psychology/music-psychology.md) · [音乐文献学](./04-Musicology/08-Music-Bibliography/music-bibliography.md)\
    \ |\n| **新兴方向** | [流行音乐研究](./04-Musicology/09-Popular-Music-Studies/popular-music-studies.md) · [音乐批评](./04-Musicology/10-Music-Criticism/music-criticism.md)\
    \ · [音乐哲学](./04-Musicology/11-Music-Philosophy/music-philosophy.md) |\n| **东亚流行音乐** | [K-pop](./04-Musicology/12-East-Asian-Popular-Music/kpop.md)\
    \ · [J-pop](./04-Musicology/12-East-Asian-Popular-Music/jpop.md) · [韩国乐坛](./04-Musicology/12-East-Asian-Popular-Music/korean-music-industry.md)\
    \ · [日本乐坛](./04-Musicology/12-East-Asian-Popular-Music/japanese-music-industry.md) |\n\n### [`05-Music-Education`](./05-Music-Education/)\
    \ — 音乐教育\n\n怎么教音乐、怎么学音乐，三大教学法体系全拆解。\n\n| 文档 | 关键词 |\n|------|--------|\n| [音乐教学法总论](./05-Music-Education/01-Music-Pedagogy/music-pedagogy.md)\
    \ | 教学理念、方法论框架 |\n| [幼儿音乐教育](./05-Music-Education/02-Early-Childhood-Music/early-childhood-music.md) | 0-6岁音乐启蒙 |\n| [音乐教育心理学](./05-Music-Education/03-Music-Education-Psychology/music-education-psychology.md)\
    \ | 学习动机、音乐认知发展 |\n| [音乐课程设计](./05-Music-Education/04-Curriculum-Design/curriculum-design.md) | 课标解读、课程架构 |\n| [音乐教育评估](./05-Music-Education/05-Music-Education-Assessment/music-education-assessment.md)\
    \ | 过程性评价、表现性评价 |\n| [柯达伊教学法](./05-Music-Education/06-Kodaly-Method/kodaly-method.md) | 歌唱为核心、手势音阶 |\n| [奥尔夫教学法](./05-Music-Education/07-Orff-Approach/orff-approach.md)\
    \ | 节奏入手、即兴创造 |\n| [达尔克罗兹体态律动](./05-Music-Education/08-Dalcroze-Eurhythmics/dalcroze-eurhythmics.md) | 身体就是乐器 |\n\n###\
    \ [`06-Music-Technology`](./06-Music-Technology/) — 音乐科技\n\n录音棚里那些事儿，从麦克风到人工智能。\n\n| 文档 | 关键词 |\n|------|--------|\n|\
    \ [录音技术](./06-Music-Technology/01-Recording-Technology/recording-technology.md) | 拾音方式、录音流程 |\n| [混音与母带](./06-Music-Technology/02-Mixing-and-Mastering/mixing-and-mastering.md)\
