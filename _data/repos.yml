    ## 统计


    - **总专业数**：53 个（含基础学部 5 个 + 全球艺术学院 + 跨学科艺术类 2 个 + 主题专题集 1 个）

    - **总文档数**：323 个 Markdown 文件

    - **参照院校**：RISD、Yale、RCA、UAL、Slade、Parsons、CalArts、MIT Media Lab、CMU ETC、NYU Tisch/ITP/Game Center、Juilliard、Berklee、Gobelins、Sheridan、AFI、USC、RADA、NFTS、Courtauld、Goldsmiths、Sotheby''s
    Institute 等


    ## 本地开发


    ```bash

    npm install

    npm run dev       # 启动开发服务器

    npm run build     # 构建静态站点（输出到 dist/）

    npm run preview   # 预览构建结果

    ```


    ## 技术栈


    - **Astro** — 静态站点生成器

    - **Tailwind CSS v4** — 样式框架（通过 PostCSS）

    - **Pagefind** — 客户端全文搜索

    - **GitHub Actions** — 自动部署到 GitHub Pages


    ---


