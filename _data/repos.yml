  description: '# OpenDemo · 智能化技术演示平台'
  readme_excerpt: '# OpenDemo · 智能化技术演示平台'
  readme_full: "# OpenDemo · 智能化技术演示平台\n\n<p align=\"center\">\n  <img src=\"https://img.shields.io/badge/demos-532%2B-0056b3?style=flat-square\"\
    \ alt=\"532+ Demos\">\n  <img src=\"https://img.shields.io/badge/stacks-12-00a3e0?style=flat-square\" alt=\"12 Stacks\"\
    >\n  <img src=\"https://img.shields.io/badge/license-MIT-28a745?style=flat-square\" alt=\"License\">\n  <img src=\"https://img.shields.io/badge/status-active-7b42bc?style=flat-square\"\
    \ alt=\"Active\">\n</p>\n\n<p align=\"center\">\n  <b>从代码到云原生的一站式技术演示平台</b><br>\n  532+ 生产级 Demo · 12 大技术栈 · 智能 CLI 工具\
    \ · 统一命名规范 · 体系化学习路径\n</p>\n\n<p align=\"center\">\n  <a href=\"./index.html\">\U0001F3E0 项目主页</a> •\n  <a href=\"https://github.com/opendemo/opendemo\"\
    >\U0001F4E6 主仓库</a> •\n  <a href=\"https://github.com/opendemo/opendemo/tree/main/opendemo-cli\">\U0001F527 CLI 文档</a>\
    \ •\n  <a href=\"#learning-paths\">\U0001F6E4️ 学习路径</a> •\n  <a href=\"#contribute\">\U0001F91D 参与贡献</a>\n</p>\n\n---\n\
    \n## \U0001F3AF 项目简介\n\n**OpenDemo** 是一个面向真实生产场景的综合性技术学习与演示平台。我们不仅提供代码示例，更提供从基础语法到企业级架构的完整技术百科全书：\n\n- **532+ 个经过验证的技术\
    \ Demo**，覆盖 Kubernetes、AI/ML、Go、Node.js、Java、Python、数据库、Linux 等 12 大技术栈\n- **智能化 CLI 工具** (`opendemo-cli`)，支持 Demo 搜索、AI\
    \ 自动生成、质量校验、README 自动同步\n- **每栈一套生产级命名规范** (`NAMING_CONVENTIONS.md`)，让团队协作零歧义\n- **每栈一份专业 CLI 速查表**，运维排障拿来即用\n- **四条体系化学习路径**，从初学者到\
    \ AI 工程师循序渐进\n\n> \U0001F310 **在线主页**: 打开 [`index.html`](./index.html) 即可浏览本项目的可视化主页。\n> \U0001F310 **Bilingual**: 主页支持一键\
    \ **中文 / English** 切换。\n\n---\n\n## \U0001F680 快速开始\n\n### 1. 浏览项目主页\n\n```bash\n# 方式一：直接用浏览器打开\nopen index.html\n\n#\
    \ 方式二：启动本地服务器\npython -m http.server 8080\n# 然后访问 http://localhost:8080\n```\n\n### 2. 探索主项目\n\n```bash\n# 克隆主仓库\ngit\
    \ clone https://github.com/opendemo/opendemo.git\ncd opendemo\n\n# 查看项目结构\ntree -L 2\n\n# 安装并使用 CLI 工具\ncd opendemo-cli\n\
    pip install -e .\nopendemo --help\n```\n\n### 3. CLI 常用命令\n\n```bash\n# 搜索 Demo\nopendemo search \"goroutines\" --stack\
    \ go\n\n# AI 生成新 Demo\nopendemo generate kubernetes \"canary-deployment\"\n\n# 质量校验\nopendemo verify --auto-fix\n\n# 列出某技术栈全部\
    \ Demo\nopendemo list demos --stack python\n```\n\n---\n\n## ✨ 核心亮点\n\n| 特性 | 说明 |\n|------|------|\n| \U0001F9E0 **AI\
    \ 智能生成 Demo** | 输入主题即可自动生成完整代码、配置、文档与元数据 |\n| \U0001F50D **多维度智能检索** | 按技术栈、关键词、难度、时长精准定位，支持 weighted scoring |\n| ✅ **质量校验与自动化**\
    \ | 自动检查代码规范、README 完整性、元数据一致性，支持一键修复 |\n| \U0001F4CB **统一命名规范** | 每技术栈配备生产环境级命名规范，保障团队协作 |\n| ⚡ **CLI 速查表** | k8s-cli、linux-cli、database-cli\
    \ 等专业命令行速查表 |\n| \U0001F6E4️ **体系化学习路径** | 初学者 → 全栈 → 企业级 → AI 工程师，成长路线清晰 |\n| \U0001F310 **双语主页** | 项目主页支持一键 **中文 / English**\
    \ 切换，服务全球开发者 |\n\n---\n\n## \U0001F3D7️ 技术栈覆盖\n\n| 技术栈 | Demo 数量 | 特色亮点 |\n|--------|----------|----------|\n| **Kubernetes**\
    \ | 170 | 云原生编排、Kubeflow、LLMOps、Operator、服务网格 |\n| **Go** | 95 | 并发编程、微服务、性能优化、云原生工具链 |\n| **Node.js** | 71 | 全栈 Web、实时通信、部署运维、限流熔断\
    \ |\n| **Python** | 56 | 数据科学、异步编程、系统工具、测试实践 |\n| **Database** | 38 | 高可用架构、性能优化、容灾备份、云数据库 |\n| **Java** | 23 | 面向对象、JVM\
    \ 诊断、企业级开发规范 |\n| **Linux** | 19 | 系统监控、网络诊断、生产运维、安全日志 |\n| **AI / ML** | 15 | LLM 训练/微调/推理/运维、MLOps、RAG、联邦学习 |\n| **Container**\
    \ | 8 | Docker、Containerd、RunC 容器化最佳实践 |\n| **Traffic** | 8 | Nginx、HAProxy、Higress 负载均衡与 API 网关 |\n| **Monitoring** |\
    \ 7 | Prometheus、Grafana、ELK/EFK、可观测性 |\n| **Messaging** | 4 | RocketMQ 消息队列、事务消息、延迟消息 |\n\n> 数据来源: [`opendemo/README.md`](https://github.com/opendemo/opendemo/blob/main/README.md)\
    \ 与 [`DETAILED_STRUCTURE.md`](https://github.com/opendemo/opendemo/blob/main/DETAILED_STRUCTURE.md)\n\n---\n\n## \U0001F3DB\
    ️ 平台架构\n\nOpenDemo 采用 **搜索 → 生成 → 验证 → 同步** 的四位一体工作流：\n\n```\n┌─────────────┐    ┌─────────────┐    ┌─────────────┐  \
    \  ┌─────────────┐\n│ DemoSearch  │ → │ DemoGenerator│ → │ DemoVerifier│ → │ReadmeUpdater│\n│  智能检索    │    │  AI 自动生成\
    \ │    │  质量校验    │    │ README 同步  │\n└─────────────┘    └─────────────┘    └─────────────┘    └─────────────┘\n```\n\
    \n核心模块：\n- **`DemoSearch`** — 基于 weighted scoring 的多维度搜索引擎\n- **`DemoGenerator`** — 协调 AI 服务自动生成 Demo 内容与元数据\n- **`DemoVerifier`**\
    \ — 校验代码、文档与配置的规范性与一致性\n- **`QualityChecker`** — 评估 Demo 完整度、清晰度与生产相关性\n- **`ReadmeUpdater`** — 自动将新 Demo 汇总到主文档与交叉索引\n\
    \n---\n\n<a name=\"learning-paths\"></a>\n## \U0001F6E4️ 学习路径推荐\n\n### \U0001F393 初学者路径（3-6 个月）\n```\nLinux 基础 → Python\
    \ 入门 → 数据库基础 → Node.js Web 开发\n```\n适合零基础，快速建立系统操作能力与编程思维。\n\n### \U0001F4BC 全栈开发者路径（6-12 个月）\n```\nNode.js 全套 → Go 后端\
    \ → 数据库优化 → Kubernetes → AI/ML 入门\n```\n构建端到端交付能力，从 Web 开发到云原生部署全覆盖。\n\n### \U0001F3E2 企业级开发者路径（12-18 个月）\n```\nJava 企业级\
    \ → 微服务架构 → 数据库高可用 → 监控运维 → 安全合规\n```\n掌握大规模系统设计，聚焦高可用、可观测性与企业标准。\n\n### \U0001F680 AI 工程师路径（18-24 个月）\n```\n数学基础 → 深度学习\
    \ → LLM 训练 → MLOps → 模型部署\n```\n从算法到工程化全链路覆盖，聚焦大模型训练、推理与服务化。\n\n---\n\n## \U0001F4C1 目录映射\n\n本仓库 (`opendemo-work`) 为项目主页与入口仓库，核心代码与\
    \ Demo 位于主仓库：\n\n| 本仓库 | 主仓库对应路径 | 说明 |\n|--------|---------------|------|\n| `index.html` | — | 本项目的可视化主页 |\n| `assets/`\
    \ | — | 主页样式与静态资源 |\n| `README.md` | `opendemo/README.md` | 主项目总览文档 |\n| — | `opendemo/opendemo-cli/` | 智能化 CLI 工具 |\n\
    | — | `opendemo/DETAILED_STRUCTURE.md` | 完整目录结构清单 |\n| — | `opendemo/PROJECT_STRUCTURE_ANALYSIS_REPORT.md` | 架构深度分析报告\
    \ |\n\n---\n\n<a name=\"contribute\"></a>\n## \U0001F91D 参与贡献\n\nOpenDemo 是一个开放共建的项目，欢迎各种形式的贡献：\n\n- \U0001F41B **Bug\
    \ 修复** — 完善现有 Demo 的功能和稳定性\n- ✨ **新示例添加** — 补充各技术栈的实用案例\n- \U0001F4DA **文档优化** — 改进 README、命名规范与使用说明\n- \U0001F527 **工具改进**\
    \ — 优化 opendemo-cli 与自动化脚本\n- \U0001F3A8 **体验提升** — 改善项目结构、主页设计与用户界面\n\n### 贡献步骤\n\n1. Fork 主仓库 [`opendemo/opendemo`](https://github.com/opendemo/opendemo)\n\
    2. 创建你的功能分支 (`git checkout -b feature/amazing-demo`)\n3. 提交更改 (`git commit -m 'Add some amazing demo'`)\n4. 推送分支 (`git\
    \ push origin feature/amazing-demo`)\n5. 开启一个 Pull Request\n\n---\n\n## \U0001F4C4 许可证\n\n本项目采用 [MIT License](https://github.com/opendemo/opendemo/blob/main/LICENSE)\
    \ 开源许可证。\n\n---\n\n<p align=\"center\">\n  Made with ❤️ by the OpenDemo Community\n</p>\n"
