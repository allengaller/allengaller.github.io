    \n---\n\n## 交叉引用矩阵\n\n每个主题文档的末尾列出了与其它模块的衔接。以下为主要交叉路径：\n\n- **资产定价 ↔ 公司金融**：CAPM → 权益资本成本 → WACC\n- **信息经济学 ↔ 公司金融 ↔ 金融市场**：信号传递\
    \ → 资本结构 / 股利\n- **博弈论 ↔ 市场微观结构**：Kyle 模型、拍卖理论\n- **时间序列 ↔ 风险管理**：GARCH → VaR\n- **随机过程 ↔ 衍生品定价**：伊藤引理 → BS 公式\n- **区块链\
    \ ↔ DeFi ↔ 金融监管**：智能合约 → 协议 → 监管边界\n- **数字支付 ↔ 金融包容性**：移动货币 → 普惠金融\n- **绿色金融 ↔ 风险管理**：气候压力测试\n\n---\n\n## 模块依赖关系\n\n```\n\
