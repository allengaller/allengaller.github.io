  description: '# lolipop-database'
  readme_excerpt: '# lolipop-database'
  readme_full: '# lolipop-database


    > **私有仓库**。成人虚构文学创作数据库：原创作品库 + 写作研究知识库 + 外部参考样本池。所有内容为虚构创作，角色设定均为成年。

    >

    > 本 README 为 2026-07-30 新增的全库导航入口（此前仓库无根级 README），只做导航与规约声明，不含正文内容。


    ## 目录地图


    | 目录 | 定位 | 权威索引入口 |

    |---|---|---|

    | `novel/` | **原创作品库**（14 个作品目录，长篇/中篇/草稿分级管理） | [`novel/精选作品索引.md`](novel/精选作品索引.md) |

    | `research/` | **写作研究知识库**（核心层 + 叙事与市场层 + 主题设计层 + 主题桥接层） | [`research/研究索引与概述.md`](research/研究索引与概述.md)、[`research/主题交叉引用指南.md`](research/主题交叉引用指南.md)
    |

    | `resource/` | **外部抓取样本池**（公开成人社区/小说站原文，供研究回溯出处） | [`resource/来源说明-总览.md`](resource/来源说明-总览.md) → [`resource/来源说明.md`](resource/来源说明.md)、[`resource/list.md`](resource/list.md)
    |

    | `tools/` | **仓库维护工具**（一致性校验等，只读脚本） | [`tools/README.md`](tools/README.md) |


    ## 三层关系


    ```

    resource/（外部样本，IP 为他人所有） ──提炼──▶ research/（方法论知识库） ──支撑──▶ novel/（原创作品）

    ```


    - `novel/` 是原创区；`resource/` 是抓取池，两者 IP 性质不同，**严禁混放**。

    - `research/` 中引用的「原文」一律回 `resource/` 检索；`research/原文/` 是历史别名路径，物理上不存在。


    ## 维护规约（全库）


    1. **合规**：本仓库必须保持 **Private**。`resource/` 含第三方版权内容，不得公开、不得转发布。

    2. **只增不删**：不删除或缩减现有内容；确需清理时仅限「经 sha256 核实的完全重复」且先在索引登记。

    3. **索引同步**：`novel/` 有新增/大改动时，必须同步更新 `novel/精选作品索引.md`（含编号、完成度、字数、镜像登记）。`research/` 的修改遵循 [`research/AGENTS.md`](research/AGENTS.md)。

    4. **提交前校验**：运行 `python3 tools/validate_repo.py`，退出码为 0 方可提交。

    5. **提交信息**：不要再用裸 "update"；采用 `范围: 摘要` 格式（如 `novel(泰德): 补登精选作品索引`、`tools: 新增校验脚本`）。

    6. **来源登记**：`resource/` 新增抓取只追加进 `来源说明.md` 主文件，不新建「来源说明 N」；缺章情况登记进 `缺章记录.md`。


    ## 已知结构事实（避免重复排查）


    - `四喜/` 是 `遥远的救世主/` 的镜像别名，**主合并文件已分叉**（权威版 = `遥远的救世主/`，详见精选作品索引「镜像清单」）。

    - `梅梅/` ≡ `午后/`、`林小雨/` 双文件名等镜像关系均在精选作品索引登记，属有意保留。

    - `江城肉文二十五/_archive-*` 目录是历史归档快照，与 `暗室/`、`第一次交换/` 等存在有意的重复副本，不视为待清理项。

    - 根目录 `append_samples.py` 是 2026-07-15 知识库扩容时的一次性数据脚本，**任务已完成，请勿再次运行**（无幂等保护，重跑会重复追加内容）；保留仅作历史记录。


    ## 维护历史备忘


    - 2026-07-30：新增根 README、`.gitignore`（解除 32 个 `.DS_Store` 追踪）、`tools/validate_repo.py` 校验脚本、`resource/来源说明-总览.md`；补登《泰德》进精选作品索引；复核并登记
    saver-complete.md 镜像分叉事实；修复 `resource/reports/` 权限异常。

    '
