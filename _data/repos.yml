  readme_full: '# x-database


    > **项目性质声明**：本仓库为 **AI 辅助生成的成人情色文化知识库与创作素材库**，涵盖 BDSM、NTR、Swinger 等亚文化主题的笔记、综述与虚构叙事。内容以半学术包装呈现，但**未经同行评议，不构成可引用的学术成果**。`学术研究/`
    目录为正在建设的严肃学术研究分支，与主库严格隔离。


    ---


    ## 必读规范（贡献者与 AI 助手）


    | 文档 | 适用范围 | 作用 |

    |------|----------|------|

    | [`CONTRIBUTING.md`](CONTRIBUTING.md) | 全库 | 贡献流程、内容标准、PR 规范 |

    | [`伦理声明.md`](伦理声明.md) | 全库 | 内容伦理边界与红线 |

    | [`GLOSSARY.md`](GLOSSARY.md) | 全库 | 项目核心术语（XP、四域同构、TPE、ENM 等） |


    ---


    ## 目录结构（v7.0 — 大规模扩充，2026-07-19）


    ```

    x-database/

    ├── README.md                # 本文件

    ├── CONTRIBUTING.md          # 贡献指南

    ├── 伦理声明.md              # 内容伦理

    ├── GLOSSARY.md              # 核心术语表

    ├── CHANGELOG.md             # 全库变更日志

    ├── _侧边栏.md               # 侧边栏导航（Docsify）

    ├── .gitignore

    │

    │ ── 研究学科 ────────────────────────

    ├── 心理学/                  # 心理学（219 篇，23 个子目录）

    │   ├── 暗黑人格/ · 暴力与创伤/ · 犯罪心理/ · 理论框架/ · 临床特殊/

    │   ├── 发展心理学/ · 社会心理学/ · 认知心理学/ · 进化心理学/  ← 新增

    │   ├── 暴露癖/ · 窥阴障碍/ · 恋童障碍/ · 恋物障碍/

