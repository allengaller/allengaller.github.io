  description: '# Nerd Portal'
  readme_excerpt: '# Nerd Portal'
  readme_full: '# Nerd Portal


    > 文艺青年 × 资深极客 —— 一个 Chrome 新标签页的双面仪表盘


    每次打开新标签页，上半屏是诗、书摘、写作灵感，下半屏是 GitHub 热门、开发者工具箱、代码片段库、待办。

    一个浏览器的入口，同时容纳柔软与硬核。


    ![Nerd Portal](public/icons/icon-128.png)


    ## ✨ 功能


    **文艺区（上半屏）**


    | 模块 | 数据来源 | 说明 |

    | --- | --- | --- |

    | 每日一诗 | [今日诗词](https://www.jinrishici.com) `v1.jinrishici.com` | 随机一首古诗，可换一首 |

    | 书摘语录 | [一言](https://hitokoto.cn) `v1.hitokoto.cn` | 文学类随机名句 |

    | 写作灵感 | 本地内置 30 条 prompt + `chrome.storage` | 随机写作 prompt，随手记随笔 |

    | 每日壁纸 | [必应每日壁纸](https://dujin.org) | 作全局背景层（可在设置中关闭） |


    **极客区（下半屏）**


    | 模块 | 数据来源 | 说明 |

    | --- | --- | --- |

    | GitHub Trending | [GitHub Search API](https://docs.github.com/rest/search) | 近 7 天按 star 降序的热门新仓库 |

    | 开发者工具箱 | 纯前端 | 时间戳 ↔ 日期双向转换（JSON/正则/Base64 占位） |

    | 代码片段库 | `chrome.storage.local` | 本地 CRUD + 标签 + 全文搜索 + 复制 |

    | 待办 | `chrome.storage.local` | 最小 Todo（增删/完成） |


    所有数据本地存储，不出设备。


    ## 🛠 技术栈


    - Chrome Extension **MV3**（`chrome_url_overrides` 接管新标签页）

    - **React 18 + TypeScript + Vite**

    - **@crxjs/vite-plugin**（manifest + 多入口 + HMR）

    - **TailwindCSS** + **Zustand**（持久化到 `chrome.storage`）+ **lucide-react**


    ## 📖 详细部署手册


    从环境准备、开发、构建、加载到 Chrome、发布到商店、测试、排错，每一步都有详细说明：

    👉 **[DEPLOY.md](./DEPLOY.md)**


    ## 🚀 开发


    ```bash

    npm install      # 安装依赖

    npm run dev      # 开发模式（HMR），按控制台提示加载 dist/ 到 chrome://extensions

    npm run build    # 产出生产版 dist/

    ```


    ## 📦 在 Chrome 中加载


    1. `npm run build`

    2. 打开 `chrome://extensions`

    3. 右上角开启「开发者模式」

    4. 点「加载已解压」，选择项目下的 `dist/` 目录

    5. 打开一个新标签页，即可看到仪表盘


    > 设置入口：仪表盘右上角「设置」按钮，或扩展管理页的「详情 → 扩展程序选项」。


    ## 📁 项目结构


    ```

    src/

    ├── newtab/          # 新标签页（仪表盘入口）

    ├── options/         # 设置页

    ├── components/

    │   ├── layout/      # Dashboard / Background

    │   ├── literary/    # 文艺区组件

    │   ├── geek/        # 极客区组件

    │   └── ui/          # Card / Button / Input

    ├── store/           # Zustand stores（持久化）

    ├── lib/             # api / storage 封装

    ├── hooks/           # useAsync

    └── types/           # 类型定义

    ```


    ## 📝 关于 `archive/`


    仓库根目录的 `archive/` 是本项目的前身——一个老的 CakePHP（web + mobile）门户，

    现已归档不再维护，仅作历史保留。


    ## 📜 License


    MIT

    '
