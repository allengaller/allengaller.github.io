    [![Go Report Card](https://goreportcard.com/badge/github.com/etcdguardian/etcdguardian)](https://goreportcard.com/report/github.com/etcdguardian/etcdguardian)\n\
    [![Release](https://img.shields.io/github/release/etcdguardian/etcdguardian.svg)](https://github.com/etcdguardian/etcdguardian/releases)\n\
    \n**EtcdGuardian** 是一个生产级的 Kubernetes Operator，专注于解决 Velero 在 etcd 备份领域的核心局限性。提供直接的 etcd 快照、增量备份、多租户隔离、托管 Kubernetes 支持和智能调度优化。\n\
    \n## ✨ 核心特性\n\n### \U0001F3AF 解决 Velero 的核心痛点\n\n- **直接 etcd 备份**：捕获完整的内部状态（历史修订、compaction 元数据、低级配置）\n- **托管 Kubernetes\
    \ 兼容**：支持 EKS、GKE、ACK 等托管环境的代理模式\n- **自动验证机制**：快照完整性检查、一致性验证、哈希校验\n- **增量备份支持**：基于 etcd watch API 的高效增量快照\n- **性能优化**：流式传输、并发处理，支持大规模\
    \ etcd（10GB+）\n\n### \U0001F680 企业级功能\n\n- **多租户隔离**：基于 RBAC 的命名空间级备份权限控制\n- **多云存储**：支持 S3、阿里云 OSS、GCS、Azure Blob\n-\
    \ **加密支持**：客户端加密、KMS 集成（AWS KMS、阿里云 KMS）\n- **Velero 集成**：与 Velero 深度集成，同时保持独立运行能力\n- **智能调度**：AI 驱动的备份频率优化（可选）\n- **监控告警**：Prometheus\
    \ 指标导出、多渠道告警（Slack、Email）\n- **Web UI 管理**：直观的 Web 界面，支持备份、恢复、调度的全生命周期管理\n- **实时状态监控**：实时显示系统状态、备份进度和历史记录\n\n### \U0001F310\
    \ 阿里云特别支持\n\n- **ACK 托管环境**：针对阿里云容器服务的代理模式和兼容性优化\n- **OSS 存储**：分片上传优化、RAM 角色认证、KMS 服务端加密\n- **跨地域迁移**：支持 ACK 集群的跨地域备份和恢复\n\
    \n## \U0001F4CB 快速开始\n\n### 前置要求\n\n- Kubernetes 集群（v1.21+）\n- kubectl 已配置\n- Helm 3.x（用于部署）\n- 对象存储账号（S3/OSS/GCS/Azure）\n\
    \n### 安装\n\n#### 方式 1：使用 Helm（推荐）\n\n```bash\n# 添加 Helm 仓库\nhelm repo add etcdguardian https://etcdguardian.io/charts\n\
    helm repo update\n\n# 安装 EtcdGuardian Operator\nhelm install etcdguardian etcdguardian/etcdguardian \\\n  --namespace\
    \ etcd-guardian-system \\\n  --create-namespace \\\n  --set storage.oss.enabled=true \\\n  --set storage.oss.bucket=my-etcd-backups\
    \ \\\n  --set storage.oss.region=cn-hangzhou\n```\n\n#### 方式 2：从源码安装\n\n```bash\n# 克隆仓库\ngit clone https://github.com/etcdguardian/etcdguardian.git\n\
    cd etcdguardian\n\n# 安装 CRDs\nmake install\n\n# 部署 Operator\nmake deploy IMG=etcdguardian/operator:latest\n```\n\n###\
    \ 创建第一个备份\n\n#### 1. 准备存储凭证\n\n```bash\n# 对于 S3\nkubectl create secret generic s3-credentials \\\n  --from-literal=access-key-id=<YOUR_ACCESS_KEY>\
    \ \\\n  --from-literal=secret-access-key=<YOUR_SECRET_KEY> \\\n  -n etcd-guardian-system\n\n# 对于阿里云 OSS\nkubectl create\
    \ secret generic oss-credentials \\\n  --from-literal=access-key-id=<YOUR_ALIYUN_AK> \\\n  --from-literal=access-key-secret=<YOUR_ALIYUN_SK>\
    \ \\\n  -n etcd-guardian-system\n```\n\n#### 2. 创建备份资源\n\n```yaml\napiVersion: etcdguardian.io/v1alpha1\nkind: EtcdBackup\n\
    metadata:\n  name: daily-backup\n  namespace: etcd-guardian-system\nspec:\n  backupMode: Full\n  storageLocation:\n  \
    \  provider: OSS\n    bucket: my-etcd-backups\n    region: cn-hangzhou\n    credentialsSecret: oss-credentials\n  validation:\n\
    \    enabled: true\n    consistencyCheck: true\n  retentionPolicy:\n    maxBackups: 30\n    maxAge: 720h\n```\n\n```bash\n\
    kubectl apply -f backup.yaml\n```\n\n#### 3. 查看备份状态\n\n```bash\nkubectl get etcdbackup -n etcd-guardian-system\nkubectl\
    \ describe etcdbackup daily-backup -n etcd-guardian-system\n```\n\n### 从备份恢复\n\n```yaml\napiVersion: etcdguardian.io/v1alpha1\n\
    kind: EtcdRestore\nmetadata:\n  name: restore-from-incident\n  namespace: etcd-guardian-system\nspec:\n  backupName: daily-backup\n\
    \  restoreMode: Full\n  etcdCluster:\n    endpoints:\n      - https://etcd-0:2379\n      - https://etcd-1:2379\n     \
    \ - https://etcd-2:2379\n    dataDir: /var/lib/etcd\n  quiesceCluster: true\n```\n\n### Web UI 使用\n\n#### 启动后端 API 服务\n\
    \n```bash\n# 进入后端目录\ncd backend\n\n# 安装依赖\ngo mod tidy\n\n# 启动 API 服务\ngo run main.go\n```\n\n#### 启动前端 Web UI\n\n```bash\n\
    # 进入前端目录\ncd web-ui\n\n# 安装依赖\nnpm install\n\n# 启动开发服务器\nnpm run dev\n```\n\n#### 访问 Web UI\n\n打开浏览器，访问 `http://localhost:5173`\
    \ 即可进入 Etcd Guardian Web UI。\n\n#### Web UI 功能\n\n- **Dashboard**：系统概览、关键指标、最近备份和调度信息\n- **Backups**：备份列表、备份详情、备份创建和管理\n\
    - **Restores**：恢复列表、恢复详情、恢复创建和管理\n- **Schedules**：调度列表、调度创建、编辑和立即运行\n\n## \U0001F4CA 架构概览\n\n```mermaid\ngraph TB\n  \
    \  subgraph \"用户交互层\"\n        CLI[CLI工具]\n        K8S_API[Kubernetes API]\n        WEB_UI[Web UI]\n    end\n\n    subgraph\
    \ \"控制平面\"\n        BACKUP_CTRL[Backup Controller]\n        RESTORE_CTRL[Restore Controller]\n        SCHEDULE_CTRL[Schedule\
    \ Controller]\n        API_SERVER[API Server]\n    end\n\n    subgraph \"执行层\"\n        SNAPSHOT[快照引擎]\n        VALIDATE[验证引擎]\n\
    \        PROXY[代理模式]\n    end\n\n    subgraph \"存储层\"\n        S3[S3 Storage]\n        OSS[OSS Storage]\n        GCS[GCS\
    \ Storage]\n    end\n\n    CLI --> BACKUP_CTRL\n    K8S_API --> BACKUP_CTRL\n    WEB_UI --> API_SERVER\n    API_SERVER\
    \ --> BACKUP_CTRL\n    API_SERVER --> RESTORE_CTRL\n    API_SERVER --> SCHEDULE_CTRL\n    BACKUP_CTRL --> SNAPSHOT\n \
    \   SNAPSHOT --> VALIDATE\n    VALIDATE --> S3\n    VALIDATE --> OSS\n    VALIDATE --> GCS\n```\n\n## \U0001F4D6 使用示例\n\
    \n### 周期性备份\n\n```yaml\napiVersion: etcdguardian.io/v1alpha1\nkind: EtcdBackupSchedule\nmetadata:\n  name: hourly-backup\n\
    spec:\n  schedule: \"0 * * * *\"  # 每小时执行\n  backupTemplate:\n    spec:\n      backupMode: Incremental\n      storageLocation:\n\
    \        provider: S3\n        bucket: my-backups\n        region: us-east-1\n        credentialsSecret: s3-creds\n  aiOptimization:\n\
    \    enabled: true\n    minInterval: 1h\n    maxInterval: 6h\n```\n\n### 多租户备份\n\n```yaml\napiVersion: etcdguardian.io/v1alpha1\n\
    kind: EtcdBackup\nmetadata:\n  name: team-a-backup\n  namespace: team-a\nspec:\n  backupMode: Full\n  namespaceSelector:\n\
    \    matchLabels:\n      team: team-a\n  storageLocation:\n    provider: OSS\n    bucket: team-a-backups\n    region:\
    \ cn-shanghai\n    credentialsSecret: team-a-creds\n```\n\n### Velero 集成\n\n```yaml\napiVersion: etcdguardian.io/v1alpha1\n\
    kind: EtcdBackup\nmetadata:\n  name: full-cluster-backup\nspec:\n  backupMode: Full\n  storageLocation:\n    provider:\
    \ S3\n    bucket: cluster-backups\n    region: us-west-2\n    credentialsSecret: s3-creds\n  veleroIntegration:\n    enabled:\
    \ true\n    backupName: velero-backup-20260112\n```\n\n## \U0001F527 配置选项\n\n### 存储后端配置\n\n#### S3 Compatible\n\n```yaml\n\
    storageLocation:\n  provider: S3\n  bucket: my-bucket\n  region: us-east-1\n  endpoint: https://minio.example.com  # 可选，用于\
    \ MinIO\n  credentialsSecret: s3-credentials\n```\n\n#### 阿里云 OSS\n\n```yaml\nstorageLocation:\n  provider: OSS\n  bucket:\
    \ my-oss-bucket\n  region: cn-hangzhou\n  credentialsSecret: oss-credentials\nencryption:\n  enabled: true\n  kmsKeyID:\
    \ \"acs:kms:cn-hangzhou:123456:key/abc-def\"\n```\n\n### 加密配置\n\n```yaml\nencryption:\n  enabled: true\n  kmsKeyID: \"\
    arn:aws:kms:us-east-1:123456789:key/abc-def\"  # 使用 KMS\n  # OR\n  encryptionSecret: my-encryption-key  # 客户端加密\n```\n\
    \n## \U0001F50D 监控与告警\n\n### Prometheus 指标\n\nEtcdGuardian 导出以下指标：\n\n- `etcdguardian_backup_duration_seconds` - 备份耗时\n\
    - `etcdguardian_backup_size_bytes` - 快照大小\n- `etcdguardian_backup_total` - 备份总数（按状态）\n- `etcdguardian_etcd_db_size_bytes`\
    \ - etcd 数据库大小\n- `etcdguardian_validation_failures_total` - 验证失败次数\n\n### 告警配置\n\n```yaml\napiVersion: v1\nkind: ConfigMap\n\
    metadata:\n  name: etcdguardian-alerts\ndata:\n  alerts.yaml: |\n    groups:\n      - name: etcdguardian\n        rules:\n\
    \          - alert: BackupFailure\n            expr: rate(etcdguardian_backup_total{status=\"failed\"}[5m]) > 0\n    \
    \        annotations:\n              summary: \"EtcdGuardian backup failed\"\n```\n\n## \U0001F6E0️ 开发\n\n### 构建项目\n\n\
    ```bash\n# 安装依赖\ngo mod download\n\n# 生成代码\nmake generate\n\n# 生成 CRD manifests\nmake manifests\n\n# 构建二进制\nmake build\n\
    \n# 运行测试\nmake test\n\n# 构建 Docker 镜像\nmake docker-build IMG=etcdguardian/operator:dev\n```\n\n### 本地运行\n\n```bash\n#\
    \ 安装 CRDs 到集群\nmake install\n\n# 本地运行 Operator\nmake run\n```\n\n## \U0001F4DA 文档\n\n- [架构设计](.qoder/quests/etcd-disaster-recovery-optimization.md)\n\
    - [API 参考](https://pkg.go.dev/github.com/etcdguardian/etcdguardian)\n- [故障排查指南](docs/troubleshooting.md)\n- [性能调优](docs/performance.md)\n\
    \n## \U0001F91D 贡献\n\n欢迎贡献！请查看 [CONTRIBUTING.md](CONTRIBUTING.md) 了解详情。\n\n### 开发指南\n\n1. Fork 本仓库\n2. 创建特性分支 (`git checkout\
    \ -b feature/amazing-feature`)\n3. 提交更改 (`git commit -m 'Add amazing feature'`)\n4. 推送到分支 (`git push origin feature/amazing-feature`)\n\
    5. 创建 Pull Request\n\n## \U0001F4DD 许可证\n\nApache License 2.0 - 详见 [LICENSE](LICENSE)\n\n## \U0001F64F 致谢\n\n- [Velero](https://velero.io/)\
    \ - 启发了本项目的设计\n- [etcd](https://etcd.io/) - 核心依赖\n- [Operator SDK](https://sdk.operatorframework.io/) - Operator 框架\n\n\
    ## \U0001F4E7 联系方式\n\n- Issue Tracker: https://github.com/etcdguardian/etcdguardian/issues\n- Discussions: https://github.com/etcdguardian/etcdguardian/discussions\n\
    \n---\n\n**注意**：本项目当前处于活跃开发阶段。核心功能已实现，但部分高级特性仍在完善中。欢迎贡献和反馈！\n"
