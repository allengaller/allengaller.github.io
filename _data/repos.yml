    - [本地 Gitbook](#本地-gitbook)\n- [变更历史](#变更历史)\n\n---\n\n## 项目定位\n\nKusheet 是面向**生产环境**的 Kubernetes + AI Infrastructure\
    \ 运维全域知识库，涵盖从基础架构到 AI/LLM 工作负载的完整技术栈。\n\n| 特性 | 说明 |\n|:---|:---|\n| **生产级配置** | 所有 YAML/Shell 示例可直接用于生产环境 |\n| **AI Infra专题**\
    \ | 覆盖GPU调度、分布式训练、模型服务、成本优化 |\n| **企业级运维** | 包含监控告警、日志分析、镜像管理、CI/CD等企业级平台 |\n| **多维度索引** | 按技术域、场景、角色、组件快速定位 |\n| **深度解析**\
    \ | 控制平面组件源码级剖析、CRI/CSI/CNI接口详解 |\n\n---\n\n## 快速导航(按角色)\n\n| 角色 | 推荐起点 | 核心关注域 |\n|:---|:---|:---|\n| **开发者** | [05-kubectl](#域1-架构基础-architecture-fundamentals)\
