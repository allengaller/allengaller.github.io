  description: '# Peace Lab Database (平静实验室知识库)'
  readme_excerpt: '# Peace Lab Database (平静实验室知识库)'
  readme_full: "# Peace Lab Database (平静实验室知识库)\n\n这是一个专业的、多维度的身心疗愈与个人进化知识体系。项目通过严谨的 **\"六大核心支柱 + 临床研究专题\"** 架构，整合了古代智慧传承、现代心理学、生命科学以及人文艺术实践。\n\
    \n---\n\n## \U0001F9ED 知识架构 (Architecture)\n*五大核心支柱 + 一个临床聚合层 (Five Pillars + One Clinical Layer；跨领域研究已并入 _meta 知识关联层)*\n\
    \n### 五大核心支柱 (The Five Pillars)\n\n### 1. [\U0001F3DB️ 智慧传承 (Wisdom Traditions)](01-智慧传统/INDEX.md)\n**核心领域**: 瑜伽哲学、禅宗/道家/佛教全体系、太极拳、黄帝内经养生、东西方古典哲学、全球灵性疗愈。\n\
    \n### 2. [\U0001F9E0 心智与心理学 (Mind & Psychology)](02-心智心理/INDEX.md)\n**核心领域**: 现代心理流派、临床干预(焦虑/创伤/成瘾/严重精神疾病)、冥想技术(坛城/直指/大师传承体系)、感官与循证疗法、自我调节技能(容纳/接地/自我安抚/自悲)、仇恨心理学、乡村心理学、贫困与苦难研究、自信心体系、婚姻冲突与离婚心理学、情感银行与亲子理解。\n\
    \n### 3. [\U0001F3C3 生命科学与生物医学 (Bio-Science & Medicine)](03-生命科学/INDEX.md)\n**核心领域**: 生物黑客(睡眠/断食/呼吸/血压调节)、神经科学(BCI/DMN)、身心能量恢复、办公健康(肩颈/眼部/睡前拉伸)、性学研究、营养学与死亡教育。\n\
    \n### 4. [\U0001F3A8 人文与艺术疗愈 (Humanities & Arts)](04-人文艺术/INDEX.md)\n**核心领域**: 艺术史与艺术疗法、芭蕾艺术全系、古典音乐疗愈、影音媒体与深度阅读。\n\n###\
    \ 5. [\U0001F331 实践与个人增长 (Praxis & Growth)](05-实践成长/INDEX.md)\n**核心领域**: 超级个体商业模式、工作效率与执行力、心力成长与稳定内核、高效沟通与结构化表达、心流与专注力、自媒体变现、创意/技术写作、TED/一席精品讲座知识框架(150+领域)、个人任务管理、每日打卡、日记写作。\n\
    \n### 跨域聚合层 (Cross-Domain Aggregation Layers)\n\n### 6. [\U0001F3E5 临床专题 (Clinical Topics)](06-临床专题/INDEX.md)\n**核心领域**:\
    \ 跨支柱临床知识包 —— 焦虑、抑郁、睡眠障碍、哀伤丧亲、拖延症、MBCT 正念认知疗法，按疾病/问题维度聚合，面向临床实践。\n\n> \U0001F52C **跨领域课题研究 (research-topics)** 已降级并入 `_元信息/`\
    \ 知识关联层：[research-topics](_meta/research-topics/INDEX.md) —— 意识科学、具身认知、冥想科学、整合医学、创伤身心、文化心理学六大前沿交叉研究。\n\n---\n\n## \U0001F4DA\
    \ 快速导航 (Quick Navigation)\n\n| 导航 | 说明 |\n|------|------|\n| [\U0001F4D6 分类法与架构说明](_meta/docs/TAXONOMY.md) | 五大支柱的分类原则与决策树\
    \ |\n| [\U0001F4DD 贡献指南](_meta/docs/CONTRIBUTING.md) | 目录规范、文件命名与文档标准 |\n| [\U0001F524 全局术语表](_meta/docs/GLOSSARY.md)\
    \ | 核心术语中英文映射 |\n| [\U0001F5FA️ 学习路径](_meta/INDEX.md) | 跨支柱的主题化推荐阅读路线 |\n| [\U0001F517 交叉引用索引](_meta/cross-references.md)\
    \ | 跨支柱关联内容 |\n| \U0001F527 工具与脚本 | 质量检查、链接验证等自动化工具 |\n| \U0001F310 Web 站点 | 在线浏览版本 |\n| [\U0001F916 Agent Skills 智能体技能](02-心智心理/心理学/压力与HPA轴/技能/INDEX.md)\
    \ | 压力与HPA轴调节智能体技能模块 |\n\n---\n\n## \U0001F916 Agent Skills — 智能体技能模块\n\n本项目不仅提供知识文档，还包含可直接供 AI 智能体使用的 **结构化技能模块（Agent\
    \ Skills）**。智能体通过调用这些技能，可对用户的心理健康问题进行评估、决策辅助和干预指导。\n\n### 设计理念\n\nAgent Skills 遵循以下设计原则：\n\n| 原则 | 说明 |\n|:-----|:-----|\n\
    | **决策树驱动** | 每个技能包含清晰的判断流程，智能体可据此与用户交互 |\n| **结构化输出** | 评估报告模板化，生成规范、一致的专业输出 |\n| **技能链接** | 明确标注何时应触发其他技能，支持多技能协同 |\n\
    | **转介指征** | 内置医疗/专业转介红线识别，防止延误就医 |\n| **使用示例** | 每个技能提供真实场景的评估和方案生成示例 |\n\n### 技能调用示例\n\n```\n用户: \"我最近工作压力特别大，已经一个月了，睡不好白天很累\"\
    \n\n智能体调用流程:\n1. → Stress_Assessment_Skill\n   收集信息 → 分类为亚慢性/慢性压力\n2. → Cortisol_Management_Skill / Cortisol_Rhythm_Assessment_Skill\n\
    \   判断皮质醇状态（可能存在节律紊乱）\n3. → Chronic_Stress_Intervention_Skill\n   根据严重程度选择干预层级\n4. → Relaxation_Techniques_Guide_Skill\n\
    \   提供具体放松技术方案\n```\n\n### 当前已上线的 Agent Skills\n\n#### 压力与 HPA 轴模块 (`02-心智心理/心理学/压力与HPA轴/技能/`)\n\n| 技能 | 功能 | 适用场景 |\n\
    |:-----|:-----|:---------|\n| `Stress_Assessment_Skill.md` | 压力状态综合评估 | \"我感觉压力很大\" |\n| `Cortisol_Rhythm_Assessment_Skill.md`\
    \ | 皮质醇节律评估 | \"如何判断皮质醇是否正常\" |\n| `Cortisol_Management_Skill.md` | 皮质醇调节方案 | \"怎么自然降低皮质醇\" |\n| `Chronic_Stress_Intervention_Skill.md`\
    \ | 慢性压力干预决策 | \"有什么方法减轻压力\" |\n| `HPA_Axis_Regulation_Skill.md` | HPA轴功能调节 | \"如何调节HPA轴功能\" |\n| `CFS_Recognition_Skill.md`\
    \ | 慢性疲劳综合征识别 | \"我总是很累是不是CFS\" |\n| `Stress_Health_Risk_Assessment_Skill.md` | 压力相关健康风险 | \"长期压力对身体的影响\" |\n| `Stress_Diary_Analysis_Skill.md`\
    \ | 压力日记分析 | \"帮我分析我的压力日记\" |\n| `Relaxation_Techniques_Guide_Skill.md` | 放松技术指导 | \"有什么放松方法\" |\n\n#### 抑郁评估模块 (`02-心智心理/心理学/临床/抑郁/技能/`)\n\
    \n| 技能 | 功能 | 适用场景 |\n|:-----|:-----|:---------|\n| `Depression_Assessment_Skill.md` | 抑郁状态综合评估（PHQ-9） | \"我最近情绪很低落\"\
    \ |\n\n#### 创伤评估模块 (`02-心智心理/心理学/临床/创伤/技能/`)\n\n| 技能 | 功能 | 适用场景 |\n|:-----|:-----|:---------|\n| `Trauma_Assessment_Skill.md`\
    \ | 创伤与应激评估（PCL-5） | \"我总是做噩梦/闪回\" |\n\n#### 失眠评估模块 (`02-心智心理/心理学/躯体身心/睡眠/技能/`)\n\n| 技能 | 功能 | 适用场景 |\n|:-----|:-----|:---------|\n\
    | `Insomnia_Assessment_Skill.md` | 失眠与睡眠质量评估（ISI） | \"我失眠睡不着\" |\n\n#### 积极心理学模块 (`02-心智心理/心理学/基础/positive心理学/技能/`)\n\n\
    | 技能 | 功能 | 适用场景 |\n|:-----|:-----|:---------|\n| `Wellbeing_Assessment_Skill.md` | 幸福感与积极心理评估（PERMA/SWLS/VIA） | \"我想提升幸福感\"\
    \ |\n\n#### 职业倦怠模块 (`02-心智心理/心理学/应用心理/职场心理危机/技能/`)\n\n| 技能 | 功能 | 适用场景 |\n|:-----|:-----|:---------|\n| `Burnout_Assessment_Skill.md`\
    \ | 职业倦怠评估（MBI/JD-R） | \"上班没动力/职业倦怠\" |\n\n#### 领导力模块 (`05-实践成长/个人发展/superindividual/技能/`)\n\n| 技能 | 功能 | 适用场景 |\n|:-----|:-----|:---------|\n\
    | `Leadership_Assessment_Skill.md` | 领导力与影响力评估（Goleman/Cialdini） | \"如何提升领导力\" |\n\n#### 成瘾评估模块 (`02-心智心理/心理学/行为心理/成瘾/技能/`)\n\
    \n| 技能 | 功能 | 适用场景 |\n|:-----|:-----|:---------|\n| `Addiction_Assessment_Skill.md` | 成瘾行为评估（AUDIT/DAST/ASI） | \"我戒不掉酒/游戏/手机\"\
    \ |\n\n#### 亲密关系模块 (`02-心智心理/关系/临床实践/技能/`)\n\n| 技能 | 功能 | 适用场景 |\n|:-----|:-----|:---------|\n| `Relationship_Assessment_Skill.md`\
    \ | 亲密关系质量评估（CSI/ECR-R/Gottman） | \"感情出了问题\" |\n\n#### 自尊评估模块 (`02-心智心理/心理学/selfregulation/selfconfidence/技能/`)\n\n| 技能\
    \ | 功能 | 适用场景 |\n|:-----|:-----|:---------|\n| `Self_Esteem_Assessment_Skill.md` | 自尊与自我价值评估（RSES/SCS） | \"我很自卑\" |\n\n\
    ### 扩展计划\n\n| 计划 | 说明 |\n|:-----|:-----|\n| 焦虑与反焦虑模块 | 已在 `selfregulation/anti焦虑/` 上线 |\n| 强迫症与反强迫症模块 | 已在 `selfregulation/anti强迫症/`\
    \ 上线 |\n| 拖延与反拖延症模块 | 已在 `行为心理/anti拖延症/` 上线 |\n| 玻璃心与反玻璃心模块 | 已在 `selfregulation/韧性fragileego/` 上线 |\n\n### 智能体使用注意事项\n\
    \n- Agent Skills 提供**方向性评估和建议**，不替代医学诊断\n- 如智能体识别到红旗症状（如严重疲劳、PEM、持续失眠等），应建议用户寻求医疗专业人士帮助\n- 干预强度和频率应根据用户反馈动态调整\n- 所有建议应与用户的价值观和偏好协调\n\
    \n---\n\n## 项目统计 (Statistics)\n\n> \U0001F4CA 数据由 `Tools/scripts/readme-stats.py` 自动生成（2026-06），请勿手动编辑。\n\n- **专题领域**:\
    \ 559+\n- **专业文档**: 4,094+\n- **核心行数**: 915,107+\n- **更新频率**: 每日迭代 (Daily Iteration)\n\n\n## 最近更新 (Recent Updates)\n\n\
    > 完整更新记录请查看 **[CHANGELOG](Tools/CHANGELOG.md)**\n\n---\n*本项目由 Peace Lab Global 维护，旨在为现代人提供多维度的认知工具与身心解决方案。*\n\n[![License:\
    \ CC BY-NC-SA 4.0](https://img.shields.io/badge/License-CC%20BY--NC--SA%204.0-lightgrey.svg)](LICENSE)\n\n---\n\n## 2025-2026\
    \ 维护备注\n\n> 2026-07-08 完成仓库卫生治理：扩展 `.gitignore`、确保 `.DS_Store` 不再被跟踪。身心成长与人文领域的最新趋势内容将持续补充。\n"
