  readme_excerpt: '# 减肥知识综合文档数据库（Fat Looser Database）'
  readme_full: '# 减肥知识综合文档数据库（Fat Looser Database）


    > 一个基于循证医学和运动科学的减肥知识体系，涵盖生理学、心理学、医疗干预、健身运动、药物治疗和食疗营养六大核心模块。


    ---


    ## 项目简介


    本数据库旨在构建一套**科学、系统、实用**的减肥知识体系。所有内容基于权威医学文献、临床指南和运动科学研究，采用 Markdown 格式存储，便于检索、维护和版本管理。


    ### 适用人群


    - 希望科学减肥的普通读者

    - 健身教练和营养咨询师

    - 医疗健康从业者

    - 健康管理相关研究人员


    ### 免责声明


    > **重要提示**：本数据库内容仅供参考和教育用途，不构成医疗建议。任何减肥计划的实施，尤其涉及药物治疗和医疗干预，请务必咨询专业医疗人员。


    ---


    ## 内容模块导航


    ### [01 - 生理学基础](./01-physiology/README.md)


    深入理解人体代谢机制、脂肪形成原理和能量平衡，为科学减肥提供理论基石。


    | 文档 | 主题 |

    |------|------|

    | [人体代谢机制](./01-physiology/01-human-metabolism.md) | 基础代谢率、新陈代谢过程、代谢影响因素 |

