    \ RAG~~ ✅；~~Text2SQL~~ ✅；代码生成工作流、多语言 RAG\n- **Agentic**：工具调用安全、Agent 评估基准、人机协作循环\n- **评估**：~~BBH~~ ✅；Arena、自定义评估 Harness、红队测试\n\
    - **Harness**：~~CI 集成评估~~ ✅；A/B 测试框架、生产监控与回滚\n\n---\n\n## \U0001F510 安全说明\n\n### 使用规范\n\n```\n学习环境:\n✅ 仅用于技术学习和技能提升\n\
