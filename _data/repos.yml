    ### 行业清单文件（77个）\n详细检查记录见上方\"已检查文件清单\"部分。\n\n### 已删除的虚假文件（95个）\n包括拉萨系列（9个）、二三线城市虚假清单等，详见历史版本README。\n\n---\n\n## 统计汇总\n\
