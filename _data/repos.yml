    \ — 提供开源硬件设计和文档\n- 算法参考：音频呼吸检测基于 IIR 带通滤波 + 峰值检测经典方案\n- 音效设计：颂钵合成参考金属共振泛音模型 (基频 + ADSR 包络)\n\n## 许可\n\n本项目基于 [MIT License](LICENSE)\
    \ 开源。\n# 小观 Xiao Guan\n\n> 冥想感知开源硬件 — 用呼吸和定力，观照当下\n\n小观是一款开源冥想辅助设备，通过麦克风感知呼吸频率和深度，通过陀螺仪感知身体的晃动和定力。支持手持、放在腿上、或挂在口罩边缘。\n\
    \n## 支持的硬件\n\n| 硬件 | 芯片 | 特点 |\n|------|------|------|\n| **M5Stack StickS3** | ESP32-S3 | 音频质量最好，适合呼吸检测 |\n| **M5Stack\
    \ StickC Plus** | ESP32-PICO-D4 | 最小巧 (16.9g)，适合夹口罩 |\n| **M5Stack Cardputer Adv** | ESP32-S3FN8 | 续航最长 (1750mAh)，有键盘和SD卡\
    \ |\n\n## 功能\n\n- **呼吸检测**：实时检测呼吸频率（次/分钟）和深度（浅/中/深）\n- **定力评估**：通过 IMU 检测身体微动，评估冥想稳定性（0-100分）\n- **冥想引导**：调息→入定→结束，三阶段引导\n\
    - **数据记录**：SD卡/WiFi 保存冥想记录\n- **纯软件模式**：无硬件时可用电脑麦克风运行 Python 陪伴程序\n\n## 项目结构\n\n```\nxiao-guan/\n├── firmware/       \
    \           # 固件代码\n│   ├── shared/                # 共享算法（呼吸检测、定力分析、会话管理、UI、功耗）\n│   ├── stickS3/               # StickS3\
    \ 固件\n│   ├── stickC_plus/           # StickC Plus 固件\n│   └── cardputer_adv/         # Cardputer Adv 固件\n├── companion/\
    \                 # Python 纯软件冥想陪伴程序\n├── docs/                      # 文档\n└── hardware/                  # 3D打印外壳设计（规划中）\n\
    ```\n\n## 快速开始\n\n### 固件开发（需要 PlatformIO）\n\n```bash\n# 1. 安装 VS Code + PlatformIO 插件\n\n# 2. 用 PlatformIO 打开对应设备目录\n\
    #    例如：打开 firmware/stickS3/\n\n# 3. 连接设备，点击 Upload 烧录\n```\n\n### 纯软件模式（需要 Python 3.8+）\n\n```bash\ncd companion\npip\
    \ install -r requirements.txt\n\n# 运行冥想陪伴程序\npython companion.py\n\n# 运行呼吸算法验证\npython validate_breath.py --simulate \
    \   # 模拟测试\npython validate_breath.py               # 实时麦克风测试\n```\n\n## 技术栈\n\n- **固件**：C++ / Arduino 框架 / PlatformIO\n\
    - **算法**：音频 RMS 能量分析 + IIR 带通滤波 + 峰值检测\n- **软件**：Python / NumPy / SciPy / sounddevice\n- **通信**：WiFi AP / SD 卡存储\n\n##\
    \ 许可\n\nMIT License\n# xiao-guan\n小观 ～ 冥想辅助开源硬件\n"
