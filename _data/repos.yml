    \ P0-1 |\n| 01 视唱练耳 | 7 | \U0001F7E1 建设中 | 各子方向仅综述篇，分级训练材料待补 |\n| 02 音乐表演 | 215 | ✅ 核心覆盖 | |\n| 03 作曲理论 | 11 | \U0001F7E1\
    \ 建设中 | 每子方向仅 1 篇，和声/曲式/对位纵深待补 |\n| 04 音乐学 | 575 | ✅ 核心覆盖 | 主干完整；内部洼地见下表 |\n| 05 音乐教育 | 12 | \U0001F7E1 建设中 | |\n| 06\
    \ 音乐科技 | 381 | ✅ 核心覆盖 | |\n| 07 音乐产业 | 11 | \U0001F7E1 建设中 | |\n| 08 指挥 | 20 | ✅ 核心覆盖 | |\n| 09 音乐治疗 | 9 | \U0001F7E1\
    \ 建设中 | |\n| 10 歌单分类 | 80 | \U0001F7E1 建设中 | 含较多待充实 stub，精编计划见改进方案 P2-5 |\n| 11 脑波科学 | 6 | ✅ 核心覆盖 | 篇目少但单篇深度极高 |\n| 14\
    \ 爵士学院 | 9 | \U0001F7E1 建设中 | 九大子方向均已有主干文档 |\n| 15 摇滚学院 | 8 | \U0001F7E1 建设中 | 八大子方向均已有主干文档 |\n| A 音乐院校 | 9 | ✅ 核心覆盖 |\
