    ```\n\n### 安全检查\n\n\U0001F7E1 中风险：会修改系统状态、安装软件或启动/停止服务，但影响范围相对可控。\n> ⚠️ 生产安全提示：\n> - 会修改本地环境或启动服务，建议在测试/开发环境先验证。\n> -\
