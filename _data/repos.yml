  description: '# 佛教三藏数据库'
  readme_excerpt: '# 佛教三藏数据库'
  readme_full: "# 佛教三藏数据库\n\n覆盖北传（大乘）、南传（上座部）、藏传（金刚乘）三大佛教传承的知识库与数据平台。\n\n## 内容统计\n\n| 传承 | 文件数 | 类别 |\n|------|-------:|------|\n\
    | 北传 | 232 | 经典·教义·人物·宗派·禅宗·辞典·戒律·修行·仪轨·止观·论典 |\n| 南传 | 80 | 经典·教义·人物·宗派·禅修·戒律·止观·阿毗达摩·论典·历史·仪轨 |\n| 藏传 | 112 | 经典·密法·人物·宗派·传承·辞典·戒律·修行·仪轨·教义\
    \ |\n| 公共 | 45 | 人物·历史·学术·教义（跨传承比较） |\n| 百科 | 44 | 中英文百科词条 |\n| 学习路径 | 5 | 基础正见→进阶深入→研学精深→实修专修 |\n| **总计** | **518** |\
    \ |\n\n## 目录结构\n\n```\n北传/ 南传/ 藏传/ 公共/ 学习路径/ 百科/   ← 内容（MDX）\nweb/                                        ← Next.js 前端\n\
    infra/                                      ← 基础设施\n  ├─ database/                              Prisma ORM + SQLite\n\
    \  ├─ tools/                                 下载/导入/维护脚本\n  ├─ docs/                                  项目文档与评估\n  └─ catalog/\
    \                               经文元数据索引\n```\n\n## 技术栈\n\n- **前端**：Next.js 16 (Turbopack) + Tailwind CSS + TypeScript\n\
    - **数据库**：SQLite + Prisma ORM（13 个模型）\n- **内容**：MDX（frontmatter + Markdown）\n- **经文源文件**：CBETA XML（汉传）、84000 JSON（藏传）\n\
    \n## 快速启动\n\n```bash\n# 安装依赖\nnpm install\n\n# 生成 Prisma Client\nnpx prisma generate --schema infra/database/prisma/schema.prisma\n\
    \n# 启动开发服务器（端口 3099）\nnpm run dev\n```\n\n## API 端点\n\n| 端点 | 方法 | 功能 |\n|------|------|------|\n| `/api/sutras` | GET\
    \ | 列出所有经典 |\n| `/api/sutras/[id]` | GET | 获取单部经典详情 |\n| `/api/search?q=` | GET | 全文搜索 |\n| `/api/stats` | GET | 数据统计\
    \ |\n\n## URL 结构\n\n```\n/zh/docs/北传/经典/心经\n/zh/docs/南传/教义/四念处\n/zh/docs/藏传/密法/大圆满\n/en/docs/classics/heart-sutra\n```\n\
    \n## 数据来源\n\n| 传承 | 来源 | 授权 |\n|------|------|------|\n| 北传 | [CBETA 中华电子佛典协会](https://cbeta.org/) | 开放资料 |\n| 南传 | [SuttaCentral](https://suttacentral.net/)\
    \ / Buddhist Digital Text Library | CC BY 4.0 |\n| 藏传 | [84000 翻译佛经](https://read.84000.co/) | CC BY 4.0 |\n\n## 脚本\n\n\
    ```bash\n# 下载 CBETA 汉文大藏经\nnpx tsx infra/tools/download/cbeta-download.ts\n\n# 导入全部数据\nnpx tsx infra/tools/import/full-import.ts\n\
    \n# 维护：回填 frontmatter ID\nnode infra/tools/maintenance/backfill-id.mjs\n```\n\n## 许可\n\n内容采用各来源原有授权。CBETA 数据为开放资料，84000\
    \ 与 BDTL 数据为 CC BY 4.0。\n\n## 2025-2026 Web 开发趋势速览\n\n> 以下趋势基于 2025–2026 年行业报告与技术社区动态，供项目演进参考。\n\n### 1. AI 原生开发流程（AI-First\
    \ Development）\n\nAI 编码助手（Cursor、GitHub Copilot）已从代码补全进化为能独立搭建完整功能的\"开发伙伴\"，内测数据显示开发时间缩短约 40%（[LogRocket](https://blog.logrocket.com/8-trends-web-dev-2026/)）。开发者角色正从\"\
    写代码\"转向\"架构审查 + AI 协作\"。\n\n### 2. Next.js 16 + React Server Components 全面成熟\n\nNext.js 16 配合 Turbopack 构建速度提升 10 倍，Server\
    \ Components 可减少包体积达 70%，已成为 45%+ 生产级 React 应用的默认选择（[Flex](https://www.flex.com.ph/articles/nextjs-2026-the-full-stack-framework-revolutionizing-web-development)）。本项目已采用此技术栈，处于行业前沿。\n\
    \n### 3. TypeScript 全栈类型安全 + Server Functions\n\n纯 JavaScript 项目正被淘汰；TypeScript 端到端类型安全配合 tRPC / Server Actions 模糊了前后端边界，后端逻辑以类型化函数而非独立服务形式表达（[LogRocket](https://blog.logrocket.com/8-trends-web-dev-2026/)）。本项目已全面使用\
    \ TypeScript + Prisma 类型化 ORM。\n\n### 4. 边缘计算成为默认部署模式\n\nEdge Runtime 在全球 100+ 节点实现 sub-50ms 延迟，Cloudflare Workers、Vercel\
    \ Edge Functions 使计算贴近用户，成为现代全栈框架的标准部署目标（[Nanobyte Technologies](https://nanobytetechnologies.com/Blog/Web-Development-in-20252026-12-Essential-Trends-Shaping-Modern-Web-Applications)）。\n\
    \n### 5. TanStack 生态 + 现代 CSS 原生能力\n\nTanStack（Query / Router / Table / Form）成为前端逻辑层事实标准，框架无关、模块化；CSS 方面，Container Queries、Cascade\
    \ Layers、Custom Properties 等原生能力与 Tailwind 等工具类框架形成互补（[LogRocket](https://blog.logrocket.com/8-trends-web-dev-2026/)）。\n\
    \n**对开发者的启示**：本项目当前技术栈（Next.js 16 + TypeScript + Prisma + Tailwind CSS）已覆盖上述核心趋势。未来可关注：边缘部署（Edge API Routes）、React Compiler\
    \ 自动优化、以及 AI 辅助内容生成（如自动摘要/翻译佛典内容）。\n"
