  readme_excerpt: '# MOCICI 冥想执行师培训平台'
  readme_full: '# MOCICI 冥想执行师培训平台


    ## 项目概述


    MOCICI是一个专业的冥想执行师培训机构在线平台，支持微信小程序功能迭代、在线营销、私域运营、学员管理和执行师培训等核心业务场景。


    ---


    ## 技术架构


    ### 移动端 (mocici-app)

    - **框架**: uni-app (支持微信小程序 + H5)

    - **状态管理**: Vuex

    - **UI组件**: uni-ui

    - **构建工具**: HBuilderX


    ### 后端服务 (mocici-server)

    - **框架**: Spring Boot 2.2.6

    - **数据库**: MySQL 5.7+

    - **缓存**: Redis 5+

    - **ORM**: MyBatis Plus 3.3.1

    - **API文档**: Swagger 2.9.2


    ### 管理后台 (mocici-admin)

    - **框架**: Vue.js

    - **端口**: http://localhost:9527


    ---


    ## 核心功能模块 (2026版)


    ### 1. 在线营销

    - 营销活动系统 (限时折扣、满减、优惠券)

    - 分销代理系统 (KOC/KOL支持)

    - 课程打包销售

    - 会员等级体系


    ### 2. 私域运营

    - 微信私域引流链路

    - 学员画像分析

    - 精准推送系统

    - 社群运营工具


    ### 3. 学员管理

    - 学员档案管理

    - 学习进度追踪

    - 课程预约系统

    - 证书认证管理


    ### 4. 执行师培训

    - 培训课程管理

    - 师资力量展示

    - 认证考核系统

    - 进阶路径规划


    ### 5. 商城系统

    - 知识付费内容 (图文/音频/视频)

    - 订单管理系统

    - 支付系统 (微信支付)

    - 物流跟踪


    ---


    ## 目录结构


    ```

    mocici-document/

    ├── 1.产品/

    │   ├── 产品需求文档和设计稿均在客户方.txt

    │   ├── 蓝湖产品原型.txt

    │   ├── MOCICI.xmind                    # 功能脑图

    │   ├── Mocici知识商城解决方案-20231012.pdf

    │   ├── 公司材料/                       # 公司资质文件

    │   ├── 墨刀产品原型/                    # 产品原型图

    │   └── 微信支付证书/                    # 支付配置

    ├── 2.源代码/

    │   ├── mocici-app/                    # 微信小程序/H5移动端

    │   ├── mocici-server/                 # Java后端API

    │   └── mocici-admin/                  # Vue管理后台

    └── 3.各种账号密码.txt


    ---


    ## 环境要求


    ### 后端服务

    - Java JDK 1.8

    - Redis 5+

    - MySQL 5.7+

    - Maven 3.6.1


    ### 移动端开发

    - HBuilderX

    - Node.js (用于npm依赖管理)


    ### 管理后台开发

    - Node.js 14+

    - npm or yarn


    ---


    ## 开发指南


    ### 启动后端服务

    ```bash

    cd 2.源代码/mocici-server

    mvn clean install

    mvn spring-boot:run

    ```


    ### 启动管理后台

    ```bash

    cd 2.源代码/mocici-admin

    npm install

    npm run dev

    # 访问 http://localhost:9527

    ```


    ### 移动端开发

    ```bash

    cd 2.源代码/mocici-app

    npm install

    # 使用 HBuilderX 打开项目

    # 运行到微信小程序模拟器或H5

    ```


    ---


    ## 2026年规划方向


    ### 功能迭代重点

    1. **AI智能推荐**: 基于学员学习行为智能推荐课程

    2. **直播带货**: 冥想课程直播功能

    3. **虚拟社群**: 元宇宙冥想空间

    4. **数据中台**: 完善的用户行为分析和营销效果追踪

    5. **自动化运营**: 私域运营自动化工具


    ### 技术升级方向

    1. 微信小程序适配最新API

    2. 引入AI大模型能力 (智能客服、学习推荐)

    3. 性能优化 (首屏加载、包体积控制)

    4. 安全加固 (数据加密、权限细化)


    ---


    ## 文档维护


    本项目文档最后更新于 **2026年5月**


    如需更新功能需求，请联系产品团队获取蓝湖原型的最新设计稿。

    '
