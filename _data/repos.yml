  description: '# dana · 大拿'
  readme_excerpt: '# dana · 大拿'
  readme_full: "# dana · 大拿\n\n> **研究大拿 · 成为大拿**\n\n> **English Summary**: *dana (大拿, \"the great one\") is an open knowledge\
    \ platform studying how legendary engineers and AI researchers grow — and how ordinary developers can systematically become\
    \ better through research-backed, reproducible methods. We curate deep profiles of 88+ tech masters (李运华, Jeff Dean, Ilya\
    \ Sutskever, Jensen Huang, etc.), 75+ billionaire mental models (Musk, Arnault, Ma Yun, Zhang Yiming), 21 proven principles\
    \ (deliberate practice, leverage thinking, second-brain for engineers), and growth paths across 0-12+ years. Built as\
    \ an Obsidian vault + Jekyll site, with AI-era focus, automated audit tooling, and a \"study a great one, then become\
    \ one\" philosophy.*\n\n**dana** 是一个**严肃的开源知识平台**，致力于系统研究技术大拿的成长路径、心法与决策，并帮助有志者通过可复制的方式成为更好的自己。\n\n我们相信：**大拿不是天生的，而是长期主义\
    \ + 正确方法 + 批判性学习 + 持续输出的结果。**\n\n---\n\n## 项目使命\n\n- **研究大拿**：用严谨的方法论，深度剖析真正优秀的工程师\n- **成为大拿**：把研究成果转化为可落地的成长路径和心法\n\n\
    我们拒绝鸡汤、偶像化、成功学，追求**高质量、可复制、批判性**。\n\n> [!important] 当前状态\n> 知识库已进入成熟阶段（68+ 篇高质量 IT 大拿档案 + 72 篇富豪榜研究档案 + 研究方法论 + 系统路径 +\
    \ 可视化 + Web UI）。富豪榜已提升为独立顶级目录，GitHub Pages 已增加导航栏、侧边栏、暗色模式和富豪榜门户页。欢迎直接使用与贡献。\n\n---\n\n## 核心文档（推荐从这里开始）\n\n- [[研究大拿的方法论]]\
    \ — 我们如何研究大拿\n- [[成为大拿的系统路径]] — 从 0 到大拿的完整路线图\n- [[超级个体索引]] — 高度自主的技术人成长案例\n\n---\n\n## 为什么存在这个库？\n\n市面上有太多「XXX 技术从入门到精通」，却很少有人系统回答：\n\
    \n- 一个普通工程师，怎样在 5-10 年内真正脱颖而出？\n- 那些我们仰望的「大拿」，他们的关键转折点和心法到底是什么？哪些是可以学习的？\n- 在信息爆炸的时代，如何建立属于自己的技术判断力与影响力？\n\ndana 试图用**研究方法论\
    \ + 系统路径 + 高质量人物复盘**，给出一个严肃、可操作的回答。\n\n---\n\n## 这个知识库适合谁？\n\n- 工作 2-8 年的技术人，感到「天花板」或「瓶颈」，想系统性突破\n- 希望从「写好业务代码」进化到「有技术影响力」的人\n\
    - 愿意向优秀榜样学习，但不想盲目崇拜，想要**可复制经验**的人\n- 正在构建个人知识体系、第二大脑的技术人\n\n**不适合**：只想快速拿 offer 面试突击、纯技术工具速成、寻求鸡汤的人。\n\n---\n\n## 核心内容结构\n\
    \n| 板块 | 说明 | 代表内容 |\n|------|------|----------|\n| **人物志** | 深度复盘真实大拿的关键选择、心法形成、转折时刻 | 李运华、左耳朵耗子、冯大辉、John Carmack、Jeff\
    \ Dean 等 |\n| **富豪榜** | 2000-2025 福布斯全球 × 胡润百富双榜研究，72 份人物档案 | Elon Musk、Jensen Huang、钟睒睒、马云、黄光裕 + 胡润魔咒 |\n| **心法与原则**\
    \ | 可复用的心智模型与底层逻辑 | 刻意练习、输出倒逼输入、做难事、系统思维、影响力公式 |\n| **成长路径** | 分阶段可执行路线 + 关键决策框架 | 0-3年根基、3-7年突破、7-12年专家、 非线性路径 |\n| **方法论与框架**\
    \ | 立即能用的工具与复盘方法 | 复盘三问法、项目驱动学习法、源码阅读与造轮子策略、第二大脑 for 技术人、写作与分享的杠杆 |\n| **资源库** | 经过严格筛选的外部输入 | 必读书单、必读专栏、访谈、社区 |\n\n所有内容都遵循同一个标准：**深度\
    \ > 广度，行动 > 感悟，具体 > 抽象**。\n\n---\n\n## 可视化支持（Obsidian 专属）\n\n本库已包含 **Obsidian Canvas** 可视化文件（位于 `可视化/` 文件夹）：\n\n- **大拿能力图谱**：不同类型大拿的能力分布\n\
    - **成长路径图**：0-3年 → 3-7年 → 7-12年 的可视化路径\n- **影响力网络**：人物与心法的关联\n\n在 Obsidian 中打开这些 `.canvas` 文件可获得最佳视觉体验。\n\n---\n\n## 如何参与研究大拿\n\
    \n我们欢迎任何人参与“研究大拿”：\n\n1. **提出研究建议**：在 GitHub Issues 中提交你认为值得深入研究的大拿\n2. **提交研究成果**：按照 [[研究大拿的方法论]] 研究后，提交 PR\n3. **分享真实案例**：匿名分享你自己的成长复盘（尤其是\
    \ 3-7 年突破故事）\n4. **改进方法论**：对研究框架提出建议\n\n所有高质量贡献都会被认真 review 并纳入知识库。\n\n---\n\n## 如何使用这个知识库？\n\n### 推荐阅读路径\n\n1. **先读索引**：从\
    \ `索引/` 开始，快速建立全貌\n2. **人物志先行**：挑 2-3 位最打动你的人物，精读他们的「可学习点」\n3. **心法内化**：把 `心法与原则/` 里的模型抄到自己的笔记或卡片里\n4. **对标路径**：找到自己当前阶段的文章，制定\
    \ 3-6 个月小目标\n5. **持续输出**：每读一篇，写一段「我能立刻开始的 1 件事」\n\n### Obsidian / Logseq 使用建议\n\n- 直接把整个仓库作为 vault 打开\n- 充分利用 `[[wikilinks]]`（Obsidian\
    \ 双链语法）和标签系统\n- 推荐建立自己的 `我的复盘/` 文件夹，把读后感和真实案例写进去\n- 定期 review 索引文件，保持知识库鲜活\n\n---\n\n## 内容原则（我们的质量承诺）\n\n- **绝不鸡汤**：每一条原则都配真实故事、具体案例或可验证方法\n\
    - **可复制优先**：讲大拿，更讲「普通人今天能抄的作业」\n- **批判性学习**：偶像也会有局限，我们提炼的是「心法」而非「人设」\n- **长期主义**：不追求短期速成，强调 3-10 年的复利\n- **中文友好**：以中文思考和表达为主，同时保留全球视野\n\
    \n---\n\n## 首批人物选择标准\n\n我们挑选人物的标准是：\n\n1. **可学习性高**：其成长路径有清晰、可复制的阶段和方法\n2. **影响力真实**：在技术社区或公司内被公认的「大拿」而非营销\n3. **多元覆盖**：既有大厂技术专家，也有独立开发者、教育者、极致深度专家\n\
    4. **公开资料丰富**：有足够公开的访谈、文章、演讲可供提炼\n\n首批已纳入/计划纳入：\n- 李运华（阿里资深技术专家，技术大牛养成方法论集大成者）\n- 左耳朵耗子（陈皓，酷壳创始人，深度技术与职业思考）\n- 冯大辉（独立思考者，前淘宝技术\
    \ VP）\n- 丁奇（数据库极致专家，《MySQL 技术内幕》作者）\n- John Carmack（图形学传奇，长期专注的典范）\n- Jeff Dean（Google 传奇工程师，系统设计天花板）\n- 以及更多教育型、开源型、产品技术复合型大拿\n\
    \n---\n\n## 当前已完成内容（2026 年 6 月，Phase 2 进行中 + 1 2 3 多轮执行）\n\n**已建成高质量核心**（含 v1 + Phase 2 第一批完整内容）：\n\n**索引系统**\n- 人物索引、心法索引、路径索引、全部笔记\
    \ + 更新日志\n\n**人物志（完整高质量）**（累计 20+ 位，含「超级个体」专区）\n- 李运华（旗舰）\n- 左耳朵耗子、丁奇、阮一峰、刘大拿、陈硕、尤雨溪、廖雪峰、冯大辉（完整）\n- Rich Hickey、Linus\
    \ Torvalds、Guido van Rossum、Brendan Eich、Bret Victor（完整）\n- 超级个体型（新增重点）：程序员鱼皮、陈天、王福强、DHH、Pieter Levels、纯洁的微笑、Arvid Kahl、司徒正美、Courtland\
    \ Allen、沉默王二、黄勇、Justin Jackson、李松峰、Rob Walling、许令波、Nathan Barry（完整）\n- AI时代关键大拿（2026新增）：Geoffrey Hinton、Yann LeCun、Andrew\
    \ Ng、Demis Hassabis、Andrej Karpathy、Fei-Fei Li、李开复、Ilya Sutskever、Jensen Huang、Rich Sutton、Sam Altman、Mustafa Suleyman、朱松纯、Yoshua\
    \ Bengio、周志华、李航、梁文锋、Jürgen Schmidhuber、Ashish Vaswani、Noam Shazeer、王小川、杨强、Dario Amodei（完整）\n- 本轮（1 2 3）重点：[[Ilya Sutskever]]（更多\
    \ SSI/对齐细节）、[[Sam Altman]]（更多对齐细节）、**新增 [[Dario Amodei]]**（Anthropic、Constitutional AI） + 案例库扩至 16 个 + 匿名案例 + GitHub Pages\
    \ 润色 + 健康审计\n- AI 时代大拿索引已升级为正式小专栏（含类型对比、路径、论文清单、误区 + DeepSeek 报告）\n- 新增 AI 时代特有心法 4 篇 + [[AI研究案例库]]（扩展至 16 个高质量深度复盘案例，新增\
    \ Ilya SSI、Sam 对齐、Dario 新案例；[[AI 时代的组织能力]] 已补充 4 个实战案例） + GitHub Pages 润色（docs/index.md 统计更新 + 部署笔记） + 匿名案例框架 + CONTRIBUTING\
    \ 示例 + 健康审计\n- 新增独立 MOC：[[AI时代大拿索引]]（推荐系统阅读入口）\n- John Carmack（完整短文）\n- Jeff Dean、Martin Fowler、Kent Beck（完整）\n\n**心法与原则（完整高质量）**\n\
    - 刻意练习与及时反馈\n- 做难事：突破舒适区\n- 输出倒逼输入\n- 系统思维与全链路视角\n- 第二大脑 for 技术人\n- 写作与分享的杠杆\n- 如何成为技术超级个体\n- 影响力公式、T 型专家形状（框架）\n- AI\
    \ 时代特有：[[Scaling Law 的哲学]]、[[AI 对齐入门]]、[[AI 时代的组织能力]]（含实战案例）、[[AI 对齐的工程实践]]\n\n**成长路径**\n- 0-3 年、3-7 年（核心）、7-12 年、非线性路径\n\
    \n**方法与资源**\n- 复盘三问法、项目驱动学习法、源码阅读与造轮子策略（方法论与框架）\n- 必读书单（完整）\n- 播客与访谈（完整）\n- 必读专栏与博客（框架）\n\n**维护与模板**\n- 更新日志、人物志模板、心法模板\n\
    - 知识库体检 Checklist\n\n所有核心文章均达到「读完想行动」的质量标准，并大量使用 Obsidian 兼容的 wikilinks、callouts、frontmatter。\n\n---\n\n## 贡献与共建\n\n这个库目前由个人维护，但我们欢迎高质量贡献：\n\
    \n- **欢迎提交**：你对某位大拿的深度复盘（需有独特洞见而非流水账）\n- **欢迎提交**：真实匿名成长案例（3-7 年瓶颈突破故事尤其珍贵）\n- **欢迎补充**：资源库中经过自己验证的高质量材料\n- **暂不接受**：纯技术教程（已有大量优秀仓库）、鸡汤软文、未经深度思考的笔记\n\
    \n**提交前请先阅读现有笔记，理解质量标准。详细贡献流程请参考 [CONTRIBUTING.md](CONTRIBUTING.md)。**\n\n### 贡献者墙\n\n所有被合并的贡献都会记录在 [CONTRIBUTORS.md](CONTRIBUTORS.md)，按贡献类型分级致谢。如果你已经提交过\
    \ PR 并希望被列出，欢迎提 Issue 告知。\n\n---\n\n## 知识库体检 Checklist（每季度执行一次）\n\n- [ ] 所有主要索引中的高优先 wikilink 是否指向实质内容？\n- [ ] 最近 3 个月新增内容是否都遵循了「具体故事\
    \ + 可行动 checklist + 反模式」标准？\n- [ ] 是否有明显过时或低质量内容需要清理或升级？\n- [ ] 人物索引推荐阅读顺序是否仍合理？\n- [ ] 是否需要补充新人物或新心法方向？\n- [ ] README\
    \ 和更新日志是否及时同步？\n\n**下次计划体检**：2026-09（详见 [[更新日志]]）\n\n---\n\n## 项目愿景\n\n我们希望 dana 最终成为：\n\n- 中文技术圈研究大拿最系统、最可信的开源资料库\n-\
    \ 每一个认真想成为更好技术人的工程师，都值得反复阅读的成长手册\n- 一个可以长期迭代、社区共建的“技术人成长操作系统”\n\n---\n\n## 发布与分享\n\n这个知识库已具备对外分享条件：\n\n- **直接使用**：用 Obsidian\
    \ / Typora / VS Code 打开即可\n- **可视化增强**：使用 `可视化/` 下的 `.canvas` 文件\n- **贡献方式**：详见 [CONTRIBUTING.md](CONTRIBUTING.md)\n-\
    \ **长期维护**：遵循知识库体检 Checklist\n\n未来计划：\n- GitHub Pages 在线版本（已准备 `docs/` 结构）\n- Notion 模板\n- 更多研究方法论实践案例\n\n**如何在 GitHub\
    \ Pages 查看**：\n1. 仓库 Settings → Pages\n2. Source 选择 “Deploy from a branch” → Branch: `master` → Folder: `/docs`\n3. 保存后等待部署（几分钟）\n\
    \n推荐仍以 Obsidian 本地使用为主，在线版作为分享入口。\n\n---\n\n## 愿景\n\n我们希望 5 年后，这个库能成为：\n\n- 每一个认真想「成为更好的自己」的技术人，书架上或 Obsidian 里**必备的元能力手册**\n\
    - 「大拿」这个词不再神秘，每个人都能找到属于自己的成长路径\n\n**大拿，从来不是少数人的专利。**\n\n**只是大多数人，缺的是一套正确的方法 + 坚持做对的事的勇气。**\n\n---\n\n## 起步\n\n```bash\n\
    git clone https://github.com/allengaller/dana.git\ncd dana\n# 用 Obsidian / Typora / Vim / 任何你喜欢的工具打开\n```\n\n然后从 `索引/人物索引.md`\
    \ 开始。\n\n---\n\n**最后提醒**：读这些内容本身不等于成长。  \n真正决定你是否能成为大拿的，是**读完之后你做了什么、坚持了多久**。\n\n欢迎开始你的大拿之路。\n\n—— dana 项目 maintainers\n\
    \n*最后更新：2026 年*"
