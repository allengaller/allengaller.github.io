  readme_excerpt: '# hush.ai'
  readme_full: "<div align=\"center\">\n\n# hush.ai\n\n```\n0000001100010000000100011000000\n0000011000100000000010001100000\n\
    0000011001000011100001001100000\n0000010001000100010001000100000\n0000010001001000001001000100000\n0000010011001001001001100100000\n\
    0000010001001000001001000100000\n0000010001000100010001000100000\n0000011001000011100001001100000\n0000011000100000000010001100000\n\
    0000001100010000000100011000000\n```\n\n**把噪音静下来。把答案收成一句话。**\n\n[![CI](https://img.shields.io/github/actions/workflow/status/peace-lab-global/hush.ai/ci.yml?branch=main&label=CI&logo=githubactions&logoColor=white)](https://github.com/peace-lab-global/hush.ai/actions/workflows/ci.yml)\n\
    [![License](https://img.shields.io/badge/License-Apache%202.0-blue.svg)](LICENSE)\n[![Python](https://img.shields.io/badge/python-3.9%2B-blue.svg)](https://www.python.org/downloads/)\n\
    \n</div>\n\n---\n\n## 1. 产品概述\n\n`hush.ai` 是一款面向现代生活压力的智能化心理与冥想陪伴系统。它通过集成大语言模型（LLM）技术，提供两类核心产品：\n\n| 产品 | 说明 |\n|------|------|\n\
    | **hush CLI** | 极简禅意终端工具，支持多种心理调节模式，每次仅输出一句话，帮助用户快速决策与平复心情。 |\n| **小观 (XiaoGuan)** | 具备长期记忆与专业知识储备的 AI 冥想陪伴。支持多角色切换、呼吸练习、冥想追踪与语音交互。\
    \ |\n\n---\n\n## 2. 核心功能\n\n### 2.1 冥想搭子（AI 角色切换）\n\n可选择不同风格的冥想导师进行对话：\n\n| 导师 | 风格标签 | 音色 |\n|------|----------|------|\n\
    | 小观 | 温柔、日常正念、压力缓解 | 女声 |\n| 禅师 | 禅宗、公案、觉悟 | 男声 |\n| 森林派大师 | 森林禅、身体觉察、自然 | 男声 |\n| 藏传上师 | 藏传、慈悲、止观 | 女声 |\n| 道家真人 | 道家、无为、自然\
    \ | 男声 |\n\n### 2.2 冥想追踪\n\n- **情绪签到**：每次冥想前后记录情绪状态（1-10 分）\n- **进度统计**：总冥想次数、总练习分钟、连续天数、平均情绪\n- **本周进度**：可视化展示每日冥想情况\n\
    \n### 2.3 呼吸练习\n\n内置三种呼吸法引导：\n\n- **4-7-8 呼吸**：放松与入睡\n- **方形呼吸**：专注力训练\n- **平静呼吸**：日常减压\n\n### 2.4 RAG 知识增强\n\n- 导入 Markdown\
    \ 格式语料库（支持 YAML frontmatter）\n- 段落感知分块与向量化存储\n- 对话时自动检索相关理论辅助回答\n\n### 2.5 Skills 技能插件\n\n- 模块化技能系统，支持动态导入与挂载\n- 智能体自动根据配置调用技能增强回复\n\
    - 支持批量导入（JSON / 文件上传）\n\n### 2.6 长期记忆系统\n\n自动从对话中提取 7 大维度的记忆：\n\n- 冥想经历、情绪模式、个人偏好\n- 目标进展、重要事件、健康备注、生活背景\n\n### 2.7 语音交互\n\
    \n- **语音输入**：Web Speech API 实时识别\n- **语音合成**：可选音色、语速、音调\n- **流式朗读**：支持边生成边朗读\n\n### 2.8 安全护栏\n\n- 内置危机信号检测\n- 自动识别敏感词并提供专业求助建议\n\
    \n---\n\n## 3. 技术架构\n\n```\n┌─────────────────────────────────────────────────────────────┐\n│                      前台\
    \ (index.html)                       │\n│   冥想搭子 · 呼吸练习 · 进度追踪 · 语音 I/O · 流式对话   │\n└──────────────────────────┬──────────────────────────────────┘\n\
    \                           │ JWT Bearer + Refresh Token\n┌──────────────────────────▼──────────────────────────────────┐\n\
    │                      FastAPI 服务层                           │\n│  ┌──────────┐ ┌──────────┐ ┌──────────┐ ┌──────────┐\
    \    │\n│  │ /api/chat│ │/api/auth │ │/api/skills│ │/api/memory│    │\n│  │ /stream  │ │/refresh │ │           │ │   \
    \       │    │\n│  └────┬─────┘ └────┬─────┘ └────┬─────┘ └────┬─────┘    │\n│       │              │            │   \
    \         │             │\n│  ┌────▼────────────▼────────────▼────────────▼────┐       │\n│  │              Engine (核心编排层)\
    \                 │       │\n│  │  提示词构建 · 知识检索 · 记忆提取 · 技能挂载   │       │\n│  │  导师选择 · 安全过滤 · 危机检测               │  \
    \     │\n│  └────────────────────┬───────────────────────────┘       │\n│                       │                    \
    \                │\n│  ┌────────────────────▼───────────────────────────┐        │\n│  │              LLM 适配层        \
    \                 │        │\n│  │     OpenAI · DeepSeek · 智谱 · Kimi          │        │\n│  │     (自动降级策略)          \
    \                    │        │\n│  └───────────────────────────────────────────────┘        │\n└──────────────────────────┬──────────────────────────────────┘\n\
    \                           │\n         ┌─────────────────┼─────────────────┐\n         ▼                 ▼          \
    \       ▼\n    PostgreSQL          ChromaDB          静态文件\n    (关系数据)         (向量检索)        (Admin)\n```\n\n---\n\n##\
    \ 4. 目录结构\n\n```\nhush.ai/\n├── hushai/\n│   └── meditation/\n│       ├── api/                    # API 路由\n│       │\
    \   ├── admin.py           # 管理后台 API\n│       │   ├── auth.py           # 认证 API\n│       │   ├── chat.py           #\
    \ 对话 API（含 SSE 流式）\n│       │   ├── frontend.py       # 前台认证 API\n│       │   ├── knowledge.py      # 知识库 API\n│     \
    \  │   ├── login.py          # 登录 API\n│       │   ├── meditation.py     # 冥想追踪 API\n│       │   ├── memory.py       \
    \  # 记忆 API\n│       │   ├── skills.py         # 技能插件 API\n│       │   └── teachers.py       # 冥想搭子 API\n│       ├── core/\
    \                  # 核心业务逻辑\n│       │   ├── engine.py         # 对话引擎\n│       │   ├── knowledge.py      # 知识库处理\n│  \
    \     │   ├── llm.py            # LLM 适配层\n│       │   ├── memory.py         # 记忆提取与存储\n│       │   ├── prompt.py    \
    \     # 提示词构建\n│       │   ├── safety.py         # 安全过滤\n│       │   ├── scenes.py         # 场景管理\n│       │   └── skills.py\
    \         # 技能插件\n│       ├── db/                    # 数据库层\n│       │   ├── models.py         # SQLAlchemy 模型\n│    \
    \   │   ├── session.py        # 会话管理\n│       │   └── vector.py         # ChromaDB 接口\n│       ├── admin/            \
    \     # 管理后台\n│       │   ├── router.py        # 管理路由\n│       │   ├── auth.py          # 管理员认证\n│       │   ├── audit.py\
    \         # 审计日志\n│       │   ├── export.py        # 数据导出\n│       │   └── templates/        # Jinja2 模板\n│       └──\
    \ static/               # 前台静态资源\n│           └── index.html        # 前台 SPA\n├── tests/                        # 单元测试\n\
    ├── docs/                         # 文档\n├── scripts/                      # 启动脚本\n└── knowledge/                   # 知识库语料\n\
    ```\n\n---\n\n## 5. API 概览\n\n### 5.1 认证\n\n| 端点 | 方法 | 说明 |\n|------|------|------|\n| `/api/auth/dev-login` | POST |\
    \ 开发模式登录（昵称即可） |\n| `/api/auth/refresh` | POST | 刷新 Access Token |\n\n### 5.2 对话\n\n| 端点 | 方法 | 说明 |\n|------|------|------|\n\
    | `/api/chat/` | POST | 普通对话 |\n| `/api/chat/stream` | POST | SSE 流式对话 |\n| `/api/chat/knowledge` | POST | 知识库问答 |\n|\
    \ `/api/chat/scenes` | GET | 获取场景列表 |\n| `/api/chat/conversations` | GET | 获取对话历史列表 |\n| `/api/chat/conversations/{id}/messages`\
    \ | GET | 获取对话消息 |\n\n### 5.3 冥想功能\n\n| 端点 | 方法 | 说明 |\n|------|------|------|\n| `/api/meditation/session/start` | POST\
    \ | 开始冥想会话 |\n| `/api/meditation/session/end` | POST | 结束冥想会话 |\n| `/api/meditation/mood-checkin` | POST | 情绪签到 |\n| `/api/meditation/stats`\
    \ | GET | 获取进度统计 |\n| `/api/meditation/weekly` | GET | 获取本周进度 |\n\n### 5.4 冥想搭子\n\n| 端点 | 方法 | 说明 |\n|------|------|------|\n\
    | `/api/teachers/list` | GET | 获取导师列表 |\n| `/api/teachers/{id}` | GET | 获取导师详情 |\n| `/api/teachers/select` | POST | 选择导师\
    \ |\n\n### 5.5 其他\n\n| 端点 | 方法 | 说明 |\n|------|------|------|\n| `/api/skills` | GET | 获取技能列表 |\n| `/api/memory` | GET/DELETE\
    \ | 记忆管理 |\n| `/api/knowledge/*` | 多种 | 知识库管理 |\n\n---\n\n## 6. 配置说明\n\n| 变量名 | 说明 | 默认值 |\n|--------|------|--------|\n\
    | `MEDITATION_JWT_SECRET` | JWT 签名密钥 | - |\n| `MEDITATION_OPENAI_API_KEY` | OpenAI API 密钥 | - |\n| `MEDITATION_DEFAULT_LLM_PROVIDER`\
    \ | 默认 LLM 提供商 | `openai` |\n| `MEDITATION_KNOWLEDGE_TOP_K` | 知识库检索数量 | `3` |\n| `MEDITATION_CONVERSATION_MAX_TURNS` |\
    \ 上下文最大轮数 | `20` |\n| `DATABASE_URL` | 数据库连接 URL | SQLite 本地文件 |\n| `CHROMA_DB_DIR` | ChromaDB 存储目录 | `./chroma_db` |\n\
    \n---\n\n## 7. 快速启动\n\n### 7.1 开发模式\n\n```bash\n# 克隆项目\ngit clone https://github.com/peace-lab-global/hush.ai.git\ncd\
    \ hush.ai\n\n# 创建虚拟环境\npython3 -m venv .venv && source .venv/bin/activate\n\n# 安装依赖\npip install -e \".[meditation]\"\n\
    \n# 复制环境变量文件\ncp .env.example .env\n# 编辑 .env 填入必要的 API 密钥\n\n# 启动服务\nbash scripts/start_server.sh\n# 或直接运行\npython -m\
    \ hushai.meditation.app\n```\n\n服务启动后：\n\n- 前台对话: http://localhost:8000\n- 管理后台: http://localhost:8000/admin\n- API 文档:\
    \ http://localhost:8000/debug\n\n### 7.2 生产环境 (Docker)\n\n```bash\n# 配置环境变量\nexport DATABASE_URL=postgresql://user:pass@host:5432/hushai\n\
    export MEDITATION_JWT_SECRET=your-secret-key\n\n# 使用 Docker Compose\ndocker compose up -d\n```\n\n---\n\n## 8. 管理后台\n\n\
    访问 `/admin` 进入管理后台，支持：\n\n- **用户运营**: 用户列表、对话记录、记忆管理\n- **内容运营**: 知识库导入、技能管理、场景管理\n- **数据导出**: CSV/Excel 格式导出\n- **管理员管理**:\
    \ 多管理员账号、审计日志\n- **系统设置**: LLM 参数、检索阈值\n\n---\n\n## 9. 开发指南\n\n### 9.1 代码规范\n\n```bash\n# 代码格式\nruff format .\n\n# 代码检查\n\
    ruff check .\n\n# 运行测试\npytest\n\n# 安全扫描\nmake security\n```\n\n### 9.2 添加新功能\n\n1. **数据库模型**: 在 `db/models.py` 添加模型\n\
    2. **API 端点**: 在 `api/` 下创建路由文件\n3. **业务逻辑**: 在 `core/` 下实现核心逻辑\n4. **前台功能**: 在 `static/index.html` 添加前端逻辑\n5. **测试覆盖**:\
    \ 在 `tests/` 添加单元测试\n\n---\n\n## 10. 更新日志\n\n### v0.2.0 (2026-06)\n\n- ✨ **冥想搭子**: 支持多 AI 角色切换（小观、禅师、森林派、藏传、道家）\n- ✨ **冥想追踪**:\
    \ 情绪签到、进度统计、本周进度可视化\n- ✨ **呼吸练习**: 4-7-8、方形呼吸、平静呼吸三种模式\n- ✨ **流式对话**: SSE 实时流式输出\n- ✨ **Token 刷新**: 自动续期机制\n- ✨ **批量操作**:\
    \ 对话、记忆、知识批量删除\n- ✨ **数据导出**: CSV/Excel 格式支持\n- ✨ **审计日志**: 管理员操作记录\n- \U0001F512 **安全增强**: 危机检测、敏感词过滤\n- \U0001F504 **LLM\
    \ 降级**: 自动切换可用提供商\n\n---\n\n## 11. 贡献\n\n欢迎提交 Issue 和 Pull Request：\n\n- 提交代码前请确保通过 `pytest` 测试\n- 遵循 `ruff` 代码风格规范\n\
    - 新功能模块必须具备单元测试覆盖\n\n详细规范请参考 [CONTRIBUTING.md](CONTRIBUTING.md)。\n\n---\n\n**许可证**: [Apache License 2.0](LICENSE)\n"
