  readme_excerpt: Grok Build (grok)
  readme_full: "<div align=\"center\">\n\n<h1>\n  <picture>\n    <source media=\"(prefers-color-scheme: dark)\" srcset=\"\
    https://media.x.ai/v1/website/spacexai-symbol-white-transparent-0c31957f.png\">\n    <source media=\"(prefers-color-scheme:\
    \ light)\" srcset=\"https://media.x.ai/v1/website/spacexai-symbol-black-transparent-6435cf42.png\">\n    <img alt=\"SpaceXAI\
    \ logo\" src=\"https://media.x.ai/v1/website/spacexai-symbol-black-transparent-6435cf42.png\" width=\"96\">\n  </picture>\n\
    \  <br>\n  Grok Build (<code>grok</code>)\n</h1>\n\n**Grok Build** is SpaceXAI's terminal-based AI coding agent. It runs\
    \ as a\nfull-screen TUI that understands your codebase, edits files, executes shell\ncommands, searches the web, and manages\
    \ long-running tasks — interactively,\nheadlessly for scripting/CI, or embedded in editors via the Agent Client\nProtocol\
    \ (ACP).\n\n[Installing the released binary](#installing-the-released-binary) ·\n[Building from source](#building-from-source)\
    \ ·\n[Documentation](#documentation) ·\n[Repository layout](#repository-layout) ·\n[Development](#development) ·\n[Contributing](#contributing)\
    \ ·\n[License](#license)\n\n![Grok Build TUI](https://media.x.ai/v1/website/universe-tui-screenshot-6f7a0837.png)\n\n\
    **Learn more about Grok Build at [x.ai/cli](https://x.ai/cli)**\n\nThis repository contains the Rust source for the `grok`\
    \ CLI/TUI and its agent\nruntime. It is synced periodically from the SpaceXAI monorepo.\n\nA small `SOURCE_REV` file at\
    \ the root records the full monorepo commit SHA\nfor the version of the code present in this tree.\n\n</div>\n\n---\n\n\
    ## Installing the released binary\n\nPrebuilt binaries are published for macOS, Linux, and Windows:\n\n```sh\ncurl -fsSL\
    \ https://x.ai/cli/install.sh | bash   # macOS / Linux / Git Bash\nirm https://x.ai/cli/install.ps1 | iex          # Windows\
    \ PowerShell\ngrok --version\n```\n\nSee the [changelog](https://x.ai/build/changelog) for the latest fixes,\nfeatures,\
    \ and improvements in each release.\n\n## Building from source\n\nRequirements:\n\n- **Rust** — the toolchain is pinned\
    \ by [`rust-toolchain.toml`](rust-toolchain.toml);\n  `rustup` installs it automatically on first build.\n- **[DotSlash](https://dotslash-cli.com)**\
    \ — required so hermetic tools under\n  [`bin/`](bin/) (notably [`bin/protoc`](bin/protoc)) can download and run.\n  Install\
    \ it and ensure `dotslash` is on your `PATH` **before** building:\n\n  ```sh\n  cargo install dotslash\n  # or: prebuilt\
    \ packages — https://dotslash-cli.com/docs/installation/\n  /usr/bin/env dotslash --help   # sanity check\n  ```\n\n-\
    \ **protoc** — proto codegen resolves [`bin/protoc`](bin/protoc) via DotSlash,\n  or falls back to a `protoc` on `PATH`\
    \ / `$PROTOC`.\n- macOS and Linux are supported build hosts; Windows builds are best-effort\n  and not currently tested\
    \ from this tree.\n\n```sh\ncargo run -p xai-grok-pager-bin              # build + launch the TUI\ncargo build -p xai-grok-pager-bin\
    \ --release  # release binary: target/release/xai-grok-pager\ncargo check -p xai-grok-pager-bin            # fast validation\n\
    ```\n\nThe binary artifact is named `xai-grok-pager`; official installs ship it as\n`grok`. On first launch it opens your\
    \ browser to authenticate — see the\n[authentication guide](crates/codegen/xai-grok-pager/docs/user-guide/02-authentication.md).\n\
    \n## Documentation\n\nFull online documentation is available at\n[docs.x.ai/build/overview](https://docs.x.ai/build/overview).\n\
    \nThe user guide ships with the pager crate:\n[`crates/codegen/xai-grok-pager/docs/user-guide/`](crates/codegen/xai-grok-pager/docs/user-guide/)\n\
    — getting started, keyboard shortcuts, slash commands, configuration, theming,\nMCP servers, skills, plugins, hooks, headless\
    \ mode, sandboxing, and more.\n\n## Repository layout\n\n| Path | Contents |\n|------|----------|\n| `crates/codegen/xai-grok-pager-bin`\
    \ | Composition-root package; builds the `xai-grok-pager` binary |\n| `crates/codegen/xai-grok-pager` | The TUI: scrollback,\
    \ prompt, modals, rendering |\n| `crates/codegen/xai-grok-shell` | Agent runtime + leader/stdio/headless entry points\
    \ |\n| `crates/codegen/xai-grok-tools` | Tool implementations (terminal, file edit, search, ...) |\n| `crates/codegen/xai-grok-workspace`\
    \ | Host filesystem, VCS, execution, checkpoints |\n| `crates/codegen/...` | The rest of the CLI crate closure (config,\
    \ MCP, markdown, sandbox, ...) |\n| `crates/common/`, `crates/build/`, `prod/mc/` | Small shared leaf crates pulled in\
    \ by the closure |\n| `third_party/` | Vendored upstream source (Mermaid diagram stack) — see below |\n\n> [!IMPORTANT]\n\
    > The root `Cargo.toml` (workspace members, dependency versions, lints,\n> profiles) is **generated** — treat it as read-only.\
    \ Prefer editing per-crate\n> `Cargo.toml` files.\n\n## Development\n\n```sh\ncargo check -p <crate>        # always target\
    \ specific crates; full-workspace builds are slow\ncargo test -p xai-grok-config # per-crate tests\ncargo clippy -p <crate>\
    \       # lint config: clippy.toml at the repo root\ncargo fmt --all               # rustfmt.toml at the repo root\n```\n\
    \n## Contributing\n\n> [!NOTE]\n> External contributions are not accepted. See [`CONTRIBUTING.md`](CONTRIBUTING.md).\n\
    \n## License\n\nFirst-party code in this repository is licensed under the **Apache License,\nVersion 2.0** — see [`LICENSE`](LICENSE).\n\
    \nThird-party and vendored code remains under its original licenses. See:\n\n- [`THIRD-PARTY-NOTICES`](THIRD-PARTY-NOTICES)\
    \ — crates.io / git dependencies,\n  bundled UI themes, and **in-tree source ports** (including openai/codex and\n  sst/opencode\
    \ tool implementations)\n- [`crates/codegen/xai-grok-tools/THIRD_PARTY_NOTICES.md`](crates/codegen/xai-grok-tools/THIRD_PARTY_NOTICES.md)\n\
    \  — crate-local notice for the codex and opencode ports (license texts +\n  Apache §4(b) change notice)\n- [`third_party/NOTICE`](third_party/NOTICE)\
    \ — vendored Mermaid-stack index\n"
