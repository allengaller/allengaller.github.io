  readme_full: "# Better Call Saull Database\n\n> 法律知识库与法医学专业数据库\n\n---\n\n## 项目简介\n\n本项目是一个综合性的法律知识库，涵盖法律法规、法律案例、法医学专业知识，以及黄赌毒犯罪治理等多个专题。\n\
    \n---\n\n## 目录结构\n\n```\nbetter-call-saull-database/\n├── docs/                   # 文档网站（docsify）\n├── laws/         \
