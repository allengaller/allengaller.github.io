  description: '# 不花 · 免费美好生活数据库'
  readme_excerpt: '# 不花 · 免费美好生活数据库'
  readme_full: '# 不花 · 免费美好生活数据库


    > 不花，发现身边不花钱的美好。


    「不花」是一个微信小程序，致力于推荐各类免费的美好体验——公园、绿道、风景、疗愈空间、博物馆、图书馆、寺庙、市集、老街、徒步路线、夜景、文化遗产、户外运动场所、海滩滨水、社区活动、日出日落观赏点……一切不花钱的快乐，都值得被发现和分享。


    覆盖全国 **117 城市**，**1030** 条免费地点/活动，**52** 个分类。


    ## 数据库结构


    | 文件夹 | 分类 | 收录数 | 覆盖城市 | 说明 |

    |--------|------|--------|----------|------|

    | `ancient-towns/` | 古镇 | 21 | 上海、丽江、南宁 等17城 | 免费古镇和古镇免费区域 |

    | `architecture/` | 建筑之美 | 18 | 上海、东莞、北京 等17城 | 现代建筑和传统民居 |

    | `beaches/` | 海滩与滨水 | 25 | 三亚、北海、厦门 等17城 | 海滩、河岸、湖畔和海滨栈道 |

    | `birdwatching/` | 观鸟与野生动物 | 17 | 上海、北京、南京 等17城 | 候鸟观测和城市野生动物观赏 |

    | `botanical-gardens/` | 植物园 | 15 | 北京、南京、南宁 等15城 | 城市植物园、花卉专类园和药用植物园 |

    | `bridges/` | 桥梁与观景台 | 21 | 上海、乐山、北京 等16城 | 步行桥、免费观景台和城市制高点 |

    | `camping/` | 露营与野餐 | 17 | 上海、乐山、北京 等14城 | 免费露营地和野餐胜地 |

    | `citywalk/` | 城市漫步路线 | 18 | 上海、北京、北海 等18城 | 精心设计的免费城市漫步路线，串联老街、滨水、历史建筑与市井生活 |

    | `coffee/` | 独立咖啡文化 | 12 | 上海、北京、南京 等12城 | 城市中各具特色的独立咖啡街区和咖啡文化空间 |

    | `community/` | 社区与公益 | 12 | 上海、全国、全国各大城市 等11城 | 社区活动、免费课程和群众文化活动 |

    | `culture/` | 文化遗产 | 58 | 上海、上饶、乌鲁木齐 等32城 | 古建筑、遗址公园、名人故居和非遗体验 |

    | `exhibitions/` | 免费展览 | 12 | 上海、北京、南京 等12城 | 免费开放的艺术展览、画廊、文化中心常设展和城市规划馆 |

    | `farms/` | 农场与田园体验 | 13 | 北京、南宁、广州 等13城 | 田园风光、乡村古道和农事体验 |

    | `festivals/` | 免费节庆与民俗 | 13 | 全国多地、南宁、哈尔滨 等10城 | 传统节庆、民俗活动和庙会 |

    | `flower-viewing/` | 四季赏花 | 12 | 北京、南京、大理 等11城 | 樱花、油菜花、荷花、梅花等季节限定的免费赏花地 |

    | `food-streets/` | 美食街区 | 19 | 东莞、乌鲁木齐、兰州 等19城 | 夜市、美食老街和早市 |

    | `fountain/` | 音乐喷泉 | 11 | 兰州、南京、厦门 等11城 | 城市音乐喷泉和灯光水舞表演 |

    | `free-day/` | 免费开放日 | 12 | 上海、全国、北京 等7城 | 景区和博物馆的免费开放日和免费政策 |

    | `garden-streets/` | 林荫花街 | 14 | 南京、厦门、合肥 等14城 | 林荫大道、花街和城市景观路 |

    | `gov-affairs/` | 政务办事指南 | 85 | 深圳 | 城市市、区级政府机构与街道办事处的地址、电话与官网信息 |

    | `greenways/` | 绿道 | 21 | 上海、东莞、南京 等19城 | 骑行绿道、步行绿道、滨水绿道和森林绿道 |

    | `healing/` | 疗愈空间 | 21 | 乐山、北京、南京 等16城 | 冥想空间、森林浴、禅修和正念步道等心灵疗愈场所 |

    | `hot-springs/` | 天然温泉与冷泉 | 21 | 乌鲁木齐、北京、南京 等21城 | 野温泉、天然冷泉和免费泡脚点 |

    | `islands/` | 免费岛屿 | 15 | 佛山、北海、南昌 等15城 | 江心岛、湖心岛和免费海岛 |

    | `libraries/` | 图书馆与阅读空间 | 16 | 上海、北京、南京 等16城 | 公共图书馆、独立书店和城市书房等免费阅读空间 |

    | `markets/` | 市集与创意空间 | 12 | 上海、南京、广州 等12城 | 周末市集、创意园区和艺术市集 |

    | `markets-free/` | 免费农贸市场 | 14 | 北京、南京、南宁 等12城 | 早市、农贸市场和花鸟市场 |

    | `memorials/` | 纪念地与陵园 | 13 | 北京、南京、南昌 等13城 | 烈士陵园、名人墓园和战争纪念地 |

    | `mosque/` | 清真寺 | 9 | 兰州、北京、南京 等9城 | 具有历史文化价值的清真寺建筑 |

    | `museums/` | 博物馆与美术馆 | 31 | 上海、乐山、佛山 等29城 | 免费开放的博物馆、美术馆以及设有免费开放日的文化场馆 |

    | `night-walks/` | 夜间漫步 | 15 | 上海、兰州、南宁 等15城 | 夜间步行街和夜间滨水步道 |

    | `nightview/` | 夜景与星空 | 23 | 上海、东莞、兰州 等21城 | 城市夜景、星空观测和萤火虫观赏 |

    | `old-industrial/` | 工业遗产 | 10 | 北京、南京、广州 等10城 | 旧工厂改造的工业遗产空间 |

    | `parks/` | 公园 | 61 | 上海、乐山、九江 等41城 | 免费的城市公园、社区公园、郊野公园和湿地公园 |

    | `pets/` | 宠物友好空间 | 12 | 上海、佛山、北京 等12城 | 宠物公园和宠物友好街区 |

    | `photo-spots/` | 免费拍照打卡点 | 17 | 上海、北京、南京 等17城 | 街拍圣地、自然取景地和建筑取景地 |

    | `playgrounds/` | 户外运动与游乐 | 18 | 上海、东莞、佛山 等14城 | 免费运动场、儿童游乐场、滑板公园和攀岩墙 |

    | `rain-snow/` | 雨雪奇观 | 16 | 北京、南京、哈尔滨 等15城 | 赏雨佳处和赏雪胜地 |

    | `rooftop/` | 城市天台与屋顶 | 12 | 上海、北京、南京 等12城 | 可以免费或低价登临的观景天台和屋顶空间 |

    | `scenery/` | 自然风景 | 45 | 上饶、东莞、丽江 等32城 | 山川、湖泊、草甸、峡谷等自然景观的免费观赏点 |

    | `sculpture/` | 城市雕塑与公共艺术 | 13 | 北京、合肥、广州 等13城 | 地标雕塑和公共艺术装置 |

    | `squares/` | 城市广场 | 8 | 南昌、呼和浩特、哈尔滨 等8城 | 地标城市广场、市民广场和广场文化活动 |

    | `street-art/` | 涂鸦与街头艺术 | 18 | 上海、北京、南京 等17城 | 涂鸦墙、公共壁画和装置艺术 |

    | `streets/` | 老街与历史街区 | 42 | 上海、临沂、北京 等30城 | 历史街区、特色小巷和民国建筑群 |

    | `sunrise/` | 日出与日落 | 15 | 厦门、大理、大连 等14城 | 最佳日出点和日落观赏地 |

    | `sunset-list/` | 日落清单 | 13 | 三亚、厦门、哈尔滨 等12城 | 精选中国城市中最值得体验的日落观赏地 |

    | `tea-culture/` | 茶文化空间 | 19 | 南平、大理、宁波 等17城 | 免费品茶和茶园参观 |

    | `temples/` | 寺庙与宗教空间 | 18 | 上海、兰州、北京 等16城 | 佛教寺庙、道观和宗教文化空间 |

    | `trails/` | 徒步与登山 | 17 | 北京、南京、大连 等12城 | 登山步道、郊野徒步路线和溯溪路线 |

    | `underground/` | 防空洞与地下空间 | 12 | 北京、南京、南宁 等12城 | 防空洞纳凉和地下步道 |

    | `universities/` | 大学校园 | 16 | 北京、南京、厦门 等12城 | 历史名校、最美校园和大学博物馆 |

    | `water-play/` | 戏水与亲水 | 12 | 三亚、南宁、天津 等12城 | 溪流戏水、瀑布观赏和天然泳池 |


    ## 数据格式


    每条记录包含以下字段：


    - **城市**：所在城市

    - **地址**：详细地址

    - **分类**：所属子分类

    - **标签**：关键词标签，顿号分隔

    - **简介**：50-100字简要描述

    - **亮点**：核心吸引点

    - **适合人群**：推荐人群

    - **最佳时间**：推荐前往的时间段

    - **交通**：公共交通到达方式

    - **小贴士**：实用提醒和省钱技巧


    可选增强字段（新条目逐步补充）：


    - **开放时间**：营业/开放时段，含闭馆日

    - **费用**：费用标准，免费项目填「免费」，附条件说明

    - **注意事项**：安全提醒、预约要求、禁忌事项

    - **坐标**：经纬度坐标，格式为「纬度,经度」（预留）


    ---


