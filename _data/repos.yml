  readme_full: '# 🐕 任务狗 - Task Dog


    滴答清单（TickTick/Dida365）增强任务管理工具


    ## ✨ 功能特性


    ### 1. 任务分析统计

    - 📊 任务完成情况统计（总任务、已完成、待办、已逾期）

    - 📈 每日/每周任务趋势图表

    - 🎯 优先级分布分析

    - 🏷️ 标签使用统计

    - 📉 完成率趋势追踪


    ### 2. 智能提醒

    - ⏰ 截止日期自动提醒

    - 🔔 每日任务汇总

    - 📅 自定义提醒设置

    - ✅ 提醒状态管理


    ### 3. 任务看板

    - 🎨 可视化看板视图

    - 🏗️ 拖拽任务管理

    - 📋 多项目支持

    - 🎯 状态分组展示


    ### 4. 标签/项目管理

    - 📁 项目创建与管理

    - 🏷️ 标签系统

    - 🎨 项目颜色自定义

    - 🔍 任务筛选


    ### 5. 数据导入/导出

    - 📥 JSON/CSV/Excel 导出

    - 📤 JSON 导入

    - 💾 数据备份与恢复


    ### 6. AI 功能

    - 🤖 AI 生产力分析

    - 💡 任务拆分建议

    - 🎯 优先级建议

    - 📅 每日计划生成

    - 💬 智能助手聊天


    ## 🚀 快速开始


    ### 环境要求

    - Python 3.10+

    - Node.js 18+

    - 滴答清单开发者账号


    ### 1. 克隆项目

    ```bash

    git clone <your-repo-url>

    cd task-dog

    ```


    ### 2. 配置后端

    ```bash

    cd app


    # 创建虚拟环境

    python -m venv venv

    source venv/bin/activate  # Windows: venv\Scripts\activate


    # 安装依赖

    pip install -r requirements.txt


    # 配置环境变量

    cp .env.example .env

    # 编辑 .env 文件，填入你的滴答清单 API 凭证

    ```


    ### 3. 获取滴答清单 API 凭证

    1. 访问 [滴答清单开发者中心](https://developer.dida365.com)

    2. 登录并创建新应用

    3. 获取 `Client ID` 和 `Client Secret`

    4. 将回调地址设置为 `http://localhost:8000/api/v1/auth/callback`

    5. 将凭证填入 `.env` 文件


    ### 4. 启动后端

    ```bash

    # 在 app 目录下

    uvicorn app.main:app --reload --host 0.0.0.0 --port 8000

    ```


    后端服务将运行在 http://localhost:8000

    API 文档: http://localhost:8000/docs


    ### 5. 配置前端

    ```bash

    cd web


    # 安装依赖

    npm install


    # 启动开发服务器

    npm run dev

    ```


    前端将运行在 http://localhost:3000


    ### 6. 配置 OpenAI (可选)

    如需使用 AI 功能，在 `.env` 文件中添加：

    ```

    OPENAI_API_KEY=your_openai_api_key

    OPENAI_MODEL=gpt-4o-mini

    ```


    ## 📁 项目结构


    ```

    task-dog/

    ├── app/                    # 后端 (FastAPI)

    │   ├── api/               # API 路由

    │   │   ├── auth.py        # 认证

    │   │   ├── tasks.py       # 任务

    │   │   ├── projects.py    # 项目

    │   │   ├── analytics.py   # 分析

    │   │   ├── ai.py          # AI 功能

    │   │   ├── reminders.py   # 提醒

    │   │   ├── export.py      # 导入导出

    │   │   └── kanban.py      # 看板

    │   ├── core/              # 核心配置

    │   │   ├── config.py      # 配置

    │   │   ├── database.py    # 数据库

    │   │   └── security.py    # 安全

    │   ├── models/            # 数据模型

    │   │   ├── user.py

    │   │   ├── task.py

    │   │   └── schemas.py

    │   ├── services/          # 业务逻辑

    │   │   ├── ticktick_client.py

    │   │   ├── ai_service.py

    │   │   ├── analytics_service.py

    │   │   ├── reminder_service.py

    │   │   └── export_service.py

    │   ├── main.py            # 入口

    │   └── requirements.txt

    ├── web/                   # 前端 (React + TypeScript)

    │   ├── src/

    │   │   ├── components/    # 组件

    │   │   ├── pages/         # 页面

