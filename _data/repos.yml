    - **总计：200篇** = 172篇主题文章 + 28篇深度研究报告

    - 文章状态分布：`enhanced`（已完成深度升级与逐条溯源）27篇，`draft`（基础版本，待升级）145篇

    - 全部主题文章均含 YAML frontmatter 元数据（title / category / data_cutoff / status / confidence）


    ## 质量等级与路线图


    本库定位为**社会研究语料库与证据索引**。`draft` 不等于可直接引用结论；只有完成来源、数据、方法与伦理复核的 `reviewed` 条目，才应作为对外引用层级。


    | 状态 | 当前数量 | 含义 | 下一步 |

    |------|:---:|------|--------|

    | `draft` | 145 | 基础整理稿，缺 URL/DOI 或方法论复核 | 补来源、置信度、口径说明、方法局限与伦理注意 |

    | `enhanced` | 27 | 已完成深度升级与逐条溯源 | 补复核记录，进入人工 reviewed 流程 |

    | `reviewed` | 0 | 人工事实核查完成 | 作为可对外引用层级维护 |


    优先改进顺序：


    1. 将高引用、高风险主题从 `draft` 升级为 `enhanced`。

    2. 为 `enhanced` 条目补齐 v3.0 方法论块：研究问题、方法局限、伦理注意、复核记录。

    3. 建立人工复核记录后，再将条目标记为 `reviewed`。


    ## 文章结构规范


    每篇主题文章保留核心七章节，并按 v3.0 规范逐步补齐方法论扩展章节：


    1. **研究问题** — 说明本文关注的问题、适用边界与不处理的问题

    2. **核心定义** — 概念边界与争议焦点

    3. **关键数据** — 逐条标注置信度与来源机构

    4. **国内视角** — 中国的制度、现状与政策沿革

    5. **国际视角** — 跨国比较、立法模式与国际组织立场

    6. **学术文献** — 表格形式，含 DOI 或出版信息

    7. **方法局限** — 标明数据、口径、样本与因果识别限制

    8. **伦理注意** — 标明隐私、污名化、二次伤害与表述边界

    9. **相关主题** — 跨分类交叉引用

    10. **参考来源** — `enhanced/reviewed` 全部附可访问 URL 或 DOI

    11. **复核记录** — 记录来源、数据、方法与伦理复核结果


    ## 置信度标注机制


    | 标记 | 含义 | 典型来源 |

    |------|------|----------|

    | 〔A〕 | 官方统计或同行评审研究，可直接引用 | 国家统计局、部委公报、WHO/ILO/IMF 官方统计、SCI/SSCI 期刊论文、生效法律文本与判决 |

    | 〔B〕 | 权威机构报告或估算，方法可查但存在口径差异 | 国际组织评估报告、行业协会数据、智库研究、NGO 指数类产品 |

    | 〔C〕 | 估算、争议数据或来源不明，**待核验** | 媒体引述、小样本调查、无原始出处的流传数字 |


    补充规则：


    - **口径说明块**：当数据涉及跨国比较、指数编制或统计定义分歧时，正文以 `> 口径说明：…` 明示方法学限制

    - **上限规则**：NGO 指数类产品（如 RSF、Freedom House 等）置信度不高于〔B〕；无法定位原始出处的流传数字一律降为〔C〕并注明"待核验"

    - **降级优于删除**：可疑数据保留并标注〔C〕，同时说明其流传路径，便于后续核查


    已在深度升级过程中修正的典型流传错误数据包括：中小学"75%课外辅导参与率"、印度"7900万童工"、日本泡沫"房价跌70%"、美国次贷"800万人失去住房"、"45吨核材料下落不明"等。详见各文章末尾的变更记录。


    ## 质量保障


    - [质量规范.md](质量规范.md) — 写作标准、章节模板、置信度判定规则、方法论要求、状态流转（draft → enhanced → reviewed）

    - [数据来源目录.md](数据来源目录.md) — 按领域整理的权威来源白名单与检索入口

    - [`templates/topic-article.md`](templates/topic-article.md) — v3.0 主题文章模板

    - [`templates/review-checklist.md`](templates/review-checklist.md) — 人工复核清单

    - `scripts/validate.py` — 自动校验 frontmatter、章节结构、数据截止、置信度、来源 URL/DOI、内部链接与质量 warning

    - `scripts/add_frontmatter.py` — 批量补齐元数据的辅助脚本

    - `.github/workflows/quality-check.yml` — 每次推送与 PR 自动运行默认校验，并以非阻塞方式运行 strict 质量看板


    本地校验：


    ```bash

    python3 scripts/validate.py

    python3 scripts/validate.py --strict

    ```


    ## 使用说明


    - 所有数据均标注截止日期，引用前请核对时效性

    - 标〔C〕的数据不应作为论证依据，仅供线索追溯

    - 涉及争议议题时，文章并列呈现对立学术立场（如算法成瘾章节中 Przybylski 与 Twenge/Haidt 学派的分歧），不作单方结论

    '
