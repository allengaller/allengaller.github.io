    \       - 出轨认定：出轨与\"与他人同居\"的区别、重婚界限、法律后果\n       - 财产分割：夫妻共同财产认定、房产/股权分割、隐匿财产追查\n       - 子女抚养：抚养权归属原则、抚养费计算、探视权保障\n \
    \      - 损害赔偿：法定过错情形、精神损害赔偿、举证要点\n       - 证据收集：合法取证方法、证据保全公证、证据链构建\n       - 特殊类型：涉外离婚管辖与法律适用、军婚特殊保护\n       - 实务操作：离婚协议起草、离婚诉讼策略、典型案例分析\n\
    \n9. **反诈专题**：访问 `telecom-fraud/README.md` 了解电信诈骗全貌\n   - 技术原理：GOIP、伪基站、AI诈骗等技术解析\n   - 产业链：从信息窃取到洗钱套现的全链条分析\n   - 黑话术语：50+行业黑话，解密犯罪沟通方式\n\
    \   - 防范指南：个人、企业、特殊群体全方位防护\n   - 典型案例：17+真实案例深度剖析\n\n10. **法律自媒体**：访问 `legal-media/README.md` 查找全网优质法律账号\n    - 平台分类：抖音、B站、微博、小红书、知乎、微信公众号\n\
    \    - 专业领域：刑法、民法、劳动法、婚姻家事、公司法等\n    - 头部账号：各平台TOP10账号速览\n    - 内容分析：内容形式、创作趋势、变现模式\n    - 关注建议：按需求推荐的账号清单\n    - 法律纪录片：225+部优质纪录片，涵盖中美日韩及欧洲\n\
    \    - 法律文艺作品：290+部作品，小说、电影、电视剧、戏剧等\n\n---\n\n## 更新日志\n\n| 日期 | 更新内容 |\n|------|----------|\n| 2026-07-30 | **法律库大扩容**：新增\
