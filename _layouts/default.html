<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>{{ page.title }}</title>
  <meta name="description" content="{{ page.description }}">
  <meta name="robots" content="{{ page.robots | default: 'index,follow' }}">
  <meta name="theme-color" content="#111111" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
  <meta name="generator" content="allengaller.github.io (custom Python builder)">

  <!-- Favicons -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png">

  <!-- PWA / Mobile web app -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Allen Galler">
  <meta name="application-name" content="Allen Galler">
  <meta name="format-detection" content="telephone=no">

  <!-- Canonical & hreflang -->
  <link rel="canonical" href="https://allengaller.github.io{{ page.url }}">
  <link rel="alternate" hreflang="zh-CN" href="https://allengaller.github.io{{ page.url }}">
  <link rel="alternate" hreflang="x-default" href="https://allengaller.github.io{{ page.url }}">

  <!-- RSS / Atom feed -->
  <link rel="alternate" type="application/atom+xml" title="Allen Galler — Repos" href="/feed.xml">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Allen Galler">
  <meta property="og:title" content="{{ page.title }}">
  <meta property="og:description" content="{{ page.description }}">
  <meta property="og:url" content="https://allengaller.github.io{{ page.url }}">
  <meta property="og:locale" content="zh_CN">
  <meta property="og:image" content="https://allengaller.github.io/og-default.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Allen Galler — Cloud Native SRE · AI Toolsmith · Knowledge Architect">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page.title }}">
  <meta name="twitter:description" content="{{ page.description }}">
  <meta name="twitter:image" content="https://allengaller.github.io/og-default.png">
  <meta name="twitter:image:alt" content="Allen Galler — Cloud Native SRE · AI Toolsmith · Knowledge Architect">

  <!-- Security headers (meta equivalents — full headers need server config) -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
  <meta http-equiv="Permissions-Policy" content="accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=()">

  <!-- JSON-LD (overridden per page; empty when not set) -->
  <script type="application/ld+json" class="page-jsonld">{{ page.jsonld }}</script>

  <!-- Fonts: variable Fraunces (display) + Geist (body) + JetBrains Mono (code) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,300..900,0..100,0..1&family=Geist:wght@300..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/assets/css/main.css">
  <script src="/assets/js/site.js" defer></script>
  <script src="/assets/js/palette.js" defer></script>
</head>
<body>

  <a href="#main" class="skip-link">跳到主要内容</a>

  <header class="site-nav-wrap">
    <nav class="site-nav" aria-label="主导航">
      <a href="/" class="{{ page.nav_active_home }}"{% if page.nav_active_home %} aria-current="page"{% endif %}>Home</a>
      <a href="/projects/" class="{{ page.nav_active_projects }}"{% if page.nav_active_projects %} aria-current="page"{% endif %}>Projects</a>
      <a href="/repos/" class="{{ page.nav_active_repos }}"{% if page.nav_active_repos %} aria-current="page"{% endif %}>Repos</a>
      <a href="/GTM/" class="{{ page.nav_active_gtm }}"{% if page.nav_active_gtm %} aria-current="page"{% endif %}>GTM</a>
      <a href="/about/" class="{{ page.nav_active_about }}"{% if page.nav_active_about %} aria-current="page"{% endif %}>About</a>
      <a href="https://github.com/allengaller" target="_blank" rel="noopener">GitHub ↗</a>
      <a href="#" class="palette-hint" data-palette-trigger aria-label="打开命令面板 (Cmd+K)">⌘ K</a>
    </nav>
  </header>

  <main id="main" class="site-main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="footer-row">
      <span class="footer-mark">曹亚仑</span>
      <span class="footer-text">Build in public · learn in public</span>
      <span class="footer-meta">2026</span>
    </div>
    <div class="footer-row footer-row-sub">
      <a href="/repos/" class="footer-link">Repos</a>
      <a href="/topic/links/" class="footer-link">Links</a>
      <a href="/topic/ai-tools/" class="footer-link">AI Tools</a>
      <a href="https://github.com/allengaller/allengaller.github.io" target="_blank" rel="noopener" class="footer-link">Source ↗</a>
      <a href="/humans.txt" class="footer-link">humans.txt</a>
      <a href="/sitemap.xml" class="footer-link">sitemap</a>
      <span class="footer-text-sub">·  Open source · MIT</span>
    </div>
  </footer>

</body>
</html>
