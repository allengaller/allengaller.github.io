<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <!-- Page renders light by default regardless of OS preference; the
       data-theme="dark" CSS block flips color-scheme to dark instead. -->
  <meta name="color-scheme" content="light">
  <title>{{ page.title }}</title>
  <meta name="description" content="{{ page.description }}">
  <meta name="robots" content="{{ page.robots | default: 'index,follow' }}">
  <meta name="theme-color" id="meta-theme-color" content="#fcfcfa">
  <meta name="generator" content="allengaller.github.io (custom Python builder)">

  <!-- Favicons -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png">

  <!-- PWA / Mobile web app -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Allen Galler">
  <meta name="application-name" content="Allen Galler">
  <meta name="format-detection" content="telephone=no">

  <!-- Canonical & hreflang -->
  <link rel="canonical" href="https://allengaller.github.io{{ page.url }}">
  <!-- One language, one URL — no alternate exists to cluster, so only x-default. -->
  <link rel="alternate" hreflang="x-default" href="https://allengaller.github.io{{ page.url }}">

  <!-- RSS / Atom feed -->
  <link rel="alternate" type="application/atom+xml" title="Allen Galler — Repos" href="/feed.xml">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Allen Galler">
  <meta property="og:title" content="{{ page.title }}">
  <meta property="og:description" content="{{ page.description }}">
  <meta property="og:url" content="https://allengaller.github.io{{ page.url }}">
  <meta property="og:locale" content="zh_CN">
  <meta property="og:image" content="https://allengaller.github.io/og-default.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Allen Galler — Cloud Native SRE · AI Toolsmith · Knowledge Architect">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page.title }}">
  <meta name="twitter:description" content="{{ page.description }}">
  <meta name="twitter:image" content="https://allengaller.github.io/og-default.png">
  <meta name="twitter:image:alt" content="Allen Galler — Cloud Native SRE · AI Toolsmith · Knowledge Architect">

  <!-- Security headers (meta equivalents — full headers need server config) -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
  <meta http-equiv="Permissions-Policy" content="accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=()">

  <!-- JSON-LD: omitted entirely when a page declares none, so crawlers never see an empty block -->
  {% if page.jsonld %}<script type="application/ld+json" class="page-jsonld">{{ page.jsonld }}</script>{% endif %}

  <!-- Fonts: self-hosted variable woff2 (see main.css @font-face). Preload the
       two faces that paint above the fold; Google Fonts is unreachable from CN
       networks and must never be reintroduced as a render-blocking stylesheet. -->
  <link rel="preload" href="/assets/fonts/geist-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/fraunces-latin-full-normal.woff2" as="font" type="font/woff2" crossorigin>
  {% if page.ledger_chrome %}<link rel="preload" href="/assets/fonts/iosevka-charon-mono-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/iosevka-charon-mono-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>{% endif %}

  <!-- Must run before first stylesheet/paint: restores the saved theme so a
       dark-mode visitor never sees a light flash. Default stays light. -->
  <script>(function(){try{if(localStorage.getItem('theme')==='dark'){document.documentElement.dataset.theme='dark';var m=document.getElementById('meta-theme-color');if(m)m.setAttribute('content','#131210');}}catch(e){}})();</script>
  <link rel="stylesheet" href="/assets/css/main.css">
  <!-- Must run before first paint: main.css hides [data-reveal] only under .js,
       so a browser that never executes site.js still shows the whole page. -->
  <script>document.documentElement.className += ' js';</script>
  <script src="/assets/js/site.js" defer></script>
  <script src="/assets/js/palette.js" defer></script>
</head>
<body{% if page.ledger_chrome %} class="chrome-ledger"{% endif %}>

  <a href="#main" class="skip-link">跳到主要内容</a>

  <header class="site-nav-wrap">
    <nav class="site-nav" aria-label="主导航">
      <a href="/" class="{{ page.nav_active_home }}"{% if page.nav_active_home %} aria-current="page"{% endif %}>Home</a>
      <a href="/projects/" class="{{ page.nav_active_projects }}"{% if page.nav_active_projects %} aria-current="page"{% endif %}>Projects</a>
      <a href="/repos/" class="{{ page.nav_active_repos }}"{% if page.nav_active_repos %} aria-current="page"{% endif %}>Repos</a>
      <a href="/GTM/" class="{{ page.nav_active_gtm }}"{% if page.nav_active_gtm %} aria-current="page"{% endif %}>GTM</a>
      <a href="/about/" class="{{ page.nav_active_about }}"{% if page.nav_active_about %} aria-current="page"{% endif %}>About</a>
      <a href="https://github.com/allengaller" target="_blank" rel="noopener">GitHub ↗</a>
      <button type="button" class="theme-toggle" data-theme-toggle aria-pressed="false" aria-label="切换到深色模式" title="切换到深色模式">
        <svg class="icon-moon" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="icon-sun" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32 1.41-1.41"/></svg>
      </button>
      <button type="button" class="palette-hint" data-palette-trigger aria-haspopup="dialog" aria-keyshortcuts="Meta+K Control+K /" aria-label="打开命令面板 (Cmd+K)">⌘ K</button>
    </nav>
  </header>

  <main id="main" class="site-main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="footer-row">
      <span class="footer-mark">Allen Galler</span>
      <span class="footer-text">Build in public · learn in public</span>
      <span class="footer-meta">{{ stat.year }}</span>
    </div>
    <div class="footer-row footer-row-sub">
      <a href="/repos/" class="footer-link">Repos</a>
      <a href="/topic/links/" class="footer-link">Links</a>
      <a href="/topic/ai-tools/" class="footer-link">AI Tools</a>
      <a href="https://github.com/allengaller/allengaller.github.io" target="_blank" rel="noopener" class="footer-link">Source ↗</a>
      <a href="/humans.txt" class="footer-link">humans.txt</a>
      <a href="/sitemap.xml" class="footer-link">sitemap</a>
      <span class="footer-text-sub">·  Open source · <a href="/licensing/" class="footer-license">MIT</a></span>
    </div>
  </footer>

</body>
</html>
